# Vantage UI example apps — authoritative catalog.
#
# The website (vantage-ui.com) loads this file at build time to render the
# examples grid and the `vantage://` one-click install links. vantage-web2
# keeps a committed fallback copy at static/examples-catalog.yaml; keep the two
# in sync.
#
# status:      "available" (folder exists, archive published) | "coming" (planned)
# min_version: lowest Vantage UI version that can open the example. The app
#              displays this and disables Install on older builds. Bump it when
#              an example starts relying on a newer feature.
# url:         the published archive. The in-app gallery lists only entries
#              that carry one (tour-only entries stay website-only).
apps:
  - slug: launch-control
    title: "Launch Control"
    persona: "Live data"
    persona_url: "/solutions/live-data/"
    status: "available"
    min_version: "0.15.0"
    icon: "rocket_launch"
    blurb: "A live mission-control console for global spaceflight — 15 related entities, real-time launch countdowns and a deliberately flaky API the UI rides straight through. A full Rust server plus a YAML console."
    repo_path: "apps/launch-control"
    url: "https://vantage-ui.com/examples/launch-control.zip"
    screenshot: "images/vantage-ui-app.png"
    tour_url: "/examples/launch-control/"
    demonstrates:
      - "A real REST API consumed as drillable tables"
      - "Live, self-refreshing grids resilient to a flaky server"
      - "A full Rust + Vantage backend, modeled and served"

  - slug: periscope
    title: "Periscope"
    persona: "Internal tools"
    persona_url: "/solutions/internal-tools/"
    status: "available"
    min_version: "0.20.0"
    icon: "lan"
    blurb: "A Lens-style control room for Kubernetes — nodes, namespaces and every standard workload as drillable, related tables, with capacity dashboards and vertical drill-downs. Backed by a native Kubernetes datasource: no kubectl, no proxy."
    repo_path: "apps/periscope"
    url: "https://vantage-ui.com/examples/periscope.zip"
    screenshot: "images/changelog/0.20/01-full.webp"
    tour_url: "/examples/periscope/"
    demonstrates:
      - "A native Kubernetes API datasource (the vantage-kubernetes backend)"
      - "Relation drill-downs: namespace → workloads → pods, node → pods"
      - "Capacity dashboards and burger-layout vertical explorers"

  - slug: library-story
    title: "Library Story"
    persona: "App builders"
    persona_url: "/solutions/app-builders/"
    status: "available"
    icon: "auto_stories"
    blurb: "A storybook tutorial: Miss Odessa builds a live catalogue for her little library with the AI assistant she already trusts. Read along, copy her prompts into your own agent, and end up with an app of your own."
    screenshot: "images/library/library-story-card.png"
    tour_url: "/library/"
    demonstrates:
      - "Your own agent building a Vantage app from plain-English prompts"
      - "A SQLite prototype: books, members, loans and a dashboard"
      - "A story that grows toward the cloud, APIs and a barcode scanner"

  - slug: breg-bakery
    title: "Breg bakery franchise"
    persona: "Internal tools"
    persona_url: "/solutions/internal-tools/"
    status: "available"
    # 0.40: the setup wizard's `composer: true` step — an older binary
    # rejects the step spec at validation, so this content must not
    # reach one.
    min_version: "0.40.0"
    icon: "storefront"
    blurb: "A live back-office for the Breg bakery chain — Vantage runs SurrealDB for you, ✨ magic processes sign clients, restock ovens and chase invoices in real time, and the dashboard moves while they run."
    repo_path: "apps/breg-bakery"
    url: "https://vantage-ui.com/examples/breg-bakery.zip"
    screenshot: "images/vantage-ui-app.png"
    demonstrates:
      - "A composer.yaml Vantage runs for you — services start from the setup wizard, stop with the app"
      - "Commands in containers, promoted to background jobs you stop from the Services sheet"
      - "A real-time dashboard: query-sourced charts and tiles, narrowed by one dropdown"
      - "Every action kind in one app, from a confirm up to the setup wizard"

  - slug: faker-demo
    title: "PristineGym (faker)"
    persona: "Live data"
    persona_url: "/solutions/live-data/"
    status: "available"
    # 0.41: list templates use `${…}` holes; earlier builds print them literally.
    min_version: "0.41.1"
    icon: "monitoring"
    blurb: "A gym control panel with no backend at all — every table is generated in memory and keeps moving on its own: a live regional dashboard, a check-in stream, self-escalating incidents you can act on, and a lab of flaky, sluggish and churning backends to watch the UI cope with."
    repo_path: "apps/faker-demo"
    url: "https://vantage-ui.com/examples/faker-demo.zip"
    screenshot: "images/vantage-ui-app.png"
    demonstrates:
      - "Zero setup: the faker datasource needs no server, network or credentials"
      - "Live pages without polling — pulse, fifo, rhai and live_folder effects push every change"
      - "User writes and scripted mutations sharing one in-memory table"
      - "Backend personalities: faults, latency, slow search and churn, made visible"

  - slug: spacex
    title: "SpaceX GraphQL explorer"
    persona: "Data mesh"
    persona_url: "/solutions/data-mesh/"
    status: "coming"
    min_version: "0.14.0"
    icon: "rocket_launch"
    blurb: "Explore a public GraphQL API through the console — launches, rockets and capsules as browsable, drillable tables."
    repo_path: "apps/spacex"
    screenshot: ""
    demonstrates:
      - "A read-only GraphQL datasource"
      - "Master/detail drill-down across related records"

  - slug: aws-console
    title: "AWS control console"
    persona: "Internal tools"
    persona_url: "/solutions/internal-tools/"
    status: "coming"
    min_version: "0.15.0"
    icon: "cloud"
    blurb: "Build the AWS console you actually need — surface only the resources you operate, by wrapping the aws CLI as tables."
    repo_path: "apps/aws-console"
    screenshot: ""
    demonstrates:
      - "Command-line (CLI) data sources"
      - "Infrastructure browsed and drilled like database tables"
