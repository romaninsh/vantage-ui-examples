# Table: activity — the raw incoming feed (an append log): each change
# is a new row — the signed `delta` that moved a city and when —
# newest-first, expiring after a few seconds so the stream visibly
# flows. Fed by the shared `dispatch` pulse sim's feed half.
datasource: dispatch
title: Activity
faker: { count: 0 }
columns:
  - { name: id, type: string, flags: [id, hidden] }
  - { name: city, type: string, flags: [title, searchable] }
  - { name: delta, type: int }
  - { name: updated, type: string }
