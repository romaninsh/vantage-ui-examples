# yaml-language-server: $schema=./page-schema-1.json
# What each app release pins each dependency crate to; filter by crate.
title: Dependency Pins
body:
  - kind: select
    name: dep
    observe: package
    params:
      all_label: All dependencies
      column: name
  - kind: grid
    name: dependency_pins
    observe:
      script: |
        let v = "${dep.value}";
        if v == "" || v == "All dependencies" { scenery("dependency_pin") }
        else { scenery("dependency_pin").where("dep_package_id", v) }
    params:
      refresh_interval: 5
      columns:
        release.version: { label: Release, width: 130 }
        package.name: { label: Dependency, width: 220 }
        pinned_version: { label: Pinned, width: 130 }
        source_ref: { label: Source Ref, width: 130 }
      default_sort: { column: release.version, direction: desc }
