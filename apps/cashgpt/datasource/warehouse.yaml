# yaml-language-server: $schema=./datasource-schema-1.json
type: postgres
description: "cashgpt LLM-spend warehouse — pre-aggregated gold.mart_* tables over a 500k-employee simulation (silver holds the atomic star schema; this app reads gold only)."
# `warehouse` is the composer.yaml service; Vantage rewrites `warehouse:5432`
# to the loopback port docker published while the stack runs. Throwaway
# container credentials for a generated dataset, kept inline so the example
# runs with no setup step. Anything with real data belongs in an env-backed
# URL instead.
url: "postgres://cashgpt:cashgpt@warehouse:5432/cashgpt?options=-c%20search_path%3Dgold,silver"

