# Grade tilts the draw. Seniors are likelier to abstain and, when they do use
# it, to reach for the expensive model — they have less time and more licence.
# Applied as a multiplier on the profile weight, interpolated by rank 1..8.
seniority_modifier:
  ABSTAINER:     { rank1: 0.85, rank8: 2.20 }
  DABBLER:       { rank1: 1.00, rank8: 1.40 }
  OCCASIONAL:    { rank1: 1.00, rank8: 1.20 }
  STEADY_CHAT:   { rank1: 1.05, rank8: 0.80 }
  DOMAIN_WORKER: { rank1: 1.20, rank8: 0.55 }
  POWER_CODER:   { rank1: 1.15, rank8: 0.35 }
  AGENT_RUNNER:  { rank1: 0.80, rank8: 0.70 }
  ANALYST_HEAVY: { rank1: 0.90, rank8: 0.90 }
  BATCH_OPERATOR: { rank1: 1.00, rank8: 0.60 }
  LATE_BLOOMER:  { rank1: 1.00, rank8: 1.10 }
  RUNAWAY:       { rank1: 0.70, rank8: 1.30 }

# Intensity also scales with grade — a VP's agent run costs more than an
# analyst's because they point it at bigger problems.
intensity_by_rank: [0.72, 0.88, 1.15, 1.30, 1.45, 1.55, 1.80, 2.60]

# When adopters start, as a share of all of them. Bank-wide.
#
# A profile's own `start` window MASKS this and the remainder is renormalised,
# so a late bloomer still cannot start in January while the overall shape stays
# under one control.
#
# THIS IS NOT THE JUNE STEP. January is already a $3.27m month, so the bank
# opens the year with a real user base — Copilot and the Azure agreement were
# both in place long before. What June adds is intensity, not headcount: see
# usage_ramp.
start_curve: [0.19, 0.09, 0.12, 0.15, 0.17, 0.22, 0.06]

# Bank-wide intensity ramp — a multiplier on every active person's token level
# for that month. Adoption explains who is using it; this explains how hard.
#
# THIS IS THE JUNE STEP. May to June is 2.57x on a base that grew 19%, so it
# cannot be adoption: it is the Bedrock gateway going live across engineering
# and frontier models becoming reachable at volume from inside the estate. The
# jump lives here rather than in any profile because it happened TO everyone at
# once, which is exactly what an infrastructure change looks like.
#
# See schema/catalog/models.yaml (platforms.live_from) and
# data/reference/company-story.md.
usage_ramp: [0.94, 0.72, 0.66, 0.81, 0.87, 1.48, 1.93]
