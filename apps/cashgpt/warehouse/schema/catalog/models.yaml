# Model catalogue.
#
# STATIC. Identity, lifecycle and price.
#
# `list` is blended $ per 1M tokens at published rates, at the ~80/20
# input/output mix these workloads run. USD throughout: the bank reports in
# sterling but every one of these vendors bills in dollars.
#
# The rate actually paid is list less the discount negotiated with that
# counterparty — see `discounts` below. A bank putting 500,000 seats and
# committed-use volume on the table does not pay rack rate, and the providers
# where the spend concentrates give up the most.
#
# ONE RATE, NOT AN INPUT/OUTPUT PAIR. Output really does cost 3-5x input, and
# real metering separates them — but no dashboard shows the split, so carrying
# it would be two columns nobody reads. The day an agentic-workload panel wants
# "output-heavy costs more", split it then.
#
# ONE RATE, NOT A RATE TABLE. Prices here never change, so a rate is an
# attribute of the model rather than a slowly-changing fact. A dim_rate keyed by
# effective period would be a table with exactly one row per model, forever.
#
# THREE NAMES, THREE DIFFERENT QUESTIONS:
#   provider   who you pay. Copilot is billed by GitHub.
#   vendor     who built it. Copilot is built by Microsoft.
#   family     the product line, for grouping variants.
# They collapse for most models and diverge for exactly the ones that matter.
#
# provider_group is the six-bucket reporting rollup the dashboards use. It is a
# presentation concern living on a silver row, which is a compromise: the
# alternative is a dim_provider table for what is currently a fixed mapping.
# Promote it if providers ever need contract terms or billing entities.
#
# LIFECYCLE drives the trend. released/retired are what make "this tier faded
# out over the spring" a fact you can derive rather than an array someone typed.
# Months are inclusive: retired 2026-04 means April was its last month.
#
#   node scripts/silver/models.mjs

meta:
  period: [2026-01, 2026-07]

# Negotiated discount off list, by counterparty — you negotiate with the entity
# that invoices you, not with the model. Leverage tracks spend: the two
# providers carrying most of the bill concede the most, seat-licensed products
# have little room, and the long tail has none.
discounts:
  default:      0.15
  Anthropic:    0.44
  OpenAI:       0.40
  Amazon:       0.36
  Google:       0.34
  GitHub:       0.28
  Microsoft:    0.30
  Meta:         0.22
  Mistral AI:   0.20
  Cohere:       0.20
  DeepSeek:     0.18

# ---------------------------------------------------------------------------
# PLATFORMS — how a model is served, which is not who built it.
#
# This is the axis the invoice actually arrives on. Claude Sonnet called through
# Bedrock is a line on the AWS bill, not the vendor's own, and the same model
# reached three different ways produces three different invoices. `vendor`
# answers "who made this"; platform answers "who charges us for it".
#
# A model routes to whichever platforms serve its provider. The simulator picks
# one per usage row, weighted, so a single model genuinely does bill through
# several routes at once — which is the whole point of the axis.
#
# `availability` IS INTERNAL REACH, NOT VENDOR RELEASE. A model existing is not
# the same as a bank being able to call it. Procurement, security review, DPIA,
# network egress and a gateway integration all sit between the two, and they
# take months. Each number is the share of the bank that can actually route
# through this platform in that month; a person either has access or does not,
# consistently, because entitlements are granted to people and not re-rolled
# every month.
#
# This is what makes January light without anybody pretending January's users
# were feeble: in January most of the bank simply could not reach most of the
# catalogue. `first_wave` names the disciplines that get it first — a gateway is
# rolled out to the engineers who asked for it before it becomes an entitlement.
#
# `live_from` IS THE JUNE EVENT. The Bedrock gateway going live across
# engineering in June is what turned a $9.71m month into a $24.96m one: it is
# not that people suddenly appeared, it is that frontier models became reachable
# at volume from inside the estate. Before June there is no Bedrock line on the
# invoice at all. See data/reference/company-story.md.
# ---------------------------------------------------------------------------
platforms:
  - code: aws-bedrock
    name: Amazon Bedrock
    billed_by: Amazon
    live_from: 2026-06
    note: The gateway. Live across engineering in June, opened to the rest of the bank in July.
    serves: [Anthropic, Amazon, Meta, Mistral AI, Cohere, AI21 Labs, DeepSeek]
    weight: 15.0
    availability: [0, 0, 0, 0, 0, 0.60, 0.95]
    first_wave: [engineering, data, product, analytics]

  - code: claude-direct
    name: Claude
    billed_by: Anthropic
    live_from: 2026-01
    note: >
      Direct API keys, issued team by team. The only route to Claude before the
      gateway and never a general entitlement — which is why it plateaus rather
      than growing with the bank.
    serves: [Anthropic]
    weight: 4.6
    availability: [0.26, 0.33, 0.40, 0.47, 0.53, 0.56, 0.57]

  - code: azure-openai
    name: Azure OpenAI
    billed_by: Microsoft
    live_from: 2026-01
    note: The enterprise agreement that was already in place, so it starts the year at near-full reach.
    serves: [OpenAI, Microsoft]
    weight: 8.4
    availability: [0.84, 0.87, 0.90, 0.92, 0.93, 0.94, 0.95]

  - code: github-copilot
    name: GitHub Copilot
    billed_by: GitHub
    live_from: 2026-05
    note: >
      Seat-licensed and metered separately. Procured in the spring and rolled
      out to engineering from May, so it is absent for the first four months and
      then climbs fast as seats are issued — the shape of a licence rollout, not
      of gradual adoption. Reachable only from a coding tool, and only by
      someone who has a seat, which is what caps it.
    serves: [GitHub]
    weight: 10.0
    availability: [0, 0, 0, 0, 0.34, 0.72, 0.92]
    first_wave: [engineering, data, product]

  - code: google-vertex
    name: Google Vertex AI
    billed_by: Google
    live_from: 2026-01
    note: >
      Serves Google's own models and, like Bedrock, third-party frontier models.
      Onboarded for a handful of teams and never pushed, so reach stays thin.
    serves: [Google, Anthropic, Meta]
    weight: 0.95
    availability: [0.12, 0.15, 0.19, 0.24, 0.29, 0.34, 0.38]

  - code: databricks-mosaic
    name: Databricks Mosaic AI
    billed_by: Databricks
    live_from: 2026-01
    note: Rides the existing lakehouse contract, so it reaches whoever already had the lakehouse and nobody else.
    serves: [Databricks, Meta, Mistral AI, DeepSeek, Alibaba, Zhipu AI, Moonshot AI,
             xAI, Perplexity, Stability AI, Voyage AI, Cohere, AI21 Labs, Unknown]
    weight: 4.60
    availability: [0.20, 0.23, 0.26, 0.29, 0.32, 0.35, 0.37]
    first_wave: [data, analytics, engineering]

# ---------------------------------------------------------------------------
# How much of the estate a provider actually gets.
#
# A bank does not spread its traffic evenly across twenty vendors. It signs a
# handful of agreements, puts them through security review, wires them into the
# gateway, and everything else stays a long tail that a few teams evaluate and
# nobody standardises on.
#
# Without this the long tail wins on price alone: a dozen cheap open-weight
# models are individually plausible choices, and in aggregate they took
# $15.27m against Databricks' $2.09m target, because Databricks is the only
# route to most of them. Model choice needs a procurement axis, not just a
# quality-per-dollar one.
#
# Multiplies model weight at selection time. Relative, not a share.
# ---------------------------------------------------------------------------
provider_pull:
  default:       0.06
  Anthropic:     0.78
  OpenAI:        0.26
  GitHub:        26.00   # a paid seat gets used whether or not it is the best tool
  Google:        0.36
  Amazon:        1.35
  Microsoft:     0.55
  Meta:          0.22
  Mistral AI:    0.24
  DeepSeek:      0.21
  Cohere:        0.09
  Databricks:    0.22
  Alibaba:       0.10
  Zhipu AI:      0.09
  Moonshot AI:   0.07
  xAI:           0.10
  AI21 Labs:     0.07
  Perplexity:    0.11
  Stability AI:  0.03
  Voyage AI:     0.09
  Unknown:       0.02

tiers:
  - { code: top,      name: Top tier,      note: frontier flagships and dedicated reasoning models }
  - { code: high,     name: High balanced, note: strong mid-range, often last generation's flagship }
  - { code: base,     name: Base,          note: fast and cheap workhorses, completions }
  - { code: untiered, name: Untiered,      note: embeddings, speech, image, search — no reasoning tier applies }

