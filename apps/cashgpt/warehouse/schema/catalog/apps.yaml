# Internal application catalogue — the products that consume tokens.
#
# STATIC. Fifteen apps, hand-authored. Small enough that generating them would
# be worse than writing them.
#
# OWNERSHIP IS BY DEPARTMENT, RESOLVED AT LOAD. The YAML names the owning
# department in business terms — line of business, division, department — and
# the generator looks up the org_id from the expanded tree. Department names are
# authored and stable; org_ids are generated and would rot the moment the tree
# is re-expanded. If a named department stops existing, the load fails rather
# than silently orphaning an app.
#
# OWNER IS NOT CONSUMER. Ask Northcrest is built by Enterprise Technology and
# used by all 500,000 people; Claude Code is owned by the developer platform and
# run by whoever is writing code. Who consumes an app is a fact, and it lives in
# fct_usage — not here.
#
# STATUS HERE IS THE PRODUCT'S OWN. The same app is live in one team and still
# piloting in another; that rollout state belongs on the fact, not on this row.
#
# primary_unit is only the default tab. The full set of units an app reports is
# whatever rows exist in fct_app_output — derived, not declared.
#
#   node scripts/silver/apps.mjs

meta:
  period: [2026-01, 2026-07]

units:
  - { code: prompts,   label: Prompts,    noun: prompt }
  - { code: documents, label: Documents,  noun: document }
  - { code: rows,      label: Data rows,  noun: row }
  - { code: cases,     label: Cases,      noun: case }
  - { code: sessions,  label: Sessions,   noun: session }
  - { code: reviews,   label: Reviews,    noun: review }
  - { code: reports,   label: Reports,    noun: report }
  - { code: scans,     label: Scans,      noun: scan }

# What the app is FOR. Behaviour profiles reach for kinds, not for names — a
# power coder wants "a coding tool", and which one depends on what their org
# has. Adding an app to the catalogue then needs no change to any profile.
kinds: [coding, assistant, domain, agent, analysis, research]

# The dictated "usage driver" filter on the Overview page — three buckets over
# the same catalogue, so it is a rollup of `kind` rather than a second thing to
# maintain. Developer is the largest because engineering is where the tokens go.
usage_drivers:
  developer:    [coding, agent]
  application:  [domain]
  productivity: [assistant, analysis, research]

# Who may use it at all. An app with no scope is open to the bank; otherwise it
# is limited by discipline or by line of business. This is what stops the
# simulator handing Quant Notebook to a facilities clerk.
statuses: [development, pilot, production, sunset]
audiences: [internal, customer_facing]

apps:
  - id: APP-01
    name: Claude Code
    owner: { lob: Enterprise Technology, division: Platform Engineering, department: Developer Experience }
    status: production
    audience: internal
    primary_unit: sessions
    launched: 2026-01
    kind: coding
    scope: { work_types: [engineering, data, product] }
    description: Agentic coding across the engineering estate

