# Name pools by culture.
#
# STATIC. Referenced by the `name_mix` on every site in locations.yaml — a
# person's name is drawn from the culture mix of the office they sit in, not
# from one global list.
#
# WHY SEPARATE FROM locations.yaml. That file is about geography and is read
# constantly while reasoning about the org. This is four thousand lines of
# vocabulary that nobody needs to read. Keeping them apart means the geography
# stays legible.
#
# WHAT A "CULTURE" IS HERE. A naming tradition, not a nationality and not an
# ethnicity. It exists only to make the staff list of a global bank look like a
# staff list rather than a generator's output. British and american pools are
# deliberately broad; every site's mix does the real work.
#
# SIZE. The two largest pools carry the most people, so they are the widest.
# Combinations per culture must clear the headcount assigned to it or the
# generator falls back to middle initials, which above a few per cent starts to
# read as fake.
#
#   node scripts/silver/employees.mjs

