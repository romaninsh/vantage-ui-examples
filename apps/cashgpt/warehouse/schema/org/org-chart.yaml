# Northcrest Financial Group — organisational outline
#
# STATIC. Hand-authored and reviewed; the expander turns it into ~35,000 org
# units. Divisions and departments are named here because names carry meaning
# and a generator cannot invent "Documentary Credits". Teams are expanded from
# the `teams` vocabulary because 35,000 of them cannot be hand-written and
# nobody would read them if they were.
#
# Headcount cascades: LOB headcount is authoritative, divisions declare theirs,
# departments take a share of their division, teams are sized by span of control.
#
#   node scripts/silver/org-units.mjs

meta:
  company: Northcrest Financial Group
  # London-headquartered universal bank. Retail is UK and Ireland; markets,
  # transaction banking and CIB run out of the European, Asian and Americas hubs.
  hq: London
  incorporated: United Kingdom
  headcount: 500000
  # 270,123 of these use AI — 54% adoption
  as_of: 2026-07-31

# Level 1 is the group; individual contributors sit under a level-6 team.
levels:
  1: { code: L1, name: Group }
  2: { code: L2, name: Line of business }
  3: { code: L3, name: Division }
  4: { code: L4, name: Department }
  5: { code: L5, name: Section }
  6: { code: L6, name: Team }

span:
  # Team size is lognormal, not a uniform range. Spans of control have a hard
  # floor (below ~3 it is not a team) and a long right tail (a contact-centre
  # supervisor really can have 45 reports). A flat range gives neither, and the
  # resulting org looks machine-made the moment you sort by headcount.
  #
  #   median 11 · sigma 0.48  ->  p50 11 · p90 20 · p99 34 · p99.9 ~48
  team:
    distribution: lognormal
    median: 11
    sigma: 0.48
    min: 3
    max: 60
  # teams per section, uniform — this one genuinely is a flat band
  section:
    teams_min: 4
    teams_max: 9

# Section names for departments too large to be one team of each stem. UK and
# Ireland first, because retail is the bulk of the headcount and it is domestic;
# the international hubs follow, which is where markets and CIB actually sit.
regions:
  [London, South East, Midlands, North West, Yorkshire, South West, Scotland,
   North East, Wales, Northern Ireland, Dublin, Frankfurt, Paris, Amsterdam,
   Luxembourg, Madrid, Milan, Zurich, Singapore, Hong Kong, Tokyo, Mumbai,
   Dubai, Sydney, New York, Toronto, Sao Paulo, Johannesburg]

# ---------------------------------------------------------------------------
# Reusable team vocabularies. A department picks one; the expander cycles the
# stems, suffixing with a region or an ordinal once it runs out.
# ---------------------------------------------------------------------------
vocab:
  ops: &ops
    [Processing, Exceptions, Quality Control, Client Support, Reconciliation,
     Workflow, Fulfilment, Case Handling]
  service: &service
    [Front Line, Escalations, Scheduling, Coaching, Retention, Triage]
  engineering: &engineering
    [Platform, Delivery, Reliability, Integration, Tooling, Architecture,
     Automation, Release]
  advisory: &advisory
    [Coverage, Origination, Client Solutions, Structuring, Execution, Portfolio]
  control: &control
    [Controls, Assurance, Reporting, Governance, Policy, Testing]
  analytics: &analytics
    [Insights, Modelling, Reporting, Data Products, Experimentation]
  markets: &markets
    [Desk, Flow, Structured, Electronic, Risk Book]
  people: &people
    [Partnering, Operations, Programmes, Advisory, Shared Services]
  facilities: &facilities
    [Site Services, Maintenance, Space Planning, Security, Contracts]
  # Product engineering names its teams after the thing it ships, not after a
  # function. This is what makes "spend by team" legible to a product owner.
  product: &product
    [Mobile App, Online Banking, Cards Portal, Savings Platform, Mortgage Hub,
     Payments Hub, Open Banking APIs, Onboarding Journey, Identity & Auth,
     Notifications, Statements, Disputes Portal, Loan Origination, Rewards,
     Business Portal, Wealth Portal, Branch Terminal, Agent Desktop]
  data: &data
    [Ingestion, Pipelines, Data Products, Streaming, Quality, Lineage,
     Contracts, Governance, Catalogue]

# ---------------------------------------------------------------------------
# What people in a department actually DO. Keyed by the same vocabulary the
# department uses for its team names, so a Legal department never staffs a
# Site Reliability engineer. Weights are relative within the mix.
# ---------------------------------------------------------------------------
function_mix:
  ops:
    { Operations: 5, Business Analysis: 2, Client Service: 2, Compliance: 1, Analytics: 1 }
  service:
    { Client Service: 6, Operations: 3, Training: 1, Business Analysis: 1 }
  engineering:
    { Software Engineering: 6, Site Reliability: 2, Architecture: 2, Security: 2, Data Management: 1 }
  advisory:
    { Client Service: 4, Business Analysis: 3, Product Management: 2, Risk Management: 1, Operations: 1 }
  control:
    { Compliance: 4, Risk Management: 3, Auditing: 2, Legal: 2, Operations: 1 }
  analytics:
    { Analytics: 4, Data Science: 3, Data Management: 2, Quantitative Research: 2, Software Engineering: 1 }
  markets:
    { Trading: 5, Quantitative Research: 3, Analytics: 2, Risk Management: 1 }
  people:
    { Training: 4, Operations: 3, Business Analysis: 2, Legal: 1 }
  facilities:
    { Operations: 6, Security: 3, Compliance: 1 }
  product:
    { Software Engineering: 6, Product Management: 3, Architecture: 1, Analytics: 1, Site Reliability: 1 }
  data:
    { Data Management: 5, Software Engineering: 3, Analytics: 2, Data Science: 1 }

# How senior a department skews. 1.0 is neutral; above pulls the grade mix up,
# below pushes it down. A contact centre is juniors with a few supervisors; a
# quant desk is the other way round.
seniority_tilt:
  ops: 0.85
  service: 0.70
  engineering: 1.25
  advisory: 1.20
  control: 1.10
  analytics: 1.30
  markets: 1.45
  people: 0.95
  facilities: 0.65
  product: 1.25
  data: 1.30

# ---------------------------------------------------------------------------
# How likely each discipline is to use AI at all, and how hard when they do.
# This is the single biggest driver of where the money goes: an engineering
# team is nearly all users at high intensity, a facilities team is a handful of
# people asking occasional questions. Keyed by work_type, read by the usage
# generators — NOT loaded into silver, for the same reason as the seniority
# figures: once fct_usage exists, adoption is measured, not assumed.
#
# adoption   share of the discipline's headcount that uses AI at all
# intensity  relative spend per active user, 1.0 being the bank average
# ---------------------------------------------------------------------------
ai_profile:
  engineering: { adoption: 0.94, intensity: 2.60 }
  data:        { adoption: 0.92, intensity: 2.40 }
  product:     { adoption: 0.88, intensity: 2.00 }
  analytics:   { adoption: 0.86, intensity: 2.20 }
  markets:     { adoption: 0.70, intensity: 1.40 }
  advisory:    { adoption: 0.55, intensity: 1.00 }
  control:     { adoption: 0.52, intensity: 0.90 }
  people:      { adoption: 0.46, intensity: 0.70 }
  ops:         { adoption: 0.42, intensity: 0.60 }
  service:     { adoption: 0.34, intensity: 0.45 }
  facilities:  { adoption: 0.16, intensity: 0.30 }

