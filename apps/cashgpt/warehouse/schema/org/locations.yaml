# ---------------------------------------------------------------------------
# Hiring profiles — how a kind of team is staffed.
#
# `co_location` is the probability a person sits at their team's primary site.
# The remainder is redrawn from the profile, which is what puts a handful of
# Pune engineers on a London-led team without breaking the idea that a team has
# a home. Delivery profiles run looser than branch profiles because they really
# are more distributed.
# ---------------------------------------------------------------------------
hiring_profiles:

  - code: UK_RETAIL
    note: Branches and contact centres. Staff sit where the customers are, so this is domestic and tightly co-located.
    co_location: 0.97
    mix: { UK-LDS: 0.20, UK-GLA: 0.15, UK-MAN: 0.15, UK-BHM: 0.14, UK-BRS: 0.12,
           UK-EDI: 0.11, UK-LON: 0.08, UK-BFT: 0.05 }

  - code: UK_OPS_OFFSHORE
    note: Back-office processing. UK-managed, majority offshore — the standard shape for a UK bank's operations.
    co_location: 0.90
    mix: { IN-GGN: 0.21, IN-BOM: 0.16, IN-MAA: 0.09, PL-KRK: 0.13,
           UK-LDS: 0.07, UK-GLA: 0.06, UK-BFT: 0.05, PT-LIS: 0.05,
           MY-KUL: 0.08, SG-SIN: 0.05, HK-HKG: 0.03, US-CLT: 0.02 }

  - code: TECH_INDIA_LED
    note: >
      The build. India is the primary development centre, not an overflow —
      this is where most engineering headcount actually is, and it carries the
      heaviest AI adoption in the bank.
    co_location: 0.72
    mix: { IN-PNQ: 0.24, IN-BLR: 0.22, IN-HYD: 0.12, IN-MAA: 0.10,
           UK-LON: 0.11, UK-MAN: 0.05, UK-BFT: 0.04, PL-KRK: 0.05,
