# ---------------------------------------------------------------------------
# Which profile a team uses. Resolved in order: the most specific match wins.
#
#   1. an explicit (lob, work_type) override
#   2. the line of business default
#   3. the work_type default
#   4. `default`
# ---------------------------------------------------------------------------
assignment:
  default: CORPORATE_FUNCTIONS

  by_work_type:
    engineering: TECH_INDIA_LED
    data: TECH_INDIA_LED
    product: TECH_INDIA_LED
    analytics: CONTROL_GLOBAL
    control: CONTROL_GLOBAL
    markets: MARKETS_FLOOR
    advisory: CIB_GLOBAL
    service: UK_RETAIL
    ops: UK_OPS_OFFSHORE
    people: CORPORATE_FUNCTIONS
    facilities: FACILITIES_LOCAL

  by_lob:
    LB-05: UK_RETAIL             # Consumer Banking
    LB-10: UK_RETAIL             # Consumer Digital
    LB-04: COMMERCIAL_UK         # Commercial Banking
    LB-06: WEALTH_GLOBAL         # Wealth Management
    LB-02: PAYMENTS_GLOBAL       # Payments & Transaction Banking
    LB-03: CIB_GLOBAL            # Corporate & Investment Banking
    LB-01: MARKETS_FLOOR         # Global Markets
    LB-11: CONTROL_GLOBAL        # Risk & Compliance
    LB-12: CORPORATE_FUNCTIONS   # Finance & Treasury
    LB-13: CORPORATE_FUNCTIONS   # Corporate Services

  # A line of business default is about the BUSINESS. The engineers inside it
  # still work the way engineers work, so these put them back on a tech profile.
  overrides:
    - { lob: LB-07, work_type: any,         profile: TECH_INDIA_LED }   # Enterprise Technology
    - { lob: LB-08, work_type: any,         profile: TECH_INDIA_LED }   # Data & AI Platform
    - { lob: LB-09, work_type: any,         profile: TECH_MARKETS }     # Global Markets Technology
    - { lob: LB-01, work_type: engineering, profile: TECH_MARKETS }
    - { lob: LB-01, work_type: data,        profile: TECH_MARKETS }
    - { lob: LB-03, work_type: engineering, profile: TECH_MARKETS }
    - { lob: LB-05, work_type: engineering, profile: TECH_INDIA_LED }
    - { lob: LB-05, work_type: ops,         profile: UK_OPS_OFFSHORE }
    - { lob: LB-10, work_type: engineering, profile: TECH_INDIA_LED }
    - { lob: LB-10, work_type: data,        profile: TECH_INDIA_LED }
    - { lob: LB-10, work_type: product,     profile: TECH_INDIA_LED }
    - { lob: LB-04, work_type: engineering, profile: TECH_INDIA_LED }
    - { lob: LB-06, work_type: engineering, profile: TECH_INDIA_LED }
    - { lob: LB-02, work_type: engineering, profile: TECH_INDIA_LED }
    - { lob: LB-11, work_type: engineering, profile: TECH_INDIA_LED }
    - { lob: LB-12, work_type: engineering, profile: TECH_INDIA_LED }
    - { lob: LB-13, work_type: engineering, profile: TECH_INDIA_LED }
    - { lob: LB-13, work_type: facilities,  profile: FACILITIES_LOCAL }
