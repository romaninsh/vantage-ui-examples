# Northcrest Financial Group — where the bank actually sits.
#
# STATIC. Hand-authored. Read by scripts/silver/org-units.mjs (which gives every
# team a primary site) and scripts/silver/employees.mjs (which places each
# person and then draws their name from that place's name mix).
#
# WHY THIS EXISTS. It does not change AI spend by a cent. It changes who the
# people are. A bank headquartered in London with its build capacity in Pune has
# an employee list that looks nothing like a name generator's, and every
# per-person panel on the dashboard shows names.
#
# A TEAM SITS SOMEWHERE, BUT NOT EVERYONE ON IT DOES. Each team draws a primary
# site from its hiring profile; each person then lands on that site with
# probability `co_location`, or is drawn from the wider profile otherwise. That
# one parameter produces both facts we need: delivery teams that are entirely in
# Bengaluru, and London-led teams with four engineers working out of Pune.
#
# NAME MIX IS PER SITE, NOT PER COUNTRY. London is not "British names" — it is
# roughly three-fifths British and the rest is the actual city. Applying a
# national stereotype to a global bank's staff list is the thing this avoids.
#
#   node scripts/silver/org-units.mjs && node scripts/silver/employees.mjs

meta:
  hq: UK-LON
  # Rough regional split the expander is asserted against, +/- 2pp.
  region_targets:
    UK & Ireland: 0.43
    India: 0.24
    Europe: 0.12
    North America: 0.09
    Asia Pacific: 0.08
    Greater China: 0.03
    Middle East & Africa: 0.01
    Latin America: 0.002

# ---------------------------------------------------------------------------
# Name cultures. Each site blends these; the pools themselves live in
# schema/org/names.yaml so this file stays about geography.
# ---------------------------------------------------------------------------
cultures:
  [british, irish, indian, chinese, chinese_diaspora, japanese, french, german,
   polish, spanish, portuguese, italian, arabic, african, american]

