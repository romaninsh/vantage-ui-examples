# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Manager · summary
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: lead_name, type: string, flags: [hidden], optional: true }
  - { name: org_name, type: string, flags: [hidden], optional: true }
  - { name: lob_name, type: string, flags: [hidden], optional: true }
  - { name: lead_city, type: string, flags: [hidden], optional: true }
  - { name: spend, type: float, flags: [hidden], optional: true }
  - { name: active, type: int, flags: [hidden], optional: true }
  - { name: headcount, type: int, flags: [hidden], optional: true }
  - { name: tier_spend, type: float, flags: [hidden], optional: true }
  - name: who_line
    type: string
    lazy: |
      if row.lead_name == () || row.org_name == () || row.lob_name == () || row.lead_city == () {
          ()
      } else {
          row.lead_name + " — " + row.org_name + " · " + row.lob_name + " · " + row.lead_city
      }
  - name: spend_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      fn grp(i) { let s = i.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o }
      fn f2(x) { let c = (x * 100.0).round().to_int(); let f = c % 100; grp(c / 100) + "." + (if f < 10 { "0" } else { "" }) + f }
      fn usd(x) { if x >= 1000000.0 { "$" + f2(x / 1000000.0) + "M" } else if x >= 1000.0 { "$" + (x / 1000.0).round().to_int() + "K" } else { "$" + grp(x.round().to_int()) } }
      if row.spend == () { () } else { usd(num(row.spend)) }
  - name: active_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      fn grp(i) { let s = i.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o }
      if row.active == () { () } else { grp(num(row.active).round().to_int()) }
  - name: active_sub
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      fn grp(i) { let s = i.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o }
      if row.headcount == () { () } else { "active of " + grp(num(row.headcount).round().to_int()) }
  - name: per_user_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      fn grp(i) { let s = i.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o }
      if row.spend == () || row.active == () || num(row.active) == 0.0 {
          ()
      } else {
          "$" + grp((num(row.spend) / num(row.active)).round().to_int())
      }
  - name: tier_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      if row.spend == () || row.tier_spend == () || num(row.spend) == 0.0 {
          ()
      } else {
          (100.0 * num(row.tier_spend) / num(row.spend)).round().to_int().to_string() + "%"
      }
postgres:
  # Reference: manager.summary — the chosen manager's whole org from
  # mart_org_month, month-scoped. The card line quotes the picker row
  # (name — section · lob · city). Spend formats adaptively where the
  # reference reused usdM and would print $0.00M at section scale —
  # display drift, not intent. A section has one head, so the left join to
  # dim_employee adds no rows.
  # language=rhai
  rhai: |
    let org = if "org" in args { args.org } else { "" };
    let mo = if "month" in args { args.month } else { "" };
    let m = sql::ident("mart_org_month");
    let o = sql::ident("o");
    let e = sql::ident("e");
    let q = sql::select().from("mart_org_month")
        .inner_join("dim_org_unit", "o", o["org_id"] == m["org_id"])
        .left_join("dim_employee", "e", e["heads_org_id"] == o["org_id"])
        .where(m["org_id"] == org);
    if mo != "" { q = q.where(m["month_key"] == mo); }
    q.group_by(o["org_id"])
        .expression(o["org_id"].alias("rid"))
        .expression(sql::max(e["full_name"]).alias("lead_name"))
        .expression(sql::max(o["org_name"]).alias("org_name"))
        .expression(sql::max(m["lob_name"]).alias("lob_name"))
        .expression(sql::max(e["city"]).alias("lead_city"))
        .expression(sql::sum(m["spend_usd"]).alias("spend"))
        .expression(sql::max(m["active"]).alias("active"))
        .expression(sql::max(o["headcount"]).alias("headcount"))
        .expression(sql::sum(sql::mul(m["spend_usd"], m["top_tier_share"])).alias("tier_spend"))
