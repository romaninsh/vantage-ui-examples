# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Person · cost over time
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - name: month
    type: string
    lazy: |
      let names = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      names[parse_int(row.month_key.sub_string(5, 2)) - 1]
  - { name: model_name, type: string }
  - { name: spend, type: float }
  - { name: month_key, type: string, flags: [hidden] }
postgres:
  # Reference: individual.costOverTime — one person is a few dozen rows
  # behind an index on employee_id, so this reads the fact directly. One
  # line per model; the chart's `group:` keeps the top 8 by total.
  # month is a lazy column over month_key.
  # language=rhai
  rhai: |
    let person = if "person" in args { args.person } else { "" };
    sql::select().from_as("fct_usage", "u")
        .inner_join("dim_model", "m", sql::ident("m")["model_id"] == sql::ident("u")["model_id"])
        .where(sql::ident("u")["employee_id"] == person)
        // TODO(no-expr): string concat (||) with a literal separator has no sql:: builder
        .expression(sql::expr("u.month_key || ':' || m.model_name").alias("rid"))
        .expression(sql::ident("u")["month_key"].alias("month_key"))
        .expression(sql::ident("m")["model_name"].alias("model_name"))
        .expression(sql::round(sql::sum(sql::ident("u")["spend_usd"]), 2).alias("spend"))
        .group_by(sql::ident("u")["month_key"])
        .group_by(sql::ident("m")["model_name"])
        .order_by(sql::ident("u")["month_key"], "asc")
