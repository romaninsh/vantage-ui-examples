# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Watch · efficiency subtitle
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: line, type: string }
postgres:
  # Prototype subtitle figures, formatted here: the medians, the signed
  # L4-level recoverable total, and the total spend it is measured against.
  # language=rhai
  rhai: |
    select().from("mart_team_month")
        .expression(expr("'eff'").alias("rid"))
        .expression(expr("'median team $' || to_char(round((SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY s / NULLIF(a, 0))::numeric FROM (SELECT org_id, sum(spend_usd) AS s, max(active) AS a, round(sum(spend_usd * top_tier_share) / NULLIF(sum(spend_usd), 0), 4) AS tt FROM mart_team_month WHERE org_level = 6 GROUP BY org_id) lf)), 'FM999,999') || '/user · ' || to_char(round(100.0 * (SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY tt)::numeric FROM (SELECT org_id, sum(spend_usd) AS s, max(active) AS a, round(sum(spend_usd * top_tier_share) / NULLIF(sum(spend_usd), 0), 4) AS tt FROM mart_team_month WHERE org_level = 6 GROUP BY org_id) lf)), 'FM990') || '% top tier · ' || CASE WHEN abs((SELECT round(sum(spend * (tt - (SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY tt)::numeric FROM (SELECT org_id, sum(spend_usd) AS s, max(active) AS a, round(sum(spend_usd * top_tier_share) / NULLIF(sum(spend_usd), 0), 4) AS tt FROM mart_team_month WHERE org_level = 6 GROUP BY org_id) lf)) * (1 - 0.84 / 6.10)), 0) FROM (SELECT org_id, sum(spend_usd) AS spend, round(sum(spend_usd * top_tier_share) / NULLIF(sum(spend_usd), 0), 4) AS tt FROM mart_team_month WHERE org_level = 4 GROUP BY org_id) l4)) >= 1e6 THEN (CASE WHEN ((SELECT round(sum(spend * (tt - (SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY tt)::numeric FROM (SELECT org_id, sum(spend_usd) AS s, max(active) AS a, round(sum(spend_usd * top_tier_share) / NULLIF(sum(spend_usd), 0), 4) AS tt FROM mart_team_month WHERE org_level = 6 GROUP BY org_id) lf)) * (1 - 0.84 / 6.10)), 0) FROM (SELECT org_id, sum(spend_usd) AS spend, round(sum(spend_usd * top_tier_share) / NULLIF(sum(spend_usd), 0), 4) AS tt FROM mart_team_month WHERE org_level = 4 GROUP BY org_id) l4)) < 0 THEN '−' ELSE '' END) || '$' || to_char(abs((SELECT round(sum(spend * (tt - (SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY tt)::numeric FROM (SELECT org_id, sum(spend_usd) AS s, max(active) AS a, round(sum(spend_usd * top_tier_share) / NULLIF(sum(spend_usd), 0), 4) AS tt FROM mart_team_month WHERE org_level = 6 GROUP BY org_id) lf)) * (1 - 0.84 / 6.10)), 0) FROM (SELECT org_id, sum(spend_usd) AS spend, round(sum(spend_usd * top_tier_share) / NULLIF(sum(spend_usd), 0), 4) AS tt FROM mart_team_month WHERE org_level = 4 GROUP BY org_id) l4)) / 1e6, 'FM999,990.00') || 'M' ELSE (CASE WHEN ((SELECT round(sum(spend * (tt - (SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY tt)::numeric FROM (SELECT org_id, sum(spend_usd) AS s, max(active) AS a, round(sum(spend_usd * top_tier_share) / NULLIF(sum(spend_usd), 0), 4) AS tt FROM mart_team_month WHERE org_level = 6 GROUP BY org_id) lf)) * (1 - 0.84 / 6.10)), 0) FROM (SELECT org_id, sum(spend_usd) AS spend, round(sum(spend_usd * top_tier_share) / NULLIF(sum(spend_usd), 0), 4) AS tt FROM mart_team_month WHERE org_level = 4 GROUP BY org_id) l4)) < 0 THEN '−' ELSE '' END) || '$' || to_char(round(abs((SELECT round(sum(spend * (tt - (SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY tt)::numeric FROM (SELECT org_id, sum(spend_usd) AS s, max(active) AS a, round(sum(spend_usd * top_tier_share) / NULLIF(sum(spend_usd), 0), 4) AS tt FROM mart_team_month WHERE org_level = 6 GROUP BY org_id) lf)) * (1 - 0.84 / 6.10)), 0) FROM (SELECT org_id, sum(spend_usd) AS spend, round(sum(spend_usd * top_tier_share) / NULLIF(sum(spend_usd), 0), 4) AS tt FROM mart_team_month WHERE org_level = 4 GROUP BY org_id) l4))), 'FM999,999,999') END || ' recoverable of ' || CASE WHEN abs((SELECT sum(spend_usd) FROM mart_team_month WHERE org_level = 4)) >= 1e6 THEN (CASE WHEN ((SELECT sum(spend_usd) FROM mart_team_month WHERE org_level = 4)) < 0 THEN '−' ELSE '' END) || '$' || to_char(abs((SELECT sum(spend_usd) FROM mart_team_month WHERE org_level = 4)) / 1e6, 'FM999,990.00') || 'M' ELSE (CASE WHEN ((SELECT sum(spend_usd) FROM mart_team_month WHERE org_level = 4)) < 0 THEN '−' ELSE '' END) || '$' || to_char(round(abs((SELECT sum(spend_usd) FROM mart_team_month WHERE org_level = 4))), 'FM999,999,999') END").alias("line"))
        .limit(1, 0)
