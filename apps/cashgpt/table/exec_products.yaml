# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Exec · exec_products
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: rank_display, type: string, flags: [hidden] }
  - { name: member, type: string, flags: [title] }
  - { name: meta, type: string }
  - { name: total_display, type: string }
  - { name: bar_pct, type: float }
postgres:
  # Reference: exec.productLines with the documented grain fix — grouped
  # per app across the scope (the reference emitted one bar per app-MONTH,
  # drift C) plus the missing consuming-LOB count for the meta text.
  rhai: |
    select().from("mart_app_month")
            .expression(expr("(app_id) || ':' || coalesce(month_key, {})", ["Year to date"]).alias("rid"))
            .expression(expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            .expression(expr("to_char(row_number() OVER (PARTITION BY GROUPING(month_key), month_key ORDER BY sum(spend_usd) DESC), 'FM99') || '.'").alias("rank_display"))
            .expression(expr("max(app_name)").alias("member"))
            .expression(expr("max(owner_lob_name) || ' · ' || count(DISTINCT consumer_lob_id) || ' consumers'").alias("meta"))
            .expression(expr("CASE WHEN (sum(spend_usd)) >= 1e6 THEN '$' || to_char((sum(spend_usd)) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd)) >= 1e3 THEN '$' || to_char(round((sum(spend_usd)) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd)), 0)), 'FM999,999') END").alias("total_display"))
            .expression(expr("round(100.0 * sum(spend_usd) / nullif(CASE WHEN GROUPING(month_key) = 1 THEN (SELECT max(s) FROM (SELECT sum(spend_usd) AS s FROM mart_app_month GROUP BY app_id) x) ELSE (SELECT max(s) FROM (SELECT t.month_key AS mk, t.app_id, sum(t.spend_usd) AS s FROM mart_app_month t GROUP BY 1, 2) x WHERE x.mk = mart_app_month.month_key) END, 0), 1)").alias("bar_pct"))
            .group_by(expr("app_id"))
            .group_by(expr("ROLLUP(month_key)"))
            .order_by(expr("sum(spend_usd)"), "desc")
