# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Exec · exec_products
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: rank_raw, type: int, flags: [hidden] }
  - name: rank_display
    type: string
    flags: [hidden]
    lazy: |
      if row.rank_raw == () { () } else { row.rank_raw.to_string() + "." }
  - { name: member, type: string, flags: [title] }
  - { name: owner_raw, type: string, flags: [hidden] }
  - { name: consumers_raw, type: int, flags: [hidden] }
  - name: meta
    type: string
    lazy: |
      if row.owner_raw == () || row.consumers_raw == () { () } else { row.owner_raw + " · " + row.consumers_raw + " consumers" }
  - { name: total_raw, type: float, flags: [hidden] }
  - name: total_display
    type: string
    lazy: |
      let n = row.total_raw; let v = if n == () { 0.0 } else { n + 0.0 };
      let g = |k| { let s = k.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o };
      if v >= 1000000.0 { let c = (v / 10000.0).round().to_int(); "$" + g.call(c / 100) + "." + (if c % 100 < 10 { "0" } else { "" }) + (c % 100) + "M" }
      else if v >= 1000.0 { "$" + g.call((v / 1000.0).round().to_int()) + "K" }
      else { "$" + g.call(v.round().to_int()) }
  - { name: bar_pct, type: float }
postgres:
  # Reference: exec.productLines with the documented grain fix — grouped
  # per app across the scope (the reference emitted one bar per app-MONTH,
  # drift C) plus the missing consuming-LOB count for the meta text.
  # language=rhai
  rhai: |
    sql::select().from("mart_app_month")
            // TODO(no-expr): string concat (||) and a string literal in coalesce have no sql:: builder
            .expression(sql::expr("(app_id) || ':' || coalesce(month_key, {})", ["Year to date"]).alias("rid"))
            // TODO(no-expr): a string literal in coalesce has no sql:: builder
            .expression(sql::expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            // TODO(no-expr): GROUPING() inside a window PARTITION BY has no sql:: builder
            .expression(sql::expr("row_number() OVER (PARTITION BY GROUPING(month_key), month_key ORDER BY sum(spend_usd) DESC)").alias("rank_raw"))
            .expression(sql::max(sql::ident("app_name")).alias("member"))
            .expression(sql::max(sql::ident("owner_lob_name")).alias("owner_raw"))
            .expression(sql::count_distinct(sql::ident("consumer_lob_id")).alias("consumers_raw"))
            .expression(sql::cast(sql::sum(sql::ident("spend_usd")), "double precision").alias("total_raw"))
            // TODO(no-expr): GROUPING() and scalar subqueries have no sql:: builder
            .expression(sql::expr("round(100.0 * sum(spend_usd) / nullif(CASE WHEN GROUPING(month_key) = 1 THEN (SELECT max(s) FROM (SELECT sum(spend_usd) AS s FROM mart_app_month GROUP BY app_id) x) ELSE (SELECT max(s) FROM (SELECT t.month_key AS mk, t.app_id, sum(t.spend_usd) AS s FROM mart_app_month t GROUP BY 1, 2) x WHERE x.mk = mart_app_month.month_key) END, 0), 1)").alias("bar_pct"))
            .group_by(sql::ident("app_id"))
            // TODO(no-expr): ROLLUP has no sql:: builder
            .group_by(sql::expr("ROLLUP(month_key)"))
            .order_by(sql::sum(sql::ident("spend_usd")), "desc")
