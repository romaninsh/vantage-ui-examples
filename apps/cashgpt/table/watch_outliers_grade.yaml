# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Watch · outliers (grade)
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: full_name, type: string, flags: [title] }
  - { name: job_function, type: string, flags: [hidden], optional: true }
  - { name: team_name, type: string, flags: [hidden], optional: true }
  - name: role_team
    type: string
    lazy: |
      if row.job_function == () || row.team_name == () { () } else { row.job_function + " · " + row.team_name }
  - { name: manager_name, type: string, optional: true }
  - { name: peer_mean, type: float, flags: [hidden], optional: true }
  - { name: multiple, type: float, flags: [hidden], optional: true }
  - name: spend_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      fn grp(i) { let s = i.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o }
      if row.spend_usd == () { () } else { "$" + grp(num(row.spend_usd).round().to_int()) }
  - name: peer_mean_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      fn grp(i) { let s = i.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o }
      "$" + grp((if row.peer_mean == () { 0.0 } else { num(row.peer_mean) }).round().to_int())
  - name: multiple_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      fn grp(i) { let s = i.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o }
      if row.multiple == () || num(row.multiple).round() == 0.0 { "—" } else { grp(num(row.multiple).round().to_int()) + "×" }
  - name: band
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      let s = if row.sigma == () { 0.0 } else { num(row.sigma) };
      if s >= 4.0 { "extremely unusual" } else if s >= 3.0 { "very unusual" } else { "unusual" }
  - name: sigma_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      fn grp(i) { let s = i.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o }
      if row.sigma == () { () } else {
          let c = (num(row.sigma).abs() * 10.0).round().to_int();
          (if num(row.sigma) < 0.0 && c > 0 { "-" } else { "" }) + grp(c / 10) + "." + (c % 10).to_string() + "σ"
      }
  - { name: sigma, type: float, flags: [hidden] }
  - { name: spend_usd, type: float, flags: [hidden] }
  - { name: top_platform, type: string, optional: true }
  - { name: peers, type: int }
postgres:
  # Reference: watch outliers, grade peer definition. Leave-one-out stats
  # arrive precomputed in mart_peer_benchmark; joins to dims replicate the
  # reference's manager/top-platform lookups (one head per team, one row
  # per platform, so the left joins add no rows).
  # language=rhai
  rhai: |
    let b = sql::ident("mart_peer_benchmark");
    let e = sql::ident("e");
    let pl = sql::ident("pl");
    sql::select().from("mart_peer_benchmark")
        .left_join("dim_employee", "e", e["heads_org_id"] == b["team_org_id"])
        .left_join("dim_platform", "pl", pl["platform_id"] == b["top_platform_id"])
        .where(b["grade_sigma"] >= 2)
        // TODO(no-expr): string concat for the row id
        .expression(sql::expr("mart_peer_benchmark.employee_id || ':' || mart_peer_benchmark.month_key").alias("rid"))
        .expression(b["month_key"].alias("month_key"))
        .expression(b["full_name"].alias("full_name"))
        .expression(b["job_function"].alias("job_function"))
        .expression(b["team_name"].alias("team_name"))
        .expression(e["full_name"].alias("manager_name"))
        .expression(b["grade_mean"].alias("peer_mean"))
        .expression(b["grade_multiple"].alias("multiple"))
        .expression(b["grade_sigma"].alias("sigma"))
        .expression(b["spend_usd"].alias("spend_usd"))
        .expression(pl["platform_name"].alias("top_platform"))
        .expression(b["grade_peers"].alias("peers"))
        .order_by(b["grade_sigma"], "desc")
