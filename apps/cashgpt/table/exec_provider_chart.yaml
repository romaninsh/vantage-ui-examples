# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Exec · provider trajectory (chart)
id_column: month_key
columns:
  - { name: month_key, type: string, flags: [id, hidden] }
  - name: month
    type: string
    lazy: |
      let names = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      names[row.month_key.sub_string(5, 2).parse_int() - 1]
  - { name: "Anthropic", type: float }
  - { name: "OpenAI", type: float }
  - { name: "GitHub", type: float }
  - { name: "Other", type: float }
  - { name: "Amazon", type: float }
  - { name: "Meta", type: float }
postgres:
  # Reference: exec.providerTrajectory — month × provider_group spend,
  # pivoted; slot order (colour) is total-desc per toSeries.
  # language=rhai
  rhai: |
    sql::select().from("mart_spend_agg")
            .field("month_key")
            // TODO(no-expr): aggregate FILTER (WHERE ..) has no sql:: builder
            .expression(sql::expr("coalesce(sum(spend_usd) FILTER (WHERE provider_group = {}), 0)", ["Anthropic"]).alias("Anthropic"))
            .expression(sql::expr("coalesce(sum(spend_usd) FILTER (WHERE provider_group = {}), 0)", ["OpenAI"]).alias("OpenAI"))
            .expression(sql::expr("coalesce(sum(spend_usd) FILTER (WHERE provider_group = {}), 0)", ["GitHub"]).alias("GitHub"))
            .expression(sql::expr("coalesce(sum(spend_usd) FILTER (WHERE provider_group = {}), 0)", ["Other"]).alias("Other"))
            .expression(sql::expr("coalesce(sum(spend_usd) FILTER (WHERE provider_group = {}), 0)", ["Amazon"]).alias("Amazon"))
            .expression(sql::expr("coalesce(sum(spend_usd) FILTER (WHERE provider_group = {}), 0)", ["Meta"]).alias("Meta"))
            .group_by(sql::ident("month_key"))
            .order_by(sql::ident("month_key"), "asc")
