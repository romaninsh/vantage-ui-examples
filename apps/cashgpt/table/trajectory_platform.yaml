# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Trajectory · platform (chart)
id_column: month_key
columns:
  - { name: month_key, type: string, flags: [id, hidden] }
  - { name: month, type: string }
  - { name: "Azure OpenAI", type: float }
  - { name: "Claude", type: float }
  - { name: "Google Vertex AI", type: float }
  - { name: "Databricks Mosaic AI", type: float }
  - { name: "GitHub Copilot", type: float }
  - { name: "Amazon Bedrock", type: float }
postgres:
  # Reference: overview.trajectory — month × member spend, pivoted; series
  # order = the reference slotOrder (first-seen: Jan spend ranking).
  # language=rhai
  rhai: |
    let lob = if "lob" in args { args.lob } else { "" };
    let rorg = if "rorg" in args { args.rorg } else { "" };
    let drv = if "driver" in args { args.driver } else { "" };
    let plat = if "platform" in args { args.platform } else { "" };
    let mdl = if "model" in args { args.model } else { "" };
    let jf = if "jobfn" in args { args.jobfn } else { "" };
    let m = "mart_spend_agg";
    let g = "({} = '' OR lob_id = {}) AND ({} = '' OR resource_org = {}) AND ({} = '' OR usage_driver = {}) AND ({} = '' OR platform_id = {}) AND ({} = '' OR model_id = {})";
    let ga = [lob, lob, rorg, rorg, drv, drv, plat, plat, mdl, mdl];
    if jf != "" { m = "mart_fact_agg"; g += " AND ({} = '' OR job_function = {})"; ga += [jf, jf]; }
    select().from(m)
            .where(expr(g, ga))
            .field("month_key")
            .expression(expr("to_char(to_date(month_key || '-01', 'YYYY-MM-DD'), 'Mon')").alias("month"))
            .expression(expr("coalesce(sum(spend_usd) FILTER (WHERE platform_name = {}), 0)", ["Azure OpenAI"]).alias("Azure OpenAI"))
            .expression(expr("coalesce(sum(spend_usd) FILTER (WHERE platform_name = {}), 0)", ["Claude"]).alias("Claude"))
            .expression(expr("coalesce(sum(spend_usd) FILTER (WHERE platform_name = {}), 0)", ["Google Vertex AI"]).alias("Google Vertex AI"))
            .expression(expr("coalesce(sum(spend_usd) FILTER (WHERE platform_name = {}), 0)", ["Databricks Mosaic AI"]).alias("Databricks Mosaic AI"))
            .expression(expr("coalesce(sum(spend_usd) FILTER (WHERE platform_name = {}), 0)", ["GitHub Copilot"]).alias("GitHub Copilot"))
            .expression(expr("coalesce(sum(spend_usd) FILTER (WHERE platform_name = {}), 0)", ["Amazon Bedrock"]).alias("Amazon Bedrock"))
            .group_by(ident("month_key"))
            .order_by(ident("month_key"), "asc")
