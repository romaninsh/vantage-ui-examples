# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Trajectory · platform (chart)
id_column: month_key
columns:
  - { name: month_key, type: string, flags: [id, hidden] }
  - name: month
    type: string
    lazy: |
      let names = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      names[parse_int(row.mk.sub_string(5, 2)) - 1]
  - name: "Azure OpenAI"
    type: float
    lazy: 'if row.azure_openai_sum == () { 0.0 } else { row.azure_openai_sum }'
  - name: "Claude"
    type: float
    lazy: 'if row.claude_sum == () { 0.0 } else { row.claude_sum }'
  - name: "Google Vertex AI"
    type: float
    lazy: 'if row.google_vertex_ai_sum == () { 0.0 } else { row.google_vertex_ai_sum }'
  - name: "Databricks Mosaic AI"
    type: float
    lazy: 'if row.databricks_mosaic_ai_sum == () { 0.0 } else { row.databricks_mosaic_ai_sum }'
  - name: "GitHub Copilot"
    type: float
    lazy: 'if row.github_copilot_sum == () { 0.0 } else { row.github_copilot_sum }'
  - name: "Amazon Bedrock"
    type: float
    lazy: 'if row.amazon_bedrock_sum == () { 0.0 } else { row.amazon_bedrock_sum }'
  - { name: mk, type: string, flags: [hidden] }
  - { name: azure_openai_sum, type: float, flags: [hidden] }
  - { name: claude_sum, type: float, flags: [hidden] }
  - { name: google_vertex_ai_sum, type: float, flags: [hidden] }
  - { name: databricks_mosaic_ai_sum, type: float, flags: [hidden] }
  - { name: github_copilot_sum, type: float, flags: [hidden] }
  - { name: amazon_bedrock_sum, type: float, flags: [hidden] }
postgres:
  # Reference: overview.trajectory — month × member spend, pivoted; series
  # order = the reference slotOrder (first-seen: Jan spend ranking).
  # The month label and the zero-fill of empty series are lazy columns over
  # mk / the *_sum aggregates.
  # language=rhai
  rhai: |
    let lob = if "lob" in args { args.lob } else { "" };
    let rorg = if "rorg" in args { args.rorg } else { "" };
    let drv = if "driver" in args { args.driver } else { "" };
    let plat = if "platform" in args { args.platform } else { "" };
    let mdl = if "model" in args { args.model } else { "" };
    let jf = if "jobfn" in args { args.jobfn } else { "" };
    let m = if jf != "" { "mart_fact_agg" } else { "mart_spend_agg" };
    let q = sql::select().from(m);
    if lob != "" { q = q.where(sql::ident("lob_id") == lob); }
    if rorg != "" { q = q.where(sql::ident("resource_org") == rorg); }
    if drv != "" { q = q.where(sql::ident("usage_driver") == drv); }
    if plat != "" { q = q.where(sql::ident("platform_id") == plat); }
    if mdl != "" { q = q.where(sql::ident("model_id") == mdl); }
    if jf != "" { q = q.where(sql::ident("job_function") == jf); }
    let series = |name| sql::sum(sql::case_when()
        .when(sql::ident("platform_name") == name, sql::cast(sql::ident("spend_usd"), "numeric"))
        .expr());
    q.field("month_key")
        .expression(sql::ident("month_key").alias("mk"))
        .expression(series.call("Azure OpenAI").alias("azure_openai_sum"))
        .expression(series.call("Claude").alias("claude_sum"))
        .expression(series.call("Google Vertex AI").alias("google_vertex_ai_sum"))
        .expression(series.call("Databricks Mosaic AI").alias("databricks_mosaic_ai_sum"))
        .expression(series.call("GitHub Copilot").alias("github_copilot_sum"))
        .expression(series.call("Amazon Bedrock").alias("amazon_bedrock_sum"))
        .group_by(sql::ident("month_key"))
        .order_by(sql::ident("month_key"), "asc")
