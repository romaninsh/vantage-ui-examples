# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Apps · consumer mix
id_column: consumer_lob_id
columns:
  - { name: consumer_lob_id, type: string, flags: [id, hidden] }
  - { name: member, type: string, flags: [title] }
  - { name: total_display, type: string }
  - { name: share, type: string }
  - { name: share_pct, type: float }
postgres:
  # Reference: apps.consumerMix — grouped by the CONSUMER's line of
  # business; "· owns it" marks the diagonal (consumer = owner).
  rhai: |
    let app = if "app" in args { args.app } else { "" };
    let mo = if "month" in args { args.month } else { "" };
    select().from("mart_app_month")
        .where(expr("app_id = {}", [app]))
        .where(expr("({} = '' OR month_key = {})", [mo, mo]))
        .expression(expr("consumer_lob_id").alias("consumer_lob_id"))
        .expression(expr("consumer_lob_name || CASE WHEN bool_or(consumer_lob_id = owner_lob_id) THEN ' · owns it' ELSE '' END").alias("member"))
        .expression(expr("CASE WHEN sum(spend_usd) >= 1e6 THEN '$' || to_char((sum(spend_usd)) / 1e6, 'FM999,990.00') || 'M' WHEN sum(spend_usd) >= 1e3 THEN '$' || to_char(round((sum(spend_usd)) / 1e3), 'FM999999') || 'K' ELSE '$' || to_char(round(sum(spend_usd)), 'FM999,990') END").alias("total_display"))
        .expression(expr("to_char(round(100.0 * sum(spend_usd) / NULLIF((SELECT sum(t.spend_usd) FROM mart_app_month t WHERE t.app_id = {} AND ({} = '' OR t.month_key = {})), 0), 1), 'FM990.0') || '%'", [app, mo, mo]).alias("share"))
        .expression(expr("round(100.0 * sum(spend_usd) / NULLIF((SELECT sum(t.spend_usd) FROM mart_app_month t WHERE t.app_id = {} AND ({} = '' OR t.month_key = {})), 0), 1)", [app, mo, mo]).alias("share_pct"))
        .group_by(expr("consumer_lob_id"))
        .group_by(expr("consumer_lob_name"))
        .order_by(expr("sum(spend_usd)"), "desc")
