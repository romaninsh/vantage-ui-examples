postgres:
  # Reference: the modelChoice contract (axis rows × fixed tier columns
  # top/high/base/untiered) the page expects but the server never served.
  # Use cases = the six suites.
  # language=rhai
  rhai: |
    sql::select().from("mart_spend_agg")
            // TODO(no-expr): string concat (||) and a string literal in coalesce have no sql:: builder
            .expression(sql::expr("(kind) || ':' || coalesce(month_key, {})", ["Year to date"]).alias("rid"))
            // TODO(no-expr): a string literal in coalesce has no sql:: builder
            .expression(sql::expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            .expression(sql::fx("initcap", [sql::ident("kind")]).alias("member"))
            // TODO(no-expr): aggregate FILTER (WHERE ..) has no sql:: builder
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE model_tier = {})", ["top"]), "double precision").alias("top_raw"))
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE model_tier = {})", ["high"]), "double precision").alias("high_raw"))
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE model_tier = {})", ["base"]), "double precision").alias("base_raw"))
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE model_tier = {})", ["untiered"]), "double precision").alias("untiered_raw"))
            .expression(sql::cast(sql::sum(sql::ident("spend_usd")), "double precision").alias("total_raw"))
            .group_by(sql::ident("kind"))
            // TODO(no-expr): ROLLUP has no sql:: builder
            .group_by(sql::expr("ROLLUP(month_key)"))
            .order_by(sql::sum(sql::ident("spend_usd")), "desc")
