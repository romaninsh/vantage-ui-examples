# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Exec · exec_choice_kind
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: member, type: string, flags: [title] }
  - { name: top_raw, type: float, flags: [hidden] }
  - { name: high_raw, type: float, flags: [hidden] }
  - { name: base_raw, type: float, flags: [hidden] }
  - { name: untiered_raw, type: float, flags: [hidden] }
  - { name: total_raw, type: float, flags: [hidden] }
  - name: top
    type: string
    lazy: |
      let n = row.top_raw; let v = if n == () { 0.0 } else { n + 0.0 };
      let g = |k| { let s = k.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o };
      if v >= 1000000.0 { let c = (v / 10000.0).round().to_int(); "$" + g.call(c / 100) + "." + (if c % 100 < 10 { "0" } else { "" }) + (c % 100) + "M" }
      else if v >= 1000.0 { "$" + g.call((v / 1000.0).round().to_int()) + "K" }
      else { "$" + g.call(v.round().to_int()) }
