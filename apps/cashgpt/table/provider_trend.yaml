# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Exec · provider trend
id_column: provider
columns:
  - { name: provider, type: string, flags: [id, title] }
  - { name: spend_usd, type: float, flags: [hidden] }
  - name: total
    type: string
    lazy: |
      if row.spend_usd == () { () } else {
        let c = (row.spend_usd / 1e6 * 100.0).round().to_int();
        let s = (c / 100).to_string();
        let t = "";
        while s.len() > 3 { t = "," + s.sub_string(s.len() - 3) + t; s = s.sub_string(0, s.len() - 3); }
        let f = c % 100;
        "$" + s + t + "." + (if f < 10 { "0" } else { "" }) + f + "M"
      }
  - { name: trend, type: string, optional: true }
postgres:
  # One row per provider: spend across every month, and the monthly series
  # as a JSON array for a sparkline cell. The series runs over all months in
  # the cube (a month without spend is 0), so every row shares one x axis.
  # The "$x.xxM" total is a lazy column over spend_usd.
  # language=rhai
  rhai: |
    sql::select().from("mart_spend_agg")
        .expression(sql::ident("provider_group").alias("provider"))
        .expression(sql::cast(sql::sum(sql::ident("spend_usd")), "double precision").alias("spend_usd"))
        // TODO(no-expr): scalar correlated subquery with json_agg ... ORDER BY (SQL has no scalar .subquery())
        .expression(sql::expr("(SELECT json_agg(round(coalesce(p.monthly_sum, 0)) ORDER BY mo.month_key) FROM (SELECT DISTINCT month_key FROM mart_spend_agg) mo LEFT JOIN (SELECT s.month_key, sum(s.spend_usd) AS monthly_sum FROM mart_spend_agg s WHERE s.provider_group = mart_spend_agg.provider_group GROUP BY 1) p ON p.month_key = mo.month_key)").alias("trend"))
        .group_by(sql::ident("provider_group"))
        .order_by(sql::sum(sql::ident("spend_usd")), "desc")
