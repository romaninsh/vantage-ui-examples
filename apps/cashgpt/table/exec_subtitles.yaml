# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Exec · exec_subtitles
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: spend_raw, type: float, flags: [hidden] }
  - { name: providers_raw, type: int, flags: [hidden] }
  - { name: lobs_raw, type: int, flags: [hidden] }
  - name: prov_sub
    type: string
    lazy: |
      let n = row.spend_raw;
      if n == () { () } else {
        let g = |k| { let s = k.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o };
        let c = ((n + 0.0) / 10000.0).round().to_int();
        "$" + g.call(c / 100) + "." + (if c % 100 < 10 { "0" } else { "" }) + (c % 100) + "M across " + row.providers_raw + " providers"
      }
  - name: lob_sub
    type: string
    lazy: |
      row.lobs_raw + " lines of business"
postgres:
  # Panel subtitles, formatted in the table and read by observing labels.
  # Counts come from the outer aggregate, not a subquery: the reference
  # quotes the number of series it is rendering for the selected period,
  # so an unscoped count reports the year's providers on a single month.
  # ROLLUP then yields the per-month and year-to-date figures alike.
  # language=rhai
  rhai: |
    sql::select().from("mart_spend_agg")
            // TODO(no-expr): a string literal in coalesce has no sql:: builder
            .expression(sql::expr("coalesce(month_key, {})", ["Year to date"]).alias("rid"))
            // TODO(no-expr): a string literal in coalesce has no sql:: builder
            .expression(sql::expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            .expression(sql::cast(sql::sum(sql::ident("spend_usd")), "double precision").alias("spend_raw"))
            .expression(sql::count_distinct(sql::ident("provider_group")).alias("providers_raw"))
            .expression(sql::count_distinct(sql::ident("lob_id")).alias("lobs_raw"))
            // TODO(no-expr): ROLLUP has no sql:: builder
            .group_by(sql::expr("ROLLUP(month_key)"))
