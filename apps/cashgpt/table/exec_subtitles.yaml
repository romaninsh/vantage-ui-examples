# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Exec · exec_subtitles
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: prov_sub, type: string }
  - { name: lob_sub, type: string }
postgres:
  # Panel subtitles, formatted in SQL and read by observing labels.
  rhai: |
    select().from("mart_spend_agg")
            .expression(expr("coalesce(month_key, {})", ["Year to date"]).alias("rid"))
            .expression(expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            .expression(expr("'$' || to_char(sum(spend_usd) / 1e6, 'FM999,990.00') || 'M across ' || (SELECT count(DISTINCT provider_group) FROM mart_spend_agg) || ' providers'").alias("prov_sub"))
            .expression(expr("(SELECT count(DISTINCT lob_id) FROM mart_spend_agg) || ' lines of business'").alias("lob_sub"))
            .group_by(expr("ROLLUP(month_key)"))
