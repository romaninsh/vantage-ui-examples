# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Watch · islands
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: peer_group, type: string, flags: [hidden] }
  - { name: outlier_display, type: string, optional: true }
  - { name: outlier_note, type: string, optional: true }
  - { name: platform_display, type: string, optional: true }
  - { name: platform_note, type: string, optional: true }
  - { name: mom_display, type: string, optional: true }
  - { name: mom_note_static, type: string }
  - { name: projected_display, type: string, optional: true }
  - { name: projected_note_static, type: string }
postgres:
  # Reference: watch islands over mart_watch_month. Islands 3/4 are month
  # totals so they do not vary with the peer-group tab, exactly as the
  # reference behaves. Projection is NULL (a dash) when no 3-month history
  # exists — the reference formula fabricated 0.63x month_spend there.
  # language=rhai
  rhai: |
    select().from("mart_watch_month")
        .expression(expr("month_key || ':' || peer_group").alias("rid"))
        .field("month_key")
        .field("peer_group")
        .expression(expr("CASE WHEN worst_multiple IS NULL THEN '—' ELSE to_char(round(worst_multiple), 'FM999,999') || '×' END").alias("outlier_display"))
        .expression(expr("CASE WHEN worst_name IS NULL THEN 'no outliers in scope' ELSE worst_name || ' · $' || to_char(round(worst_spend), 'FM999,999,999') END").alias("outlier_note"))
        .expression(expr("coalesce(to_char((SELECT round(100.0 * max(s) / nullif(sum(s), 0), 0) FROM ( SELECT b.top_platform_id, sum(b.spend_usd) AS s FROM mart_peer_benchmark b WHERE b.month_key = mart_watch_month.month_key AND (CASE mart_watch_month.peer_group WHEN 'function' THEN b.func_sigma WHEN 'grade' THEN b.grade_sigma ELSE b.team_sigma END) >= 3 GROUP BY 1) x), 'FM990') || '%', '—')").alias("platform_display"))
        .expression(expr("coalesce((SELECT p.platform_name FROM ( SELECT b.top_platform_id, sum(b.spend_usd) AS s FROM mart_peer_benchmark b WHERE b.month_key = mart_watch_month.month_key AND (CASE mart_watch_month.peer_group WHEN 'function' THEN b.func_sigma WHEN 'grade' THEN b.grade_sigma ELSE b.team_sigma END) >= 3 GROUP BY 1 ORDER BY 2 DESC LIMIT 1) w JOIN silver.dim_platform p ON p.platform_id = w.top_platform_id) || ', across the outliers', 'no outliers in scope')").alias("platform_note"))
        .expression(expr("CASE WHEN prev_spend IS NULL OR prev_spend = 0 THEN '—' ELSE to_char(round(100.0 * (month_spend / prev_spend - 1), 1), 'FM990.0') || '%' END").alias("mom_display"))
        .expression(expr("'bank-wide, versus the previous month'").alias("mom_note_static"))
        .expression(expr("'latest month at the trailing three-month rate'").alias("projected_note_static"))
        .expression(expr("CASE WHEN spend_three_back IS NULL OR spend_three_back = 0 THEN NULL WHEN round(month_spend * power(GREATEST(month_spend / spend_three_back, 0.25)::numeric, 1.0 / 3), 2) >= 1e6 THEN '$' || to_char(month_spend * power(GREATEST(month_spend / spend_three_back, 0.25)::numeric, 1.0 / 3) / 1e6, 'FM999,990.00') || 'M' ELSE '$' || to_char(round(month_spend * power(GREATEST(month_spend / spend_three_back, 0.25)::numeric, 1.0 / 3) / 1e3), 'FM999,999') || 'K' END").alias("projected_display"))
