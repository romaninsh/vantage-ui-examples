# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Apps · provider mix
id_column: provider_group
columns:
  - { name: provider_group, type: string, flags: [id, title] }
  - { name: total_display, type: string }
  - { name: share, type: string }
  - { name: share_pct, type: float }
postgres:
  # Reference: apps.providerMix, grouped to the provider like the client
  # does before rendering its BarList.
  rhai: |
    let app = if "app" in args { args.app } else { "" };
    let mo = if "month" in args { args.month } else { "" };
    select().from("mart_app_model_month")
        .where(expr("app_id = {}", [app]))
        .where(expr("({} = '' OR month_key = {})", [mo, mo]))
        .expression(expr("provider_group").alias("provider_group"))
        .expression(expr("CASE WHEN sum(spend_usd) >= 1e6 THEN '$' || to_char((sum(spend_usd)) / 1e6, 'FM999,990.00') || 'M' WHEN sum(spend_usd) >= 1e3 THEN '$' || to_char(round((sum(spend_usd)) / 1e3), 'FM999999') || 'K' ELSE '$' || to_char(round(sum(spend_usd)), 'FM999,990') END").alias("total_display"))
        .expression(expr("to_char(round(100.0 * sum(spend_usd) / NULLIF((SELECT sum(t.spend_usd) FROM mart_app_model_month t WHERE t.app_id = {} AND ({} = '' OR t.month_key = {})), 0), 1), 'FM990.0') || '%'", [app, mo, mo]).alias("share"))
        .expression(expr("round(100.0 * sum(spend_usd) / NULLIF((SELECT sum(t.spend_usd) FROM mart_app_model_month t WHERE t.app_id = {} AND ({} = '' OR t.month_key = {})), 0), 1)", [app, mo, mo]).alias("share_pct"))
        .group_by(expr("provider_group"))
        .order_by(expr("sum(spend_usd)"), "desc")
