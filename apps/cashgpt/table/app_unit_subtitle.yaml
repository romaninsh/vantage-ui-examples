# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Apps · unit subtitle
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: line, type: string }
postgres:
  # Reference subtitle: "{primary_unit} per month, by consuming line of
  # business" — the unit is a property of the app.
  rhai: |
    let app = if "app" in args { args.app } else { "" };
    select().from_as("dim_app", "a")
        .where(expr("a.app_id = {}", [app]))
        .expression(expr("a.app_id").alias("rid"))
        .expression(expr("a.primary_unit || ' per month, by consuming line of business'").alias("line"))
