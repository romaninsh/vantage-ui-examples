# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Models · top 10 (list)
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: rank, type: int, flags: [hidden] }
  - name: rank_display
    type: string
    flags: [hidden]
    lazy: 'if row.member == "Other" { "" } else { row.rank.to_string() + "." }'
  - { name: member, type: string, flags: [title] }
  - name: provider_group
    type: string
    lazy: 'if row.member == "Other" { "" } else { row.provider_max }'
  - name: total_display
    type: string
    lazy: |
      let c = (row.total_usd / 1e6 * 100.0).round().to_int();
      let s = (c / 100).to_string();
      let t = "";
      while s.len() > 3 { t = "," + s.sub_string(s.len() - 3) + t; s = s.sub_string(0, s.len() - 3); }
      let f = c % 100;
      "$" + s + t + "." + (if f < 10 { "0" } else { "" }) + f + "M"
  - name: share
    type: string
    lazy: |
      if row.share_pct == () { () } else {
        let t = (row.share_pct * 10.0).round().to_int();
        (t / 10).to_string() + "." + (t % 10).to_string() + "%"
      }
  - { name: bar_pct, type: float }
  - { name: provider_max, type: string, flags: [hidden] }
  - { name: total_usd, type: float, flags: [hidden] }
  - { name: share_pct, type: float, flags: [hidden] }
postgres:
  # Reference: overview.models via topNWithTail — top 10 by spend plus an
  # OTHER row folding the tail (a top-N that drops the tail reads as the
  # whole picture). Two-level: rank in a derived table, regroup outside.
  # rank_display, provider_group, total_display and share are lazy columns.
  # language=rhai
  rhai: |
    let lob = if "lob" in args { args.lob } else { "" };
    let rorg = if "rorg" in args { args.rorg } else { "" };
    let drv = if "driver" in args { args.driver } else { "" };
    let plat = if "platform" in args { args.platform } else { "" };
    let mdl = if "model" in args { args.model } else { "" };
    let jf = if "jobfn" in args { args.jobfn } else { "" };
    let m = if jf != "" { "mart_fact_agg" } else { "mart_spend_agg" };
    let inner = sql::select().from(m);
    if lob != "" { inner = inner.where(sql::ident("lob_id") == lob); }
    if rorg != "" { inner = inner.where(sql::ident("resource_org") == rorg); }
    if drv != "" { inner = inner.where(sql::ident("usage_driver") == drv); }
    if plat != "" { inner = inner.where(sql::ident("platform_id") == plat); }
    if mdl != "" { inner = inner.where(sql::ident("model_id") == mdl); }
    if jf != "" { inner = inner.where(sql::ident("job_function") == jf); }
    let by_scope = sql::window()
        .partition_by(sql::fx("grouping", [sql::ident("month_key")]))
        .partition_by(sql::ident("month_key"))
        .order_by(sql::sum(sql::ident("spend_usd")), "desc");
    inner = inner
        // TODO(no-expr): literal argument to coalesce (sql::coalesce takes expressions or identifiers only)
        .expression(sql::expr("coalesce(month_key, {})", ["All months"]).alias("scope"))
        .field("model_name")
        .expression(sql::max(sql::ident("provider_group")).alias("provider_group"))
        .expression(sql::sum(sql::ident("spend_usd")).alias("v"))
        .expression(by_scope.apply(sql::fx("row_number", [])).alias("rk"))
        .group_by(sql::ident("model_name"))
        .group_by(sql::fx("rollup", [sql::ident("month_key")]));
    // TODO(no-expr): CASE with a literal ELSE 'Other' (case_when().else_ takes expressions or identifiers only)
    let member = sql::expr("CASE WHEN rk <= 10 THEN model_name ELSE 'Other' END");
    sql::select().from_as(inner, "m")
        // TODO(no-expr): string concat (||) with a literal separator has no sql:: builder
        .expression(sql::expr("scope || ':' || CASE WHEN rk <= 10 THEN model_name ELSE 'Other' END").alias("rid"))
        .expression(sql::ident("scope").alias("month_key"))
        .expression(member.alias("member"))
        .expression(sql::min(sql::ident("rk")).alias("rank"))
        .expression(sql::max(sql::ident("provider_group")).alias("provider_max"))
        .expression(sql::cast(sql::sum(sql::ident("v")), "double precision").alias("total_usd"))
        // TODO(no-expr): literal 100.0, nullif(x, 0) and a window over an aggregate (sum(sum(v)) OVER)
        .expression(sql::expr("round(100.0 * sum(v) / nullif(max(sum(v)) OVER (PARTITION BY scope), 0), 1)").alias("bar_pct"))
        // TODO(no-expr): literal 100.0, nullif(x, 0) and a window over an aggregate (sum(sum(v)) OVER)
        .expression(sql::cast(sql::expr("round(100.0 * sum(v) / nullif(sum(sum(v)) OVER (PARTITION BY scope), 0), 1)"), "double precision").alias("share_pct"))
        .group_by(sql::ident("scope"))
        .group_by(member)
        .order_by(sql::ident("scope"), "asc")
        .order_by(sql::min(sql::ident("rk")), "asc")
