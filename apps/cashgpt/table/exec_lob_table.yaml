postgres:
  # Reference: lobTableSql (defined, never registered) — channel split per
  # LOB; users is PEAK monthly, never a sum; cost/user divides HERE.
  # Pinned to mart_fact_agg (the only mart carrying app_name).
  # language=rhai
  rhai: |
    sql::select().from("mart_fact_agg")
            // TODO(no-expr): string concat (||) and a string literal in coalesce have no sql:: builder
            .expression(sql::expr("(lob_id) || ':' || coalesce(month_key, {})", ["Year to date"]).alias("rid"))
            // TODO(no-expr): a string literal in coalesce has no sql:: builder
            .expression(sql::expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            .expression(sql::max(sql::ident("lob_name")).alias("lob_name"))
            // TODO(no-expr): aggregate FILTER (WHERE ..) has no sql:: builder
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE app_name = {})", ["Claude Code"]), "double precision").alias("cc_app_raw"))
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE platform_id = {})", ["github-copilot"]), "double precision").alias("copilot_raw"))
            // TODO(no-expr): aggregate FILTER with IN (list) has no sql:: builder
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE kind IN ('assistant','analysis','research'))"), "double precision").alias("llm_suite_raw"))
            // TODO(no-expr): aggregate FILTER with IN (list) has no sql:: builder
            .expression(sql::cast(sql::expr("sum(spend_usd) - coalesce(sum(spend_usd) FILTER (WHERE app_name = 'Claude Code'), 0) - coalesce(sum(spend_usd) FILTER (WHERE platform_id = 'github-copilot'), 0) - coalesce(sum(spend_usd) FILTER (WHERE kind IN ('assistant','analysis','research')), 0)"), "double precision").alias("other_raw"))
            .expression(sql::cast(sql::sum(sql::ident("spend_usd")), "double precision").alias("spend_raw"))
            // TODO(no-expr): GROUPING() and scalar subqueries have no sql:: builder
            .expression(sql::expr("(SELECT max(u) FROM (SELECT a.month_key, sum(a.users) AS u FROM mart_active_month a WHERE a.lob_id = mart_fact_agg.lob_id AND (GROUPING(mart_fact_agg.month_key) = 1 OR a.month_key = mart_fact_agg.month_key) GROUP BY 1) x)").alias("people_raw"))
            // TODO(no-expr): GROUPING() and scalar subqueries have no sql:: builder
            .expression(sql::cast(sql::expr("round(sum(spend_usd) / nullif((SELECT max(u) FROM (SELECT a.month_key, sum(a.users) AS u FROM mart_active_month a WHERE a.lob_id = mart_fact_agg.lob_id AND (GROUPING(mart_fact_agg.month_key) = 1 OR a.month_key = mart_fact_agg.month_key) GROUP BY 1) x), 0))"), "double precision").alias("cost_per_user_raw"))
            .group_by(sql::ident("lob_id"))
            // TODO(no-expr): ROLLUP has no sql:: builder
            .group_by(sql::expr("ROLLUP(month_key)"))
            .order_by(sql::sum(sql::ident("spend_usd")), "desc")
