# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Exec · exec_lob_table
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: lob_name, type: string, flags: [title] }
  - { name: cc_app, type: string }
  - { name: copilot, type: string }
  - { name: llm_suite, type: string }
  - { name: other, type: string }
  - { name: spend, type: string }
  - { name: people, type: string }
  - { name: cost_per_user, type: string }
postgres:
  # Reference: lobTableSql (defined, never registered) — channel split per
  # LOB; users is PEAK monthly, never a sum; cost/user divides HERE.
  # Pinned to mart_fact_agg (the only mart carrying app_name).
  # language=rhai
  rhai: |
    select().from("mart_fact_agg")
            .expression(expr("(lob_id) || ':' || coalesce(month_key, {})", ["Year to date"]).alias("rid"))
            .expression(expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            .expression(expr("max(lob_name)").alias("lob_name"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE app_name = 'Claude Code')) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE app_name = 'Claude Code')) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE app_name = 'Claude Code')) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE app_name = 'Claude Code')) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE app_name = 'Claude Code')), 0)), 'FM999,999') END").alias("cc_app"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE platform_id = 'github-copilot')) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE platform_id = 'github-copilot')) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE platform_id = 'github-copilot')) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE platform_id = 'github-copilot')) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE platform_id = 'github-copilot')), 0)), 'FM999,999') END").alias("copilot"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE kind IN ('assistant','analysis','research'))) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE kind IN ('assistant','analysis','research'))) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE kind IN ('assistant','analysis','research'))) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE kind IN ('assistant','analysis','research'))) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE kind IN ('assistant','analysis','research'))), 0)), 'FM999,999') END").alias("llm_suite"))
            .expression(expr("CASE WHEN (sum(spend_usd) - coalesce(sum(spend_usd) FILTER (WHERE app_name = 'Claude Code'), 0) - coalesce(sum(spend_usd) FILTER (WHERE platform_id = 'github-copilot'), 0) - coalesce(sum(spend_usd) FILTER (WHERE kind IN ('assistant','analysis','research')), 0)) >= 1e6 THEN '$' || to_char((sum(spend_usd) - coalesce(sum(spend_usd) FILTER (WHERE app_name = 'Claude Code'), 0) - coalesce(sum(spend_usd) FILTER (WHERE platform_id = 'github-copilot'), 0) - coalesce(sum(spend_usd) FILTER (WHERE kind IN ('assistant','analysis','research')), 0)) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) - coalesce(sum(spend_usd) FILTER (WHERE app_name = 'Claude Code'), 0) - coalesce(sum(spend_usd) FILTER (WHERE platform_id = 'github-copilot'), 0) - coalesce(sum(spend_usd) FILTER (WHERE kind IN ('assistant','analysis','research')), 0)) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) - coalesce(sum(spend_usd) FILTER (WHERE app_name = 'Claude Code'), 0) - coalesce(sum(spend_usd) FILTER (WHERE platform_id = 'github-copilot'), 0) - coalesce(sum(spend_usd) FILTER (WHERE kind IN ('assistant','analysis','research')), 0)) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) - coalesce(sum(spend_usd) FILTER (WHERE app_name = 'Claude Code'), 0) - coalesce(sum(spend_usd) FILTER (WHERE platform_id = 'github-copilot'), 0) - coalesce(sum(spend_usd) FILTER (WHERE kind IN ('assistant','analysis','research')), 0)), 0)), 'FM999,999') END").alias("other"))
            .expression(expr("CASE WHEN (sum(spend_usd)) >= 1e6 THEN '$' || to_char((sum(spend_usd)) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd)) >= 1e3 THEN '$' || to_char(round((sum(spend_usd)) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd)), 0)), 'FM999,999') END").alias("spend"))
            .expression(expr("to_char((SELECT max(u) FROM (SELECT a.month_key, sum(a.users) AS u FROM mart_active_month a WHERE a.lob_id = mart_fact_agg.lob_id AND (GROUPING(mart_fact_agg.month_key) = 1 OR a.month_key = mart_fact_agg.month_key) GROUP BY 1) x), 'FM999,999,999')").alias("people"))
            .expression(expr("'$' || to_char(round(sum(spend_usd) / nullif((SELECT max(u) FROM (SELECT a.month_key, sum(a.users) AS u FROM mart_active_month a WHERE a.lob_id = mart_fact_agg.lob_id AND (GROUPING(mart_fact_agg.month_key) = 1 OR a.month_key = mart_fact_agg.month_key) GROUP BY 1) x), 0)), 'FM999,999')").alias("cost_per_user"))
            .group_by(expr("lob_id"))
            .group_by(expr("ROLLUP(month_key)"))
            .order_by(expr("sum(spend_usd)"), "desc")
