# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Year to date (KPI)
id_column: month_key
columns:
  - { name: month_key, type: string, flags: [id] }
  - { name: display, type: string, flags: [title] }
  - { name: change_text, type: string }
  - { name: spark, type: string }
postgres:
  # Reference: ISLANDS[1]. No delta — a cumulative total has nothing to be up against. Spark is cumulative.
  # Identical-content rule: every figure, delta and note matches the Vue
  # reference; all derived in SQL — the client renders, never computes.
  # language=rhai
  rhai: |
    let lob = if "lob" in args { args.lob } else { "" };
    let rorg = if "rorg" in args { args.rorg } else { "" };
    let drv = if "driver" in args { args.driver } else { "" };
    let plat = if "platform" in args { args.platform } else { "" };
    let mdl = if "model" in args { args.model } else { "" };
    let jf = if "jobfn" in args { args.jobfn } else { "" };
    let m = "mart_spend_agg";
    let g = "({} = '' OR lob_id = {}) AND ({} = '' OR resource_org = {}) AND ({} = '' OR usage_driver = {}) AND ({} = '' OR platform_id = {}) AND ({} = '' OR model_id = {})";
    let ga = [lob, lob, rorg, rorg, drv, drv, plat, plat, mdl, mdl];
    if jf != "" { m = "mart_fact_agg"; g += " AND ({} = '' OR job_function = {})"; ga += [jf, jf]; }
    let monthly = "(SELECT month_key AS mk, sum(spend_usd) AS v FROM " + m + " WHERE " + g + " GROUP BY 1)";
    let lobcnt = "(SELECT count(DISTINCT lob_id) FROM " + m + " WHERE " + g + ")";
    let q = sql::select().from(m);
    if lob != "" { q = q.where(sql::ident("lob_id") == lob); }
    if rorg != "" { q = q.where(sql::ident("resource_org") == rorg); }
    if drv != "" { q = q.where(sql::ident("usage_driver") == drv); }
    if plat != "" { q = q.where(sql::ident("platform_id") == plat); }
    if mdl != "" { q = q.where(sql::ident("model_id") == mdl); }
    if jf != "" { q = q.where(sql::ident("job_function") == jf); }
    q
            // TODO(no-expr): literal argument to coalesce (sql::coalesce takes expressions or identifiers only)
            .expression(sql::expr("coalesce(month_key, {})", ["All months"]).alias("month_key"))
            // TODO(no-expr): scalar subquery (SQL has no scalar .subquery()), CASE with literal branches, to_char
            .expression(sql::expr("'$' || to_char((CASE WHEN GROUPING(month_key) = 1 THEN (SELECT sum(t.v) FROM " + monthly + " t) ELSE sum(spend_usd) END) / 1e6, 'FM999,990.00') || 'M'", ga).alias("display"))
            // TODO(no-expr): scalar subquery (SQL has no scalar .subquery()), string concat, to_char
            .expression(sql::expr("'$' || to_char((CASE WHEN GROUPING(month_key) = 1 THEN (SELECT sum(t.v) FROM " + monthly + " t) ELSE sum(spend_usd) END) / " + lobcnt + " / 1e6, 'FM990.00') || 'M average per line of business'", ga + ga).alias("change_text"))
            // TODO(no-expr): scalar subquery with string_agg ... ORDER BY over a window sum
            .expression(sql::expr("(SELECT string_agg(c::text, ',' ORDER BY mk) FROM (SELECT t.mk, round(sum(t.v) OVER (ORDER BY t.mk)) AS c FROM " + monthly + " t) y)", ga).alias("spark"))
            .group_by(sql::fx("ROLLUP", [sql::ident("month_key")]))
