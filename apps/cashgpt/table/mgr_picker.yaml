# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Manager picker
id_column: org_id
columns:
  - { name: org_id, type: string, flags: [id, hidden] }
  - { name: full_name, type: string, flags: [title] }
  - { name: org_name, type: string }
  - { name: lob_name, type: string }
  - { name: city, type: string }
  - { name: headcount, type: int }
postgres:
  # Reference: manager.search — anyone who heads a level-5 section. The
  # name search is the grid's quicksearch (ILIKE server-side, same intent
  # as the reference's trigram term).
  # language=rhai
  rhai: |
    let e = sql::ident("dim_employee");
    let o = sql::ident("o");
    sql::select().from("dim_employee")
        .inner_join("dim_org_unit", "o", o["org_id"] == e["heads_org_id"])
        .where(o["org_level"] == 5)
        .expression(o["org_id"].alias("org_id"))
        .expression(e["full_name"].alias("full_name"))
        .expression(o["org_name"].alias("org_name"))
        .expression(e["lob_name"].alias("lob_name"))
        .expression(e["city"].alias("city"))
        .expression(o["headcount"].alias("headcount"))
        .order_by(o["headcount"], "desc")
