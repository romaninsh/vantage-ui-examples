# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Trajectory breakdown · driver
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - name: rank
    type: int
    flags: [hidden]
    lazy: |
      let order = ["Developer", "Productivity", "Application"];
      let r = 99;
      for i in 0..order.len() { if order[i] == row.member { r = i + 1; break; } }
      r
  - { name: member, type: string, flags: [title] }
  - name: mom
    type: string
    lazy: |
      let c = row.cur_v;
      let p = row.prev_v;
      if p == () || p == 0.0 { "—" }
      else if c == () { () }
      else {
        let t = (100.0 * (c - p).abs() / p * 10.0).round().to_int();
        (if c >= p { "▲" } else { "▼" }) + (t / 10).to_string() + "." + (t % 10).to_string() + "%"
      }
  - name: total_display
    type: string
    lazy: |
      let c = (row.total_usd / 1e6 * 100.0).round().to_int();
      let s = (c / 100).to_string();
      let t = "";
      while s.len() > 3 { t = "," + s.sub_string(s.len() - 3) + t; s = s.sub_string(0, s.len() - 3); }
      let f = c % 100;
      "$" + s + t + "." + (if f < 10 { "0" } else { "" }) + f + "M"
  - name: share
    type: string
    lazy: |
      if row.share_pct == () { () } else {
        let t = (row.share_pct * 10.0).round().to_int();
        (t / 10).to_string() + "." + (t % 10).to_string() + "%"
      }
  - { name: share_pct, type: float }
  - { name: total_usd, type: float, flags: [hidden] }
  - { name: cur_v, type: float, flags: [hidden] }
  - { name: prev_v, type: float, flags: [hidden] }
postgres:
  # GROUP BY the RAW column — correlated subqueries may only reference
  # grouping columns, and an expression group (initcap(...)) makes the
  # raw column illegal in them. Display casing happens in projection.
  # mom, total_display and share are lazy columns over cur_v / prev_v,
  # total_usd and share_pct; rank is lazy over member.
  # language=rhai
  rhai: |
    let lob = if "lob" in args { args.lob } else { "" };
    let rorg = if "rorg" in args { args.rorg } else { "" };
    let drv = if "driver" in args { args.driver } else { "" };
    let plat = if "platform" in args { args.platform } else { "" };
    let mdl = if "model" in args { args.model } else { "" };
    let jf = if "jobfn" in args { args.jobfn } else { "" };
    let m = "mart_spend_agg";
    let g = "({} = '' OR lob_id = {}) AND ({} = '' OR resource_org = {}) AND ({} = '' OR usage_driver = {}) AND ({} = '' OR platform_id = {}) AND ({} = '' OR model_id = {})";
    let ga = [lob, lob, rorg, rorg, drv, drv, plat, plat, mdl, mdl];
    if jf != "" { m = "mart_fact_agg"; g += " AND ({} = '' OR job_function = {})"; ga += [jf, jf]; }
    let monthly = "(SELECT month_key AS mk, usage_driver AS mem, sum(spend_usd) AS v FROM " + m + " WHERE " + g + " GROUP BY 1, 2)";
    let scope_mk = "(CASE WHEN GROUPING(month_key) = 1 THEN (SELECT max(mk) FROM " + monthly + " lm) ELSE month_key END)";
    let scope_total = "CASE WHEN GROUPING(month_key) = 1 THEN (SELECT sum(v) FROM " + monthly + " t) ELSE (SELECT sum(v) FROM " + monthly + " t WHERE t.mk = month_key) END";
    let q = sql::select().from(m);
    if lob != "" { q = q.where(sql::ident("lob_id") == lob); }
    if rorg != "" { q = q.where(sql::ident("resource_org") == rorg); }
    if drv != "" { q = q.where(sql::ident("usage_driver") == drv); }
    if plat != "" { q = q.where(sql::ident("platform_id") == plat); }
    if mdl != "" { q = q.where(sql::ident("model_id") == mdl); }
    if jf != "" { q = q.where(sql::ident("job_function") == jf); }
    // TODO(no-expr): string concat (||) and a literal in coalesce(x, 'All months') have no sql:: builder
    q.expression(sql::expr("(initcap(usage_driver)) || ':' || coalesce(month_key, {})", ["All months"]).alias("rid"))
        // TODO(no-expr): literal argument to coalesce (sql::coalesce takes expressions or identifiers only)
        .expression(sql::expr("coalesce(month_key, {})", ["All months"]).alias("month_key"))
        .expression(sql::fx("initcap", [sql::ident("usage_driver")]).alias("member"))
        // TODO(no-expr): scalar correlated subquery with GROUPING() (no scalar .subquery() in sql::)
        .expression(sql::cast(sql::expr("(SELECT v FROM " + monthly + " t WHERE t.mem = usage_driver AND t.mk = " + scope_mk + ")", ga + ga), "double precision").alias("cur_v"))
        // TODO(no-expr): scalar correlated subquery with GROUPING() (no scalar .subquery() in sql::)
        .expression(sql::cast(sql::expr("(SELECT v FROM " + monthly + " t WHERE t.mem = usage_driver AND t.mk < " + scope_mk + " ORDER BY t.mk DESC LIMIT 1)", ga + ga), "double precision").alias("prev_v"))
        .expression(sql::cast(sql::sum(sql::ident("spend_usd")), "double precision").alias("total_usd"))
        // TODO(no-expr): scalar correlated subqueries with GROUPING(), a literal 100.0 and nullif(x, 0)
        .expression(sql::cast(sql::expr("round(100.0 * sum(spend_usd) / nullif(" + scope_total + ", 0), 1)", ga + ga), "double precision").alias("share_pct"))
        .group_by(sql::ident("usage_driver"))
        .group_by(sql::fx("ROLLUP", [sql::ident("month_key")]))
        .order_by(sql::sum(sql::ident("spend_usd")), "desc")
