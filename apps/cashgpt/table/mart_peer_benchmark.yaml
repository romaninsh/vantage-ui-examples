# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Peer benchmarks
id_column: rid
columns:
  # Synthetic row identity: the marts have composite grains and no PK, and
  # vantage dedupes rows by id — so the id must cover the full grain.
  # (Projected in the query below; column-level `expr:` is not wired for
  # the Postgres driver yet.)
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string }
  - { name: employee_id, type: string }
  - { name: full_name, type: string, flags: [title] }
  - { name: spend_usd, type: float }
  - { name: tokens, type: int }
  - { name: team_org_id, type: string }
  - { name: team_name, type: string }
  - { name: team_code, type: string }
  - { name: job_function, type: string }
  - { name: seniority_code, type: string }
  - { name: lob_id, type: string }
  - { name: lob_name, type: string }
  - { name: resource_org, type: string }
  - { name: org_path, type: string }
  - { name: department_id, type: string }
  - { name: section_id, type: string }
  - { name: top_platform_id, type: string }
  - { name: top_model_id, type: string }
  - { name: top_tier_share, type: float }
  - { name: had_spike, type: bool }
  - { name: team_peers, type: int }
  - { name: func_peers, type: int }
  - { name: grade_peers, type: int }
  - { name: team_mean, type: float }
  - { name: func_mean, type: float }
  - { name: grade_mean, type: float }
  - { name: team_multiple, type: float }
  - { name: func_multiple, type: float }
  - { name: grade_multiple, type: float }
  - { name: team_sigma, type: float }
  - { name: func_sigma, type: float }
  - { name: grade_sigma, type: float }
postgres:
  rhai: |
    select().from("mart_peer_benchmark")
        .expression(expr("coalesce(month_key,'') || ':' || coalesce(employee_id,'') || ':' || coalesce(full_name,'') || ':' || coalesce(team_org_id,'') || ':' || coalesce(team_name,'') || ':' || coalesce(team_code,'') || ':' || coalesce(job_function,'') || ':' || coalesce(seniority_code,'') || ':' || coalesce(lob_id,'') || ':' || coalesce(lob_name,'') || ':' || coalesce(resource_org,'') || ':' || coalesce(org_path,'') || ':' || coalesce(department_id,'') || ':' || coalesce(section_id,'') || ':' || coalesce(top_platform_id,'') || ':' || coalesce(top_model_id,'')").alias("rid"))
        .field("month_key")
        .field("employee_id")
        .field("full_name")
        .field("spend_usd")
        .field("tokens")
        .field("team_org_id")
        .field("team_name")
        .field("team_code")
        .field("job_function")
        .field("seniority_code")
        .field("lob_id")
        .field("lob_name")
        .field("resource_org")
        .field("org_path")
        .field("department_id")
        .field("section_id")
        .field("top_platform_id")
        .field("top_model_id")
        .field("top_tier_share")
        .field("had_spike")
        .field("team_peers")
        .field("func_peers")
        .field("grade_peers")
        .field("team_mean")
        .field("func_mean")
        .field("grade_mean")
        .field("team_multiple")
        .field("func_multiple")
        .field("grade_multiple")
        .field("team_sigma")
        .field("func_sigma")
        .field("grade_sigma")
