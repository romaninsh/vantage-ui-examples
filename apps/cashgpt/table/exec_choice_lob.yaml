# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Exec · exec_choice_lob
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: member, type: string, flags: [title] }
  - { name: top, type: string }
  - { name: high, type: string }
  - { name: base, type: string }
  - { name: untiered, type: string }
  - { name: Total, type: string }
postgres:
  # Reference: the modelChoice contract (axis rows × fixed tier columns
  # top/high/base/untiered) the page expects but the server never served.
  # All 13 lines of business.
  # language=rhai
  rhai: |
    select().from("mart_spend_agg")
            .expression(expr("(lob_id) || ':' || coalesce(month_key, {})", ["Year to date"]).alias("rid"))
            .expression(expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            .expression(expr("max(lob_name)").alias("member"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE model_tier = 'top')) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE model_tier = 'top')) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE model_tier = 'top')) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE model_tier = 'top')) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE model_tier = 'top')), 0)), 'FM999,999') END").alias("top"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE model_tier = 'high')) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE model_tier = 'high')) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE model_tier = 'high')) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE model_tier = 'high')) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE model_tier = 'high')), 0)), 'FM999,999') END").alias("high"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE model_tier = 'base')) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE model_tier = 'base')) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE model_tier = 'base')) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE model_tier = 'base')) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE model_tier = 'base')), 0)), 'FM999,999') END").alias("base"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE model_tier = 'untiered')) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE model_tier = 'untiered')) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE model_tier = 'untiered')) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE model_tier = 'untiered')) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE model_tier = 'untiered')), 0)), 'FM999,999') END").alias("untiered"))
            .expression(expr("CASE WHEN (sum(spend_usd)) >= 1e6 THEN '$' || to_char((sum(spend_usd)) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd)) >= 1e3 THEN '$' || to_char(round((sum(spend_usd)) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd)), 0)), 'FM999,999') END").alias("Total"))
            .group_by(expr("lob_id"))
            .group_by(expr("ROLLUP(month_key)"))
            .order_by(expr("sum(spend_usd)"), "desc")
