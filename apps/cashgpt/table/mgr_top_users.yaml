# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Manager · top users
id_column: employee_id
columns:
  - { name: employee_id, type: string, flags: [id, hidden] }
  - { name: full_name, type: string, flags: [title] }
  - { name: job_function, type: string, flags: [hidden], optional: true }
  - { name: seniority_code, type: string, flags: [hidden], optional: true }
  - { name: team_name, type: string, flags: [hidden], optional: true }
  - { name: city, type: string, flags: [hidden], optional: true }
  - { name: spend, type: float, flags: [hidden], optional: true }
  - { name: spend_tier, type: float, flags: [hidden], optional: true }
  - name: role
    type: string
    lazy: |
      if row.job_function == () || row.seniority_code == () { () } else { row.job_function + " · " + row.seniority_code }
  - name: team
    type: string
    lazy: |
      if row.team_name == () { () } else { row.team_name + " · " + (if row.city == () { "—" } else { row.city }) }
  - name: spend_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      fn grp(i) { let s = i.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o }
      if row.spend == () { () } else { "$" + grp(num(row.spend).round().to_int()) }
  - { name: active_months, type: int }
  - name: tier_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      let share = if row.spend == () || row.spend_tier == () || num(row.spend) == 0.0 { 0.0 } else { num(row.spend_tier) / num(row.spend) };
      (100.0 * share).round().to_int().to_string() + "%"
postgres:
  # Reference: manager.topUsers — 25 highest spenders in the org, months
  # scoped; active_months counts the months in scope (count(*) over the
  # person-month mart, exactly the reference's count).
  # language=rhai
  rhai: |
    let org = if "org" in args { args.org } else { "" };
    let mo = if "month" in args { args.month } else { "" };
    let e = sql::ident("e");
    // TODO(no-expr): OR / LIKE / scalar subquery / string concat for the org_path prefix scope
    let scope = sql::expr("(e.org_path = (SELECT org_path FROM dim_org_unit WHERE org_id = {}) OR e.org_path LIKE (SELECT org_path FROM dim_org_unit WHERE org_id = {}) || '/%')", [org, org]);
    let q = sql::select().from_as("mart_employee_month", "e").where(scope);
    if mo != "" { q = q.where(e["month_key"] == mo); }
    q.expression(e["employee_id"].alias("employee_id"))
        .expression(e["full_name"].alias("full_name"))
        .expression(e["job_function"].alias("job_function"))
        .expression(e["seniority_code"].alias("seniority_code"))
        .expression(e["team_name"].alias("team_name"))
        .expression(e["city"].alias("city"))
        .expression(sql::sum(e["spend_usd"]).alias("spend"))
        .expression(sql::count(e["employee_id"]).alias("active_months"))
        .expression(sql::sum(sql::mul(e["spend_usd"], e["top_tier_share"])).alias("spend_tier"))
        .group_by(e["employee_id"])
        .group_by(e["full_name"])
        .group_by(e["job_function"])
        .group_by(e["seniority_code"])
        .group_by(e["team_name"])
        .group_by(e["city"])
        .order_by(sql::sum(e["spend_usd"]), "desc")
        .limit(25, 0)
