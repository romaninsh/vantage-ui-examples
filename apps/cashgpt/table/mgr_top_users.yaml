# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Manager · top users
id_column: employee_id
columns:
  - { name: employee_id, type: string, flags: [id, hidden] }
  - { name: full_name, type: string, flags: [title] }
  - { name: role, type: string }
  - { name: team, type: string }
  - { name: spend_display, type: string }
  - { name: active_months, type: int }
  - { name: tier_display, type: string }
postgres:
  # Reference: manager.topUsers — 25 highest spenders in the org, months
  # scoped; active_months counts the months in scope (count(*) over the
  # person-month mart, exactly the reference's count).
  rhai: |
    let org = if "org" in args { args.org } else { "" };
    let mo = if "month" in args { args.month } else { "" };
    select().from_as("mart_employee_month", "e")
        .where(expr("(e.org_path = (SELECT org_path FROM dim_org_unit WHERE org_id = {}) OR e.org_path LIKE (SELECT org_path FROM dim_org_unit WHERE org_id = {}) || '/%')", [org, org]))
        .where(expr("({} = '' OR e.month_key = {})", [mo, mo]))
        .expression(expr("e.employee_id").alias("employee_id"))
        .expression(expr("e.full_name").alias("full_name"))
        .expression(expr("e.job_function || ' · ' || e.seniority_code").alias("role"))
        .expression(expr("e.team_name || ' · ' || coalesce(e.city, '—')").alias("team"))
        .expression(expr("'$' || to_char(round(sum(e.spend_usd)), 'FM999,999,999')").alias("spend_display"))
        .expression(expr("count(*)").alias("active_months"))
        .expression(expr("to_char(round(100.0 * coalesce(sum(e.spend_usd * e.top_tier_share) / NULLIF(sum(e.spend_usd), 0), 0)), 'FM990') || '%'").alias("tier_display"))
        .group_by(expr("e.employee_id"))
        .group_by(expr("e.full_name"))
        .group_by(expr("e.job_function"))
        .group_by(expr("e.seniority_code"))
        .group_by(expr("e.team_name"))
        .group_by(expr("e.city"))
        .order_by(expr("sum(e.spend_usd)"), "desc")
        .limit(25, 0)
