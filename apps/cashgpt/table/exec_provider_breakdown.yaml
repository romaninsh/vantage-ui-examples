# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Exec · exec_provider_breakdown
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: rank, type: int, flags: [hidden] }
  - { name: member, type: string, flags: [title] }
  - { name: mom_state, type: int, flags: [hidden] }
  - { name: mom_pct, type: float, flags: [hidden] }
  - name: mom
    type: string
    lazy: |
      if row.mom_state == 0 { "—" }
      else if row.mom_pct == () { () }
      else {
        let c = (row.mom_pct * 10.0).round().to_int();
        (if row.mom_state == 1 { "▲" } else { "▼" }) + (c / 10) + "." + (c % 10) + "%"
      }
  - { name: total_raw, type: float, flags: [hidden] }
  - name: total_display
    type: string
    lazy: |
      let n = row.total_raw; let v = if n == () { 0.0 } else { n + 0.0 };
      let g = |k| { let s = k.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o };
      let c = (v / 10000.0).round().to_int();
      "$" + g.call(c / 100) + "." + (if c % 100 < 10 { "0" } else { "" }) + (c % 100) + "M"
  - { name: share_pct, type: float }
  - name: share
    type: string
    lazy: |
      if row.share_pct == () { () } else {
        let c = (row.share_pct * 10.0).round().to_int();
        (c / 10) + "." + (c % 10) + "%"
      }
postgres:
  # Reference: BreakdownList beside the provider trajectory — MoM compares
  # the scope's last two months; rising spend is bad (▲ paints red).
  # Rows sort by slot rank so colours line up with the chart.
  # language=rhai
  rhai: |
    let m = "(SELECT month_key AS mk, provider_group AS mem, sum(spend_usd) AS v FROM mart_spend_agg GROUP BY 1, 2)";
    let cur_mk = "(CASE WHEN GROUPING(month_key) = 1 THEN (SELECT max(mk) FROM " + m + " lm) ELSE month_key END)";
    let prev = "(SELECT v FROM " + m + " t WHERE t.mem = provider_group AND t.mk < " + cur_mk + " ORDER BY t.mk DESC LIMIT 1)";
    let cur = "(SELECT v FROM " + m + " t WHERE t.mem = provider_group AND t.mk = " + cur_mk + ")";
    sql::select().from("mart_spend_agg")
            // TODO(no-expr): string concat (||) and a string literal in coalesce have no sql:: builder
            .expression(sql::expr("(provider_group) || ':' || coalesce(month_key, {})", ["Year to date"]).alias("rid"))
            // TODO(no-expr): a string literal in coalesce has no sql:: builder
            .expression(sql::expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            // TODO(no-expr): CASE with literal results has no sql:: builder
            .expression(sql::expr("CASE WHEN provider_group = 'Anthropic' THEN 1 WHEN provider_group = 'OpenAI' THEN 2 WHEN provider_group = 'GitHub' THEN 3 WHEN provider_group = 'Other' THEN 4 WHEN provider_group = 'Amazon' THEN 5 WHEN provider_group = 'Meta' THEN 6 ELSE 99 END").alias("rank"))
            .expression(sql::ident("provider_group").alias("member"))
            // TODO(no-expr): GROUPING() and scalar subqueries have no sql:: builder
            .expression(sql::expr("CASE WHEN " + prev + " IS NULL OR " + prev + " = 0 THEN 0 WHEN " + cur + " >= " + prev + " THEN 1 ELSE 2 END").alias("mom_state"))
            // TODO(no-expr): GROUPING() and scalar subqueries have no sql:: builder
            .expression(sql::cast(sql::expr("CASE WHEN " + prev + " IS NULL OR " + prev + " = 0 THEN NULL ELSE round(100.0 * abs(" + cur + " - " + prev + ") / " + prev + ", 1) END"), "double precision").alias("mom_pct"))
            .expression(sql::cast(sql::sum(sql::ident("spend_usd")), "double precision").alias("total_raw"))
            // TODO(no-expr): GROUPING() and scalar subqueries have no sql:: builder
            .expression(sql::cast(sql::expr("round(100.0 * sum(spend_usd) / nullif(CASE WHEN GROUPING(month_key) = 1 THEN (SELECT sum(v) FROM " + m + " t) ELSE (SELECT sum(v) FROM " + m + " t WHERE t.mk = month_key) END, 0), 1)"), "double precision").alias("share_pct"))
            .group_by(sql::ident("provider_group"))
            // TODO(no-expr): ROLLUP has no sql:: builder
            .group_by(sql::expr("ROLLUP(month_key)"))
            // TODO(no-expr): CASE with literal results has no sql:: builder
            .order_by(sql::expr("CASE WHEN provider_group = 'Anthropic' THEN 1 WHEN provider_group = 'OpenAI' THEN 2 WHEN provider_group = 'GitHub' THEN 3 WHEN provider_group = 'Other' THEN 4 WHEN provider_group = 'Amazon' THEN 5 WHEN provider_group = 'Meta' THEN 6 ELSE 99 END"), "asc")
