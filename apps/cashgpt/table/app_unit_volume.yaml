# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Apps · unit volume
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string }
  - { name: consumer_lob_name, type: string }
  - { name: users, type: float, flags: [hidden], optional: true }
  - { name: tokens, type: float, flags: [hidden], optional: true }
  - { name: spend, type: float, flags: [hidden], optional: true }
  - name: users_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      fn grp(i) { let s = i.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o }
      if row.users == () { () } else { grp(num(row.users).round().to_int()) }
  - name: tokens_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      fn grp(i) { let s = i.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o }
      if row.tokens == () { () } else { grp((num(row.tokens) / 1000000.0).round().to_int()) + "M" }
  - name: spend_display
    type: string
    lazy: |
      fn num(v) { if type_of(v) == "string" { parse_float(v) } else { v + 0.0 } }
      fn grp(i) { let s = i.to_string(); let o = ""; while s.len() > 3 { o = "," + s.sub_string(s.len() - 3, 3) + o; s = s.sub_string(0, s.len() - 3); } s + o }
      fn f2(x) { let c = (x * 100.0).round().to_int(); let f = c % 100; grp(c / 100) + "." + (if f < 10 { "0" } else { "" }) + f }
      fn usd(x) { if x >= 1000000.0 { "$" + f2(x / 1000000.0) + "M" } else if x >= 1000.0 { "$" + (x / 1000.0).round().to_int() + "K" } else { "$" + grp(x.round().to_int()) } }
      if row.spend == () { () } else { usd(num(row.spend)) }
postgres:
  # Reference: apps.unitVolume — month by month, by consuming line of
  # business; tokens quoted in millions like the client renders them.
  # language=rhai
  rhai: |
    let app = if "app" in args { args.app } else { "" };
    let mo = if "month" in args { args.month } else { "" };
    let q = sql::select().from("mart_app_month")
        .where(sql::ident("app_id") == app);
    if mo != "" { q = q.where(sql::ident("month_key") == mo); }
    // TODO(no-expr): string concat for the row id
    q.expression(sql::expr("month_key || ':' || consumer_lob_id").alias("rid"))
        .field("month_key")
        .field("consumer_lob_name")
        .expression(sql::sum(sql::ident("users")).alias("users"))
        .expression(sql::sum(sql::ident("tokens")).alias("tokens"))
        .expression(sql::sum(sql::ident("spend_usd")).alias("spend"))
        .group_by(sql::ident("month_key"))
        .group_by(sql::ident("consumer_lob_id"))
        .group_by(sql::ident("consumer_lob_name"))
        .order_by(sql::ident("month_key"), "asc")
        .order_by(sql::sum(sql::ident("spend_usd")), "desc")
