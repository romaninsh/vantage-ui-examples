# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Exec · exec_code_ai
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: member, type: string, flags: [title] }
  - { name: total_display, type: string }
  - { name: bar_pct, type: float }
postgres:
  # Reference: suiteByLob filtered to kind IN ('coding','agent'), summed
  # per LOB, sorted by value desc — the Code AI half-panel.
  rhai: |
    select().from("mart_spend_agg")
            .expression(expr("(lob_id) || ':' || coalesce(month_key, {})", ["Year to date"]).alias("rid"))
            .expression(expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            .where(expr("kind IN ('coding', 'agent')"))
            .expression(expr("max(lob_name)").alias("member"))
            .expression(expr("CASE WHEN (sum(spend_usd)) >= 1e6 THEN '$' || to_char((sum(spend_usd)) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd)) >= 1e3 THEN '$' || to_char(round((sum(spend_usd)) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd)), 0)), 'FM999,999') END").alias("total_display"))
            .expression(expr("round(100.0 * sum(spend_usd) / nullif(CASE WHEN GROUPING(month_key) = 1 THEN (SELECT max(s) FROM (SELECT sum(spend_usd) AS s FROM mart_spend_agg WHERE kind IN ('coding','agent') GROUP BY lob_id) x) ELSE (SELECT max(s) FROM (SELECT t.month_key AS mk, t.lob_id, sum(t.spend_usd) AS s FROM mart_spend_agg t WHERE t.kind IN ('coding','agent') GROUP BY 1, 2) x WHERE x.mk = mart_spend_agg.month_key) END, 0), 1)").alias("bar_pct"))
            .group_by(expr("lob_id"))
            .group_by(expr("ROLLUP(month_key)"))
            .order_by(expr("sum(spend_usd)"), "desc")
