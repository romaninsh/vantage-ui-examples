# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Executive islands
id_column: month_key
columns:
  - { name: month_key, type: string, flags: [id] }
  - { name: latest_display, type: string, optional: true }
  - { name: latest_change, type: string, optional: true }
  - { name: latest_text, type: string, optional: true }
  - { name: period_display, type: string, optional: true }
  - { name: period_note, type: string, optional: true }
  - { name: tier_display, type: string, optional: true }
  - { name: tier_note, type: string, optional: true }
  - { name: people_display, type: string, optional: true }
  - { name: people_change, type: string, optional: true }
  - { name: people_text, type: string, optional: true }
  - { name: tokens_display, type: string, optional: true }
  - { name: tokens_note, type: string, optional: true }
  - { name: spend_spark, type: string, optional: true }
  - { name: tier_spark, type: string, optional: true }
  - { name: people_spark, type: string, optional: true }
  - { name: tokens_spark, type: string, optional: true }
postgres:
  # Reference: exec.islands + ExecutiveBriefPage KPIS — five tiles from one
  # row per scope. Latest/prev month figures switch on GROUPING(); sparks
  # are the full monthly series. All formatting is here; stats render.
  rhai: |
    select().from("mart_spend_agg")
            .expression(expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            .expression(expr("'$' || to_char((SELECT v FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk = (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)) / 1e6, 'FM999,990.00') || 'M'").alias("latest_display"))
            .expression(expr("CASE WHEN (SELECT v FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk = ((SELECT max(t.mk) FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk < (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)))) IS NULL OR (SELECT v FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk = ((SELECT max(t.mk) FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk < (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)))) = 0 THEN NULL ELSE (CASE WHEN (SELECT v FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk = (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)) >= (SELECT v FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk = ((SELECT max(t.mk) FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk < (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)))) THEN '+' ELSE '' END) || to_char(round(100.0 * ((SELECT v FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk = (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)) - (SELECT v FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk = ((SELECT max(t.mk) FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk < (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END))))) / (SELECT v FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk = ((SELECT max(t.mk) FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk < (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)))), 1), 'FM990.0') || '%' END").alias("latest_change"))
            .expression(expr("'vs previous month'").alias("latest_text"))
            .expression(expr("'$' || to_char(sum(spend_usd) / 1e6, 'FM999,990.00') || 'M'").alias("period_display"))
            .expression(expr("to_char(CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT count(DISTINCT month_key) FROM mart_spend_agg) ELSE 1 END, 'FM9') || CASE WHEN CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT count(DISTINCT month_key) FROM mart_spend_agg) ELSE 1 END = 1 THEN ' month · $' ELSE ' months · $' END || to_char(sum(spend_usd) / (SELECT count(DISTINCT lob_id) FROM mart_spend_agg) / 1e6, 'FM999,990.00') || 'M per line of business'").alias("period_note"))
            .expression(expr("to_char(round(100.0 * sum(spend_usd) FILTER (WHERE model_tier = 'top') / nullif(sum(spend_usd), 0), 1), 'FM990.0') || '%'").alias("tier_display"))
            .expression(expr("'of spend on frontier models, cost-weighted'").alias("tier_note"))
            .expression(expr("to_char((SELECT u FROM (SELECT month_key AS mk, sum(users) AS u FROM mart_active_month GROUP BY 1) t WHERE t.mk = (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)), 'FM999,999,999')").alias("people_display"))
            .expression(expr("CASE WHEN (SELECT u FROM (SELECT month_key AS mk, sum(users) AS u FROM mart_active_month GROUP BY 1) t WHERE t.mk = ((SELECT max(t.mk) FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk < (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)))) IS NULL OR (SELECT u FROM (SELECT month_key AS mk, sum(users) AS u FROM mart_active_month GROUP BY 1) t WHERE t.mk = ((SELECT max(t.mk) FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk < (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)))) = 0 THEN NULL ELSE (CASE WHEN (SELECT u FROM (SELECT month_key AS mk, sum(users) AS u FROM mart_active_month GROUP BY 1) t WHERE t.mk = (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)) >= (SELECT u FROM (SELECT month_key AS mk, sum(users) AS u FROM mart_active_month GROUP BY 1) t WHERE t.mk = ((SELECT max(t.mk) FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk < (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)))) THEN '+' ELSE '' END) || to_char(round(100.0 * ((SELECT u FROM (SELECT month_key AS mk, sum(users) AS u FROM mart_active_month GROUP BY 1) t WHERE t.mk = (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)) - (SELECT u FROM (SELECT month_key AS mk, sum(users) AS u FROM mart_active_month GROUP BY 1) t WHERE t.mk = ((SELECT max(t.mk) FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk < (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END))))) / (SELECT u FROM (SELECT month_key AS mk, sum(users) AS u FROM mart_active_month GROUP BY 1) t WHERE t.mk = ((SELECT max(t.mk) FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t WHERE t.mk < (CASE WHEN GROUPING(mart_spend_agg.month_key) = 1 THEN (SELECT max(mk) FROM (SELECT month_key AS mk FROM mart_spend_agg GROUP BY 1) lm) ELSE mart_spend_agg.month_key END)))), 1), 'FM990.0') || '%' END").alias("people_change"))
            .expression(expr("'vs previous month'").alias("people_text"))
            .expression(expr("to_char(sum(tokens) / 1e12, 'FM990.00') || 'T'").alias("tokens_display"))
            .expression(expr("'$' || to_char(round(sum(spend_usd) / nullif(sum(tokens) / 1e6, 0), 2), 'FM990.00') || ' per million tokens, blended'").alias("tokens_note"))
            .expression(expr("(SELECT string_agg(s::text, ',' ORDER BY mk) FROM (SELECT mk, round(t.v) AS s FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t) x)").alias("spend_spark"))
            .expression(expr("(SELECT string_agg(s::text, ',' ORDER BY mk) FROM (SELECT mk, round(100.0 * t.tt / nullif(t.v, 0), 1) AS s FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t) x)").alias("tier_spark"))
            .expression(expr("(SELECT string_agg(t.u::text, ',' ORDER BY t.mk) FROM (SELECT month_key AS mk, sum(users) AS u FROM mart_active_month GROUP BY 1) t)").alias("people_spark"))
            .expression(expr("(SELECT string_agg(s::text, ',' ORDER BY mk) FROM (SELECT mk, round(t.tk / 1e9) AS s FROM (SELECT month_key AS mk, sum(spend_usd) AS v, sum(tokens) AS tk, sum(spend_usd) FILTER (WHERE model_tier = 'top') AS tt FROM mart_spend_agg GROUP BY 1) t) x)").alias("tokens_spark"))
            .group_by(expr("ROLLUP(month_key)"))
