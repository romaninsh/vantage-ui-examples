# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Org explorer · LOBs
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: org_name, type: string, flags: [title] }
  - { name: headcount, type: int }
  - { name: active, type: int }
  - { name: spend_display, type: string }
  - { name: per_active_display, type: string }
  - { name: top_tier_display, type: string }
postgres:
  # Reference: overview.orgExplorer, flattened to the LOB level (org_level 2)
  # until the tree grid lands (VAN-209). Active never sums across months —
  # the All row takes the PEAK month, like the mart comments demand.
  rhai: |
    let lob = if "lob" in args { args.lob } else { "" };
    let rorg = if "rorg" in args { args.rorg } else { "" };
    let g = "({} = '' OR lob_id = {}) AND ({} = '' OR resource_org = {})";
    let ga = [lob, lob, rorg, rorg];
    select().from("mart_org_month")
        .where(expr(g, ga))
        .where(ident("org_level") == 2)
        .expression(expr("org_id || ':' || coalesce(month_key, {})", ["All months"]).alias("rid"))
        .expression(expr("coalesce(month_key, {})", ["All months"]).alias("month_key"))
        .expression(expr("max(org_name)").alias("org_name"))
        .expression(expr("max(headcount)").alias("headcount"))
        .expression(expr("max(active)").alias("active"))
        .expression(expr("'$' || to_char(sum(spend_usd) / 1e6, 'FM999,990.00') || 'M'").alias("spend_display"))
        .expression(expr("'$' || to_char(round(sum(spend_usd) / nullif(max(active), 0), 2), 'FM999,990.00')").alias("per_active_display"))
        .expression(expr("to_char(round(sum(spend_usd * top_tier_share) / nullif(sum(spend_usd), 0) * 100, 0), 'FM990') || '%'").alias("top_tier_display"))
        .group_by(expr("org_id"))
        .group_by(expr("ROLLUP(month_key)"))
        .order_by(expr("sum(spend_usd)"), "desc")
