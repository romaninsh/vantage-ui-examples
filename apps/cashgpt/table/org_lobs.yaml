# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Org explorer · LOBs
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: org_name, type: string, flags: [title] }
  - { name: headcount, type: int }
  - { name: active, type: int }
  - { name: spend_usd, type: float, flags: [hidden] }
  - { name: tier_spend, type: float, flags: [hidden] }
  - name: spend_display
    type: string
    lazy: |
      if row.spend_usd == () { () } else {
        let c = (row.spend_usd / 1e6 * 100.0).round().to_int();
        let s = (c / 100).to_string();
        let t = "";
        while s.len() > 3 { t = "," + s.sub_string(s.len() - 3) + t; s = s.sub_string(0, s.len() - 3); }
        let f = c % 100;
        "$" + s + t + "." + (if f < 10 { "0" } else { "" }) + f + "M"
      }
  - name: per_active_display
    type: string
    lazy: |
      if row.spend_usd == () || row.active == () || row.active == 0 { () } else {
        let c = (row.spend_usd / row.active * 100.0).round().to_int();
        let s = (c / 100).to_string();
        let t = "";
        while s.len() > 3 { t = "," + s.sub_string(s.len() - 3) + t; s = s.sub_string(0, s.len() - 3); }
        let f = c % 100;
        "$" + s + t + "." + (if f < 10 { "0" } else { "" }) + f
      }
  - name: top_tier_display
    type: string
    lazy: |
      if row.spend_usd == () || row.tier_spend == () || row.spend_usd == 0 { () } else {
        (row.tier_spend / row.spend_usd * 100.0).round().to_int().to_string() + "%"
      }
postgres:
  # Reference: overview.orgExplorer, flattened to the LOB level (org_level 2)
  # until the tree grid lands (VAN-209). Active never sums across months —
  # the All row takes the PEAK month, like the mart comments demand.
  # The money and percent strings are lazy columns over spend_usd / tier_spend.
  # language=rhai
  rhai: |
    let lob = if "lob" in args { args.lob } else { "" };
    let rorg = if "rorg" in args { args.rorg } else { "" };
    let q = sql::select().from("mart_org_month");
    if lob != "" { q = q.where(sql::ident("lob_id") == lob); }
    if rorg != "" { q = q.where(sql::ident("resource_org") == rorg); }
    q.where(sql::ident("org_level") == 2)
        // TODO(no-expr): string concat (||) and a literal in coalesce(x, '') have no sql:: builder
        .expression(sql::expr("org_id || ':' || coalesce(month_key, {})", ["All months"]).alias("rid"))
        // TODO(no-expr): literal argument to coalesce (sql::coalesce takes expressions or identifiers only)
        .expression(sql::expr("coalesce(month_key, {})", ["All months"]).alias("month_key"))
        .expression(sql::max(sql::ident("org_name")).alias("org_name"))
        .expression(sql::max(sql::ident("headcount")).alias("headcount"))
        .expression(sql::max(sql::ident("active")).alias("active"))
        .expression(sql::cast(sql::sum(sql::ident("spend_usd")), "double precision").alias("spend_usd"))
        .expression(sql::cast(sql::sum(sql::mul(sql::ident("spend_usd"), sql::ident("top_tier_share"))), "double precision").alias("tier_spend"))
        .group_by(sql::ident("org_id"))
        .group_by(sql::fx("ROLLUP", [sql::ident("month_key")]))
        .order_by(sql::sum(sql::ident("spend_usd")), "desc")
