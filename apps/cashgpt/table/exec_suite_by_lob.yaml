# yaml-language-server: $schema=./table-schema-1.json
datasource: warehouse
title: Exec · exec_suite_by_lob
id_column: rid
columns:
  - { name: rid, type: string, flags: [id, hidden] }
  - { name: month_key, type: string, flags: [hidden] }
  - { name: lob_name, type: string, flags: [title] }
  - { name: "Coding", type: string }
  - { name: "Domain", type: string }
  - { name: "Agent", type: string }
  - { name: "Assistant", type: string }
  - { name: "Analysis", type: string }
  - { name: "Research", type: string }
  - { name: Total, type: string }
postgres:
  # Reference: exec.suiteByLob — LOB × suite spend matrix; suite columns
  # pinned to overall-spend order (the reference let first-appearance
  # order pick colours, an accident its parity doc regrets).
  # language=rhai
  rhai: |
    select().from("mart_spend_agg")
            .expression(expr("(lob_id) || ':' || coalesce(month_key, {})", ["Year to date"]).alias("rid"))
            .expression(expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            .expression(expr("max(lob_name)").alias("lob_name"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE initcap(kind) = 'Coding')) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Coding')) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE initcap(kind) = 'Coding')) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Coding')) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Coding')), 0)), 'FM999,999') END").alias("Coding"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE initcap(kind) = 'Domain')) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Domain')) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE initcap(kind) = 'Domain')) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Domain')) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Domain')), 0)), 'FM999,999') END").alias("Domain"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE initcap(kind) = 'Agent')) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Agent')) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE initcap(kind) = 'Agent')) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Agent')) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Agent')), 0)), 'FM999,999') END").alias("Agent"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE initcap(kind) = 'Assistant')) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Assistant')) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE initcap(kind) = 'Assistant')) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Assistant')) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Assistant')), 0)), 'FM999,999') END").alias("Assistant"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE initcap(kind) = 'Analysis')) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Analysis')) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE initcap(kind) = 'Analysis')) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Analysis')) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Analysis')), 0)), 'FM999,999') END").alias("Analysis"))
            .expression(expr("CASE WHEN (sum(spend_usd) FILTER (WHERE initcap(kind) = 'Research')) >= 1e6 THEN '$' || to_char((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Research')) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd) FILTER (WHERE initcap(kind) = 'Research')) >= 1e3 THEN '$' || to_char(round((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Research')) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd) FILTER (WHERE initcap(kind) = 'Research')), 0)), 'FM999,999') END").alias("Research"))
            .expression(expr("CASE WHEN (sum(spend_usd)) >= 1e6 THEN '$' || to_char((sum(spend_usd)) / 1e6, 'FM999,990.00') || 'M' WHEN (sum(spend_usd)) >= 1e3 THEN '$' || to_char(round((sum(spend_usd)) / 1e3), 'FM999,999') || 'K' ELSE '$' || to_char(round(coalesce((sum(spend_usd)), 0)), 'FM999,999') END").alias("Total"))
            .group_by(expr("lob_id"))
            .group_by(expr("ROLLUP(month_key)"))
            .order_by(expr("sum(spend_usd)"), "desc")
