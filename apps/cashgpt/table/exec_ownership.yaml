postgres:
  # Reference: costOwnershipSql (defined but never registered — the panel
  # renders empty in the reference; this is its documented intent). Band
  # derives from the CONSUMER's LOB; suites pivot to columns.
  # language=rhai
  rhai: |
    sql::select().from("mart_spend_agg")
            // TODO(no-expr): string concat (||), a string literal in coalesce, and CASE with literal results have no sql:: builder
            .expression(sql::expr("(CASE WHEN lob_id IN ('LB-07','LB-08','LB-09') THEN 'Technology' WHEN lob_id IN ('LB-11','LB-12','LB-13') THEN 'Corporate functions' ELSE 'Business lines' END) || ':' || coalesce(month_key, {})", ["Year to date"]).alias("rid"))
            // TODO(no-expr): a string literal in coalesce has no sql:: builder
            .expression(sql::expr("coalesce(month_key, {})", ["Year to date"]).alias("month_key"))
            // TODO(no-expr): CASE with literal results and IN (list) have no sql:: builder
            .expression(sql::expr("CASE WHEN lob_id IN ('LB-07','LB-08','LB-09') THEN 'Technology' WHEN lob_id IN ('LB-11','LB-12','LB-13') THEN 'Corporate functions' ELSE 'Business lines' END").alias("band"))
            // TODO(no-expr): aggregate FILTER (WHERE ..) has no sql:: builder
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE initcap(kind) = {})", ["Coding"]), "double precision").alias("coding_raw"))
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE initcap(kind) = {})", ["Domain"]), "double precision").alias("domain_raw"))
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE initcap(kind) = {})", ["Agent"]), "double precision").alias("agent_raw"))
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE initcap(kind) = {})", ["Assistant"]), "double precision").alias("assistant_raw"))
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE initcap(kind) = {})", ["Analysis"]), "double precision").alias("analysis_raw"))
            .expression(sql::cast(sql::expr("sum(spend_usd) FILTER (WHERE initcap(kind) = {})", ["Research"]), "double precision").alias("research_raw"))
            .expression(sql::cast(sql::sum(sql::ident("spend_usd")), "double precision").alias("total_raw"))
            // TODO(no-expr): CASE with literal results and IN (list) have no sql:: builder
            .group_by(sql::expr("CASE WHEN lob_id IN ('LB-07','LB-08','LB-09') THEN 'Technology' WHEN lob_id IN ('LB-11','LB-12','LB-13') THEN 'Corporate functions' ELSE 'Business lines' END"))
            // TODO(no-expr): ROLLUP has no sql:: builder
            .group_by(sql::expr("ROLLUP(month_key)"))
            .order_by(sql::sum(sql::ident("spend_usd")), "desc")
