# yaml-language-server: $schema=../table-schema-1.json

name: order_totals
datasource: bakery-surreal

columns:
  id: { type: string, flags: [id, title] }
  created_at: { type: datetime }
  # Who and (roughly) what: the account's name and the order's first
  # line's product — enough for a ticker row without unfolding lines.
  client: { type: string }
  product: { type: string }
  # Pence, so the sort is exact. `total_display` is what a tile shows.
  total: { type: int }
  # Integer pounds and pence, not a float: casting a float to string
  # in SurrealDB yields "357.9f" — the suffix and the lost trailing
  # zero are both wrong on a price.
  total_display:
    type: string
    lazy: |
      let total = row.total.to_int();
      let pence = total % 100;
      "£" + (total / 100) + "." + (if pence < 10 { "0" } else { "" }) + pence
  # Branch name, filled only on the unfiltered read (see client_balances).
  branch: { type: string }

surreal:
  # One SELECT folds each order's lines into a pence total and reads the
  # client/product names while it still has the row; `total_display` is
  # built from `total` after the read. Sorted latest-first: the app runs
  # in real time, so this tile is a ticker of what just happened.
  # language=rhai
  rhai: |
    let b = args.get("bakery") ?? "";
    let q = surreal::select()
        .field("id").field("created_at")
        .expression(surreal::ident("client")["name"].alias("client"))
        .expression(surreal::first(surreal::ident("lines"))["product"]["name"].alias("product"))
        .expression(surreal::ident("lines").fold(0, |acc, l| acc + l["quantity"] * l["price"]).alias("total"))
        .from("order");
    if b == "" {
        q = q.expression(surreal::ident("bakery")["name"].alias("branch"));
    } else {
        q = q
            .expression(surreal::cast("", "string").alias("branch"))
            .where(surreal::ident("bakery")["name"] == b);
    }
    q.order_by(surreal::ident("created_at"), "desc")
