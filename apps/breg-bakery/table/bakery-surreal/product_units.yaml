# yaml-language-server: $schema=../table-schema-1.json

name: product_units
datasource: bakery-surreal

id_column: product
columns:
  product: { type: string, flags: [id, title] }
  # Two stacked layers per product: what's on the shelf and what has
  # sold — the dashboard's stacked bar reads both.
  stock: { type: int }
  sales: { type: int }

surreal:
  # Per product: current shelf stock plus total units sold. Grouped by
  # NAME so the "All bakeries" view aggregates the chain; a bakery
  # filter narrows both sides. The sold sum SPLITs order lines first:
  # inside an array filter (`lines[WHERE …]`) `$parent` is the order,
  # not the product row, so correlating there always misses — the
  # subquery WHERE is the level where `$parent` is the product.
  # language=rhai
  rhai: |
    let b = args.get("bakery") ?? "";
    let orders = surreal::select()
        .field("lines")
        .from("order")
        .where(surreal::ident("status") != "cancelled")
        .split("lines");
    if b != "" {
        orders = orders.where(surreal::ident("bakery")["name"] == b);
    }
    // math::sum of no rows is 0, so a product nobody bought still sums.
    let sold = surreal::sum(
        surreal::select().value().expression(surreal::ident("lines")["quantity"])
            .from(orders.subquery())
            .where(surreal::ident("lines")["product"] == surreal::parent("id"))
            .subquery());
    let per_product = surreal::select()
        .from("product")
        .expression(surreal::ident("name").alias("product"))
        .expression(surreal::coalesce(surreal::ident("inventory")["stock"], 0).alias("stock1"))
        .expression(sold.alias("sold1"));
    if b != "" {
        per_product = per_product.where(surreal::ident("bakery")["name"] == b);
    }
    surreal::select()
        .from(per_product.subquery())
        .field("product")
        .expression(surreal::sum(surreal::ident("stock1")).alias("stock"))
        .expression(surreal::sum(surreal::ident("sold1")).alias("sales"))
        .group_by(surreal::ident("product"))
        .order_by(surreal::ident("sales"), "desc")
        // Five bars is what fits before the x labels start colliding.
        .limit(5, 0)
