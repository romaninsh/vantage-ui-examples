# yaml-language-server: $schema=../table-schema-1.json
#
# What each account owes: the unsettled part of its issued invoices. This
# replaces the stored `client.balance`, which nothing kept up to date and
# which was therefore wrong between a payment landing and someone noticing.

name: client_balances
datasource: bakery-surreal

columns:
  id: { type: string, flags: [id] }
  name: { type: string, flags: [title, searchable] }
  bakery: { type: string, references: bakery }
  bakery.name: { type: string }
  owed: { type: int, unit: { currency: "£", minor_units: true } }
  overdue: { type: int, unit: { currency: "£", minor_units: true } }
  # A grid renders `owed` as money from its `unit`. A list label is a string,
  # so it needs one built here, from the row, after the read.
  owed_display:
    type: string
    lazy: |
      let owed = row.owed.to_int();
      let pence = owed % 100;
      "£" + (owed / 100) + "." + (if pence < 10 { "0" } else { "" }) + pence
  # The branch the account belongs to — filled only on the unfiltered
  # ("All bakeries") read, so the dashboard's `sub:` line appears exactly
  # when the row's branch isn't already implied by the filter.
  branch: { type: string }

surreal:
  # language=rhai
  rhai: |
    let b = args.get("bakery") ?? "";
    // What one invoice still owes: its total less the payments against it.
    let paid = surreal::sum(
        surreal::select().value().expression(surreal::ident("amount")).from("payment")
            .where(surreal::ident("invoice") == surreal::parent("id"))
            .subquery());
    let owed = surreal::sum(
        surreal::select().value().expression(surreal::ident("owed"))
            .from(surreal::select()
                .expression(surreal::sub(surreal::ident("total"), paid).alias("owed"))
                .from("invoice")
                .where(surreal::ident("client") == surreal::parent("id"))
                .where(surreal::ident("status") == "issued")
                .subquery())
            .where(surreal::ident("owed") > 0)
            .subquery());
    let overdue = surreal::sum(
        surreal::select().value().expression(surreal::ident("owed"))
            .from(surreal::select()
                .expression(surreal::sub(surreal::ident("total"), paid).alias("owed"))
                .from("invoice")
                .where(surreal::ident("client") == surreal::parent("id"))
                .where(surreal::ident("status") == "issued")
                .where(surreal::ident("due_at") < surreal::time_now())
                .subquery())
            .where(surreal::ident("owed") > 0)
            .subquery());
    let per_client = surreal::select()
        .field("id").field("name").field("bakery")
        .expression(owed.alias("owed"))
        .expression(overdue.alias("overdue"))
        .from("client");
    if b == "" {
        per_client = per_client.expression(surreal::ident("bakery")["name"].alias("branch"));
    } else {
        per_client = per_client
            .expression(surreal::cast("", "string").alias("branch"))
            .where(surreal::ident("bakery")["name"] == b);
    }
    surreal::select()
        .from(per_client.subquery())
        .field("id").field("name").field("bakery").field("branch").field("owed").field("overdue")
        .where(surreal::ident("owed") > 0)
        .order_by(surreal::ident("owed"), "desc")
