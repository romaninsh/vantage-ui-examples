# yaml-language-server: $schema=../table-schema-1.json

name: low_stock_products
datasource: bakery-surreal

columns:
  id: { type: string, flags: [id] }
  name: { type: string, flags: [title] }
  stock: { type: int }
  # Branch name, filled only on the unfiltered read (see client_balances).
  branch: { type: string }

surreal:
  # language=rhai
  rhai: |
    let b = args.get("bakery") ?? "";
    let q = surreal::select().from("product")
        .field("id").field("name")
        .expression(surreal::ident("inventory")["stock"].alias("stock"))
        .where(surreal::ident("inventory")["stock"] < 10)
        // `!= true`, not `== false`: a product added through the form
        // or the CSV import has no `is_deleted` field at all, and a
        // missing field must still count as not-deleted.
        .where(surreal::ident("is_deleted") != true);
    if b == "" {
        q = q.expression(surreal::ident("bakery")["name"].alias("branch"));
    } else {
        q = q
            .expression(surreal::cast("", "string").alias("branch"))
            .where(surreal::ident("bakery")["name"] == b);
    }
    q.order_by(surreal::ident("inventory")["stock"], "asc")
