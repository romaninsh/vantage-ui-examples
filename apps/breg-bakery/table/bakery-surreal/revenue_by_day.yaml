# yaml-language-server: $schema=../table-schema-1.json

name: revenue_by_day
datasource: bakery-surreal

columns:
  id: { type: string, flags: [id] }
  day: { type: string, flags: [title] }
  revenue: { type: float }

surreal:
  # Revenue per 30 SECONDS over the last 10 minutes — this app runs in
  # real time, so the chart is a live ticker. Buckets are GENERATED
  # (array::range over a minute-anchored start), not derived from the
  # orders that exist: a bucket with no sales is a real row at zero,
  # so a quiet stretch draws empty bands instead of a gap. Each bucket
  # sums the orders that landed inside its own 30 seconds via a
  # correlated subquery — raw sums, no smoothing: the dashboard draws
  # this as BARS, where a discrete little sum per band is the point.
  # `day` keeps its name (the chart x binding) but carries HH:MM:SS;
  # the chart's `x_label` script collapses it to minutes.
  # A query-sourced table's id MUST be a real record id (the vista
  # calls Thing::from_cbor on it) — type::record over the bucket.
  # language=rhai
  rhai: |
    let b = args.get("bakery") ?? "";
    // The bakery filter is added only when a bakery is picked, so the
    // hardest query in the app exists once. Prices are pence, so /100
    // for pounds. Divided here, not in the client: the y-axis should
    // read what the database said.
    let orders = surreal::select().value()
        .expression(surreal::ident("lines").fold(0, |acc, l| acc + l["quantity"] * l["price"]))
        .from("order")
        .where(surreal::ident("status") != "cancelled")
        .where(surreal::ident("created_at") >= surreal::parent("bucket"))
        // TODO(no-expr): duration literal (`30s`) has no builder
        .where(surreal::ident("created_at") < surreal::parent("bucket") + surreal::expr("30s"));
    if b != "" {
        orders = orders.where(surreal::ident("bakery")["name"] == b);
    }
    let revenue = surreal::round(surreal::cast(surreal::sum(orders.subquery()), "float") / 100, 2);
    // Sorted by the raw datetime, not the HH:MM:SS label — a window
    // that spans midnight would put 00:xx before 23:xx otherwise. The
    // bars keep query order, so this ORDER BY is the timeline.
    surreal::select()
        .from(
            surreal::select()
                .field("bucket")
                .expression(surreal::date_format(surreal::ident("bucket"), "%H:%M:%S").alias("day"))
                .expression(revenue.alias("revenue"))
                // TODO(no-expr): array::range(0, 22), duration literals and duration::from_secs take number args, which fx refuses
                .from(surreal::expr("array::range(0, 22).map(|$i| { bucket: time::floor(time::now(), 1m) - 10m + duration::from_secs($i * 30) })"))
                .where(surreal::ident("bucket") <= surreal::time_now())
                .subquery())
        // TODO(no-expr): fx refuses the literal table name 'revenue_by_day' (surreal::thing takes two strings, not a column)
        .expression(surreal::fx("type::record", [surreal::expr("'revenue_by_day'"), surreal::ident("day")]).alias("id"))
        .field("bucket")
        .field("day")
        .field("revenue")
        .order_by(surreal::ident("bucket"), "asc")
