# yaml-language-server: $schema=./action-schema-1.json
#
# Demo action — POSTs to httpbin.org/post (always returns 200 with the
# request echoed back as JSON, no side effects). Swap the url + headers
# to a real mailer endpoint when one is available; the params + body
# shape are already mailer-ready.
kind: http_request
description: |
  Emails the customer a new temporary password. They must change it
  on first login. (Demo: posts to httpbin.org/post which echoes the
  payload back — no real email is sent.)
params:
  email: { type: string, label: Email }
  name: { type: string, label: "Customer name" }
  password: { type: string, label: "New password" }
http:
  method: POST
  url: "https://httpbin.org/post"
  headers:
    Content-Type: "application/json"
  body:
    to: email
    name: name
    password: password
