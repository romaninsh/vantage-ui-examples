# yaml-language-server: $schema=./action-schema-1.json
# The credentials form the setup wizard opens. Returns both values; the
# wizard stores them.
kind: form
dialog:
  title: "Strava API credentials"
  description: "Copy both values from My API Application on strava.com/settings/api."
  confirm_label: Save
form:
  fields:
    - { name: client_id, type: int, label: "Client ID", placeholder: "e.g. 123456" }
    - name: client_secret
      type: string
      label: "Client Secret"
      masked: true
      placeholder: "40 characters"
