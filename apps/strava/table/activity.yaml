# yaml-language-server: $schema=./table-schema-1.json
# All your activities (GET /athlete/activities), newest first. The
# datasource pages them; a grid fetches pages as you scroll.
#
# Strava's own units stay here (metres, seconds, m/s); the pages add
# readable figures through sugar (sugar/activity.yaml).
datasource: strava
title: Activities
table: "athlete/activities"
columns:
  - { name: id, type: int, flags: [id] }
  - { name: name, type: string, flags: [title, searchable] }
  - { name: sport_type, label: Sport, type: string, flags: [label] }
  - { name: start_date_local, label: Started, type: timestamp }

  # Shown as they come.
  - { name: total_elevation_gain, label: "Climb (m)", type: float }
  - { name: average_heartrate, label: "Avg HR", type: float }
  - { name: max_heartrate, label: "Max HR", type: float }
  - { name: suffer_score, label: "Effort", type: float }
  - { name: average_cadence, label: Cadence, type: float }
  - { name: average_watts, label: "Avg W", type: float }
  - { name: weighted_average_watts, label: "Weighted W", type: int }
  - { name: max_watts, label: "Max W", type: int }
  - { name: kilojoules, label: kJ, type: float }
  - { name: average_temp, label: "Temp (°C)", type: float }
  - { name: kudos_count, label: Kudos, type: int }
  - { name: comment_count, label: Comments, type: int }
  - { name: achievement_count, label: Achievements, type: int }
  - { name: pr_count, label: PRs, type: int }
  - { name: total_photo_count, label: Photos, type: int }
  - { name: athlete_count, label: Athletes, type: int }
  - { name: gear_id, label: Gear, type: string }
  - { name: visibility, type: string }

  # Raw figures the pages show through sugar, or not at all.
  - { name: distance, label: "Distance (m)", type: float }
  - { name: moving_time, label: "Moving (s)", type: int }
  - { name: elapsed_time, label: "Elapsed (s)", type: int }
  - { name: average_speed, label: "Avg speed (m/s)", type: float }
  - { name: max_speed, label: "Max speed (m/s)", type: float }
  - { name: elev_high, label: "Highest (m)", type: float }
  - { name: elev_low, label: "Lowest (m)", type: float }
  - { name: type, type: string }
  - { name: workout_type, label: Workout, type: int }
  - { name: start_date, label: "Started (UTC)", type: timestamp }
  - { name: timezone, type: string }
  - { name: utc_offset, label: "UTC offset (s)", type: float }
  - { name: has_heartrate, label: "Has HR", type: bool }
  - { name: heartrate_opt_out, label: "HR hidden", type: bool }
  - { name: device_watts, label: "Power meter", type: bool }
  - { name: photo_count, label: "Strava photos", type: int }
  - { name: trainer, label: Indoor, type: bool }
  - { name: commute, type: bool }
  - { name: manual, type: bool }
  - { name: private, type: bool }
  - { name: flagged, type: bool }
  - { name: has_kudoed, label: "You kudoed", type: bool }
  - { name: from_accepted_tag, label: "Tagged in", type: bool }
  - { name: external_id, label: "Upload file", type: string }
  - { name: upload_id, label: Upload, type: int }
  - { name: athlete.id, label: Athlete, type: int }
  - { name: map.summary_polyline, label: Track, type: string }
