# yaml-language-server: $schema=./table-schema-1.json
# Table: admission — references patient and ward.
datasource: hospital
title: Admissions
faker:
  count: 50
columns:
  - { name: id, type: string, flags: [id, hidden] }
  - { name: case_number, label: Case, type: string, flags: [title, searchable], faker: { pattern: "ADM-#####" } }
  - { name: patient, type: string, references: patient }
  - { name: ward, type: string, references: ward }
  - { name: admitted, type: timestamp, faker: { date: { from: "-30d" } } }
  - { name: status, type: string, faker: { pick: { values: [Admitted, Observation, Discharged], weights: [4, 2, 3] } } }
  - { name: diagnosis, type: string, faker: { sentence: { min_words: 3, max_words: 7 } } }
