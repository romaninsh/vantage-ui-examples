# yaml-language-server: $schema=./table-schema-1.json
# Table: er_arrival — the `builtin:fifo` stream of the ER front desk.
datasource: er_board
title: ER arrivals
faker: { count: 0 }
columns:
  - { name: id, type: string, flags: [id, hidden] }
  - { name: first_name, label: First name, type: string, flags: [title, searchable] }
  - { name: last_name, label: Last name, type: string, flags: [searchable] }
  - { name: complaint, type: string, faker: { sentence: { min_words: 2, max_words: 5 } } }
  - { name: triage, type: string, faker: { pick: { values: [Critical, Urgent, Standard, "Non-urgent"], weights: [1, 3, 5, 3] } } }
