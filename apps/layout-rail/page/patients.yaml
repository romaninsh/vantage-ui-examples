# yaml-language-server: $schema=./page-schema-1.json
# Page: patients — every patient, or those with one `status` (the menu link
# passes `args.status`; empty means all). "All patients" also shows who is
# waiting in ER on top — the people the Patients badge counts. Click a
# patient: their record opens in a sheet on the right, over the list.
title: "${args.label}"
body:
  - kind: label
    when: 'args.status == ""'
    params: { text: "Waiting in ER — counted by the badge on Patients", style: muted, icon: Ambulance }
  - kind: grid
    name: er
    when: 'args.status == ""'
    observe: { script: 'scenery("er_arrival").sort("id", "asc")' }
    height: 150
    params:
      selectable: false
      row_menu: false
      row_color: { column: triage, color: { danger: [Critical], warning: [Urgent] } }
      columns:
        triage: { label: Triage }
        first_name: { label: First name }
        last_name: { label: Last name }
        complaint: { label: Complaint, width: 280 }
  - kind: grid
    name: patients
    observe: { script: 'if args.status == "" { scenery("patient") } else { scenery("patient").where("status", args.status) }' }
    params:
      search: true
      on_select: 'open_in("sheet", "patient", #{ id: patients.selected_id })'
      columns:
        first_name: { label: First name, pin: true }
        last_name: { label: Last name }
        date_of_birth: { label: Date of birth }
        blood_type: { label: Blood type }
        status: { label: Status, color: { blue: [Inpatient], muted: [Discharged] } }
