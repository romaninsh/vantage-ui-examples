# yaml-language-server: $schema=./action-schema-1.json
# Identity menu: an admin sets someone's password. Only the desktop's own
# session may (`session.set_password` refuses everyone else); it signs that
# person out everywhere.
kind: script
body: |
  if !session.is_desktop() { throw "Only the desktop sets passwords"; }
  let picked = actions.set_password_form();
  if picked.password == () || picked.password.len() < 8 { throw "Use at least 8 characters"; }
  session.set_password(picked.person, picked.password);
  notify("Password set; their sessions are signed out");
