# yaml-language-server: $schema=./action-schema-1.json
# The `flags` API's sign-in (api/flags.yaml `sign_in:`): runs signed out,
# checks the password, copies the person's role and environments onto the
# new session and hands back its token.
kind: script
body: |
  let id = session.check_password(#{ email: args.email }, args.password, "password_hash");
  if id == () { throw "Wrong email or password"; }
  let p = session.identity(id);
  let token = session.create(id, #{ name: p.name, role: p.role, envs: p.envs });
  #{ token: token }
