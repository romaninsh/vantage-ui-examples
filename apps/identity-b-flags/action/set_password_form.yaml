# yaml-language-server: $schema=./action-schema-1.json
kind: form
dialog:
  title: Set a password
  confirm_label: Set
  size: sm
form:
  fields:
    - name: person
      label: Person
      type: string
      widget: dropdown
      # language=rhai
      options: |
        table("person").sort("name", "asc")
      option_value: id
      option_label: name
    - { name: password, label: New password, type: string, masked: true }
