# yaml-language-server: $schema=./table-schema-1.json
# Table: lab_revolving — about ten rows, one deleted and one inserted twice a
# second. Select a row and watch what the grid does when it disappears.
datasource: lab
title: Revolving rows
faker:
  effect: rhai
  count: 10
  interval: 500ms
  seed: 205
  rhai: |
    if count() > 10 { delete(pick(ids())) }
    insert(#{ name: fake("name"), email: fake("email"), city: fake("city"),
              balance: rand_float(0.0, 9000.0) });
columns:
  - { name: id, type: string, flags: [id, hidden] }
  - { name: name, type: string, flags: [title, searchable] }
  - { name: email, type: string }
  - { name: city, type: string }
  - { name: balance, type: float, unit: { currency: "£" } }
