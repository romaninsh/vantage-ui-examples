# yaml-language-server: $schema=./table-schema-1.json
# Table: folders — the log tree written by the `logs` datasource's
# `builtin:folder_tree` sim. One row per folder or file; `parent` is the path of
# the containing folder ("" for the day folder), and every folder's size is the
# sum of its children, kept current by the sim.
datasource: logs
title: Folders
faker: { count: 0 }
columns:
  - { name: path, type: string, flags: [id] }
  - { name: parent, type: string, flags: [searchable] }
  - { name: name, type: string, flags: [title] }
  - { name: kind, type: string }
  - { name: size, type: int }
  - { name: created, type: timestamp }
  - { name: modified, type: timestamp }
