# Datasource: gym-traffic — PristineGym's live occupancy feed (synthetic).
#
# The `builtin:pulse` sim stands in for an upstream stream-processing job (a
# Kafka KTable): a fixed set of keys (UK regions) each carry a current value
# that drifts within a rubber-banded ±`band`% of a hard-coded baseline. One
# shared sim drives three tables — a raw `updates` feed, a derived `top`
# aggregate and per-minute `minutes` buckets — so all stay in lockstep. No
# backend, no network; aggregation happens entirely in the sim (Vantage does
# none client-side).
type: faker
sims:
  pulse:
    table: top
    script: "builtin:pulse"
    spawn:
      burst: 1
      max: 1
      args:
        aggregate: top
        feed: updates
        minutes: minutes
        key_column: region
        value_column: visitors
        band: 5
        min_interval: 1
        max_interval: 3
        # South West periodically drops offline (frozen value, live = "Offline").
        offline: [South West]
        # Baselines ≈ members training at once, per region (~28k total nationally).
        keys:
          - { name: London, baseline: 5300 }
          - { name: South East, baseline: 3900 }
          - { name: North West, baseline: 3300 }
          - { name: West Midlands, baseline: 2500 }
          - { name: Yorkshire & Humber, baseline: 2500 }
          - { name: East of England, baseline: 2200 }
          - { name: South West, baseline: 1900 }
          - { name: East Midlands, baseline: 1900 }
          - { name: Scotland, baseline: 1900 }
          - { name: Wales, baseline: 1100 }
          - { name: North East, baseline: 1100 }
