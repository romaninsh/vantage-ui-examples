# yaml-language-server: $schema=./datasource-schema-1.json
# Datasource: checkins — members arriving at the front desk (synthetic).
#
# The `builtin:fifo` sim is an append-only stream with expiry: the table starts
# empty, one row arrives per sim second (newest first), and each row leaves
# again after a random `retention_lo..retention_hi` seconds. The population
# settles around retention × rate rows, so the grid keeps flowing without ever
# growing unbounded.
type: faker
description: Front-desk check-ins, one arrival per second
sims:
  arrivals:
    table: checkin
    script: "builtin:fifo"
    spawn: { burst: 0, rate: 60, max: 100, args: { retention_lo: 20, retention_hi: 35 } }
