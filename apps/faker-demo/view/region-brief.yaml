# View: region-brief — a framework-grammar view (`args:`/`body:`/`outputs:`,
# no top-level `table:` — that's the legacy-view discriminator). Mounted from
# the framework-demo page via `kind: view`. Its body lives in a private scope:
# `count` is invisible to the page; only the declared `total` output crosses
# the boundary, re-exported under the mount's name (`brief.total`).
args:
  heading:
    type: string
    required: true
body:
  - kind: label
    params:
      text: "${args.heading}"
  - kind: stat
    name: count
    observe: top
    params:
      label: regions (counted inside the view)
      icon: Map
outputs:
  total: "${count.value}"
