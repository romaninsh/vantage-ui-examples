# Table: folders — the path-parameterized listing family over the logs sim.
# One row per child of a path: the finder opens one scenery per expanded
# folder, all routed through this single family (one Dio).
datasource: logs
title: Folders
# Folder rows lift {size, file_count} from the sim's get-only size vista via
# the dio-level augment — still one Dio; sizes trickle in with the vista's
# natural latency (the debounce showcase).
augment:
  from: folder_size
  key: path
  columns: [size, file_count]
columns:
  - { name: name, type: string, flags: [id, title] }
  - { name: kind, type: string }
  - { name: size, type: int }
  - { name: created, type: string }
  - { name: modified, type: string }
