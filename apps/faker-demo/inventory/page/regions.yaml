# Page: regions — the full per-region table, live (framework grammar; the
# hosted grid chrome sorts by header click). Ranked by headcount via the
# binding's shape. Publishes the selected region.
title: Regions
body:
  - kind: crud
    name: regions
    table: { script: 'scenery("top").sort("visitors", "desc")' }
    params:
      id_column: region
      columns:
        region: {}
        visitors: {}
        vs_baseline: {}
        live:
          color:
            green: ["Live"]
            red: ["Offline"]
