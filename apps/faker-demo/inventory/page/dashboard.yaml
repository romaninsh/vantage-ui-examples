# Page: dashboard — the Command Centre, on the framework grammar. Two hosted
# charts side by side (pie of members training now, bars of arrivals per
# minute) over two live framework lists (ranked regions, the raw feed tail).
# The legacy list's Rhai colour maps are approximated with plain templates —
# rich list formatting returns with the list-chrome convergence.
title: Command Centre
body:
  - kind: column
    children:
      - kind: row
        children:
          - kind: chart
            # Shaping lives on the binding: biggest region first, resolved
            # once into its own sorted scenery (the shared one stays as-is).
            table: { script: 'scenery("top").sort("visitors", "desc")' }
            params:
              x: region
              y: visitors
              label: Members training now
              chart_type: pie
          - kind: chart
            # tail() follows the end of the table — the last 10 minute
            # buckets, sliding as new minutes append (limit() would freeze
            # on the oldest 10).
            table: { script: 'scenery("minutes").tail(10)' }
            params:
              x: minute
              y: attendees
              label: Arrivals per minute
              chart_type: bar
              value_labels: true
      - kind: row
        children:
          - kind: list
            table: { script: 'scenery("top").sort("visitors", "desc")' }
            item:
              - kind: label
                params:
                  text: "${row.region}  ·  ${row.visitors}   (${row.vs_baseline}% vs baseline, ${row.live})"
          - kind: logview
            table: { script: 'scenery("updates").tail(15)' }
            params:
              columns: [updated, region, delta]
