# Page: framework-charts — exercises the heavyweight kinds on the framework
# contract. The chart bars re-scale live as the `minutes` buckets grow (the
# current minute's bar visibly climbs), and the formatted list tails the
# `updates` feed — rows expire after a few seconds, so the stream flows.
title: Framework Charts
body:
  - kind: column
    children:
      - kind: label
        params:
          text: "Arrivals per minute — kind: chart over the minutes table"

      - kind: chart
        table: minutes
        params:
          x: minute
          y: attendees
          label: arrivals per minute (last 10)

      - kind: label
        params:
          text: "Incoming feed — a formatted list over the updates table"

      - kind: list
        table: { script: 'scenery("updates").tail(12)' }
        params:
          text: 'updated + "   " + region'
          label: 'switch delta >= 0 { true => #{ text: "+" + delta.to_string(), color: "green" }, false => #{ text: delta.to_string(), color: "red" } }'
