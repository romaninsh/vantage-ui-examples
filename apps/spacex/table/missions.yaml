# yaml-language-server: $schema=./table-schema-1.json
# Table: missions — programmes grouping launches by customer (Iridium NEXT, …).
# `launches.mission_id` is a list on the wire, but `LaunchFind.mission_id`
# matches against it, so the relation narrows server-side.
datasource: spacex
title: Missions
references:
  launches: { table: launches, kind: has_many, foreign_key: mission_id }
columns:
  - { name: id, type: string, flags: [id] }
  - { name: name, type: string, flags: [title, searchable] }
  - { name: manufacturers, type: string }
  - { name: description, type: string, flags: [searchable] }
  - { name: website, type: string }
  - { name: twitter, type: string }
  - { name: wikipedia, type: string }
