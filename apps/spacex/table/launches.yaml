# yaml-language-server: $schema=./table-schema-1.json
# Table: launches — every Falcon launch. The `launches` root field takes a
# `find:` argument, so equality conditions (a page's `.where("launch_year", …)`,
# a parent's relation key) are pushed to the server. Nested objects arrive as
# dotted columns; `mission_id` and `ships` are lists on the wire, so they are
# not columns. The whole result loads in one request, which is why the
# aggregates below are exact rather than "over loaded rows".
datasource: spacex
title: Launches
aggregates:
  total: { op: count }
  successes: { op: count, where: { launch_success: "true" } }
  upcoming: { op: count, where: { upcoming: "true" } }
  by_year: { op: count, group_by: launch_year }
columns:
  - { name: id, type: string, flags: [id, hidden] }
  - { name: mission_name, label: Mission, type: string, flags: [title, searchable] }
  - { name: launch_year, label: Year, type: string,
      enum: ["2006", "2007", "2008", "2009", "2010", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022"] }
  - { name: launch_date_utc, label: Launched (UTC), type: timestamp, time_precision: minutes }
  - { name: rocket.rocket_name, label: Rocket, type: string }
  - { name: launch_site.site_name, label: Site, type: string }
  - { name: launch_success, label: Success, type: bool, flags: [label] }
  - { name: upcoming, type: bool, flags: [label] }
  - { name: is_tentative, label: Tentative, type: bool, flags: [label] }
  - { name: details, type: string, flags: [searchable] }
  - { name: links.wikipedia, label: Wikipedia, type: string, flags: [hidden] }
  - { name: links.video_link, label: Video, type: string, flags: [hidden] }
