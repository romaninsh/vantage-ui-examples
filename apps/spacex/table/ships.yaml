# yaml-language-server: $schema=./table-schema-1.json
# Table: ships — recovery and support vessels (drone ships, fairing catchers, tugs).
datasource: spacex
title: Ships
references:
  launches: { table: launches, kind: has_many, foreign_key: ship }
columns:
  - { name: id, type: string, flags: [id, hidden] }
  - { name: name, type: string, flags: [title, searchable] }
  - { name: type, type: string }
  - { name: home_port, label: Home port, type: string }
  - { name: active, type: bool }
  - { name: year_built, label: Built, type: int }
  - { name: model, type: string }
  - { name: successful_landings, label: Landings, type: int }
  - { name: attempted_landings, label: Attempts, type: int }
  - { name: url, type: string, flags: [hidden] }
