# yaml-language-server: $schema=./table-schema-1.json
# Table: dragons — Dragon 1 and Dragon 2. No `find:` on this root field, and
# no launch filter key names a dragon, so it has no relations.
datasource: spacex
title: Dragons
graphql:
  filter: false
columns:
  - { name: id, type: string, flags: [id, hidden] }
  - { name: name, type: string, flags: [title, searchable] }
  - { name: type, type: string }
  - { name: active, type: bool }
  - { name: first_flight, label: First flight, type: date }
  - { name: crew_capacity, label: Crew, type: int }
  - { name: description, type: string, flags: [searchable] }
  - { name: wikipedia, type: string, flags: [hidden] }
