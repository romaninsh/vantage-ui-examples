# yaml-language-server: $schema=./table-schema-1.json
# Table: launchpads — launch complexes (LC-39A, SLC-40, …). No `find:` on
# this root field; the launches relation narrows on the child's `site_id`.
datasource: spacex
title: Launchpads
graphql:
  filter: false
references:
  launches: { table: launches, kind: has_many, foreign_key: site_id }
columns:
  - { name: id, type: string, flags: [id, hidden] }
  - { name: name, type: string, flags: [title, searchable] }
  - { name: status, type: string, enum: [active, inactive, retired, "under construction", lost] }
  - { name: attempted_launches, label: Attempts, type: int }
  - { name: successful_launches, label: Launches, type: int }
  - { name: details, type: string, flags: [searchable] }
  - { name: wikipedia, type: string, flags: [hidden] }
