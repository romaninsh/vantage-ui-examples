# yaml-language-server: $schema=./page-schema-1.json
# Page: landpads — landing platforms; counts are text on the wire, so they sort as text.
title: Landpads
body:
  - kind: grid
    name: landpads
    observe: landpads
    height: 320
    params:
      search: true
      columns:
        full_name: { label: Landing pad, pin: true, width: 280 }
        landing_type:
          label: Type
          color: { blue: [ASDS], muted: [RTLS] }
          labels: { ASDS: Drone ship, RTLS: Return to launch site }
        status:
          label: Status
          color: { success: [active], muted: ["under construction"], danger: [retired, lost] }
          labels: { active: Active, "under construction": Under construction, retired: Retired, lost: Lost }
        attempted_landings: { label: Attempts }
        successful_landings: { label: Landings }
      row_actions:
        - label: Copy Wikipedia link
          icon: Copy
          copy: wikipedia
