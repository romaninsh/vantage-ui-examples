# yaml-language-server: $schema=./page-schema-1.json
# Page: launches — the binder observes the plain table key, so every "Open
# launches" drill-down from rockets, capsules, cores, programmes, payloads,
# launchpads and ships lands here. The filter funnel's terms are equality
# conditions, which the GraphQL datasource pushes to the server as
# `launches(find: {launch_year: "2018"})`; sorting and quicksearch run on
# the loaded rows (the generic dialect pushes equality only).
title: Launches
body:
  - kind: label
    params: { text: "Launches", style: heading, icon: Rocket }
  - kind: label
    params: { text: "Filter by year or success and the condition is sent to the API as a find: argument", style: muted }
  - kind: binder
    name: launches
    observe: launches
    params:
      default_sort: { column: launch_date_utc, direction: desc }
      filter: [launch_year, launch_success, upcoming]
      filters:
        - { label: "Upcoming only", column: upcoming, value: true, default: false }
      columns:
        mission_name: { label: Mission, pin: true, width: 240 }
        launch_date_utc: { label: Launched (UTC) }
        launch_year: { label: Year, width: 70 }
        rocket.rocket_name: { label: Rocket }
        launch_site.site_name: { label: Site }
        launch_success:
          label: Success
          color: { success: ["true"], danger: ["false"] }
          labels: { "true": Success, "false": Failed }
        upcoming:
          label: Upcoming
          color: { warning: ["true"] }
          labels: { "true": Upcoming, "false": Flown }
        is_tentative:
          label: Tentative
          color: { warning: ["true"] }
          labels: { "true": Tentative, "false": Confirmed }
