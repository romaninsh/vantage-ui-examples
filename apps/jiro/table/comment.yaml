# yaml-language-server: $schema=./table-schema-1.json
# Comments on issues — collection `comment`.
datasource: jiro
title: Comment
table: comment
columns:
  - { name: _id, label: ID, type: string, flags: [id, hidden] }
  - { name: body, label: Comment, type: string, flags: [title, mandatory, searchable] }
  - { name: issue, label: Issue, type: string, references: { table: issue, kind: has_one, name: issue } }
  - { name: issue_key, label: Issue, type: string, flags: [calculated] }
  - { name: author, label: Author, type: string, references: { table: member, kind: has_one, name: author } }
  - { name: author_name, label: Author, type: string, flags: [calculated] }
  - { name: created_at, label: Posted, type: timestamp, time_precision: minutes }
