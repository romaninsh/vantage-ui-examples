services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      # Host 27017 is taken on this machine; publish on 27027 instead.
      - "127.0.0.1:27027:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; db.hello().isWritablePrimary || quit(1)"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  mongo-data:
