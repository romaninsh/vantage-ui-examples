# yaml-language-server: $schema=./page-schema-1.json
title: Watchers
body:
  - kind: binder
    name: watchers
    observe: watcher
    params:
      id_column: _id
      default_sort: { column: issue_key, direction: asc }
      filter: ["~issue_key", "~member_name"]
