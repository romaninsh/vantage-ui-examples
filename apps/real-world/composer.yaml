# Generated by Vantage's connect wizard — edit freely; it is yours now.
#
# Vantage reads this file (the Services indicator in the title bar)
# and runs the stack for you; it is standard compose schema, so
# `docker compose -f composer.yaml up -d` drives the same stack.
# `127.0.0.1::<port>` = loopback-only AND an ephemeral host port —
# Vantage rewrites the datasource's service:port to whatever docker
# picked, and nothing is reachable from the local network.
services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    command: start --user root --pass root --bind 0.0.0.0:8000 rocksdb:/home/nonroot/db.db
    ports:
      - "127.0.0.1::8000"
    volumes:
      - surrealdb-data:/home/nonroot
    healthcheck:
      test: ["CMD", "/surreal", "isready"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  surrealdb-data:
