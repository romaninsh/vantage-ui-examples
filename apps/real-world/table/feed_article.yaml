# yaml-language-server: $schema=./table-schema-1.json
# The RealWorld article feed, newest first, 20 articles (the API's default page).
# args: reader — a user id ("user:jake"): only authors that user follows; "" = global feed
#       tag    — a tag name: only articles carrying it; "" = any tag
datasource: surrealdb
title: Feed article
columns:
  id: { type: string, flags: [id] }
  slug: { type: string }
  title: { type: string, flags: [title] }
  description: { type: string }
  author_name: { type: string }
  published: { type: string }
  tags: { type: string }
  favorites: { type: int }
  comments: { type: int }
  created_at: { type: timestamp }
surreal:
  # language=rhai
  rhai: |
    let reader = args.get("reader") ?? "";
    let tag = args.get("tag") ?? "";
    // The separator goes through type::string(..): fx takes no bare strings.
    let q = surreal::select()
        .from("article")
        .field("id")
        .field("slug")
        .field("title")
        .field("description")
        .expression(surreal::ident("author")["username"].alias("author_name"))
        .expression(surreal::fx("fn::ago", [surreal::ident("created_at")]).alias("published"))
        .expression(surreal::fx("array::join", [
            surreal::fx("array::sort", [surreal::select().value().expression(surreal::ident("tag")["name"]).from("article_tag").where(surreal::ident("article") == surreal::parent("id")).subquery()]),
            surreal::cast(" · ", "string")
        ]).alias("tags"))
        .expression(surreal::coalesce(surreal::select().value().expression(surreal::count()).from("favorite").where(surreal::ident("article") == surreal::parent("id")).group_all().subquery()[0], 0).alias("favorites"))
        .expression(surreal::coalesce(surreal::select().value().expression(surreal::count()).from("comment").where(surreal::ident("article") == surreal::parent("id")).group_all().subquery()[0], 0).alias("comments"))
        .field("created_at");
    if reader != "" {
        q = q.where(
            surreal::select().value().expression(surreal::count()).from("follow")
                .where(surreal::cast(surreal::ident("follower"), "string") == reader)
                .where(surreal::cast(surreal::ident("author"), "string") == surreal::cast(surreal::parent("author"), "string"))
                .group_all().subquery()[0] > 0);
    }
    if tag != "" {
        q = q.where(
            surreal::select().value().expression(surreal::count()).from("article_tag")
                .where(surreal::ident("tag")["name"] == tag)
                .where(surreal::ident("article") == surreal::parent("id"))
                .group_all().subquery()[0] > 0);
    }
    q.order_by(surreal::ident("created_at"), "desc")
        .limit(20, 0)
