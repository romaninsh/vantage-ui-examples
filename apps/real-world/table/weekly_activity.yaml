# yaml-language-server: $schema=./table-schema-1.json
# Articles and comments per week for the last 16 weeks, zero-filled:
# rows { week: "2026-09-10", articles: 1, comments: 8 }.
datasource: surrealdb
title: Weekly activity
columns:
  id: { type: string, flags: [id] }
  week: { type: string, flags: [title] }
  articles: { type: int }
  comments: { type: int }
surreal:
  # language=rhai
  rhai: |
    // fx takes no bare numbers or strings, so they pass through type::int / type::string.
    let one_week = surreal::fx("duration::from_weeks", [surreal::cast(1, "int")]);
    let bucket_dates = surreal::fx("array::range", [surreal::cast(0, "int"), surreal::cast(16, "int")])
        .map(|i| #{ bucket: surreal::fx("time::floor", [surreal::time_now(), surreal::fx("duration::from_weeks", [surreal::cast(1, "int")])]) - surreal::fx("duration::from_weeks", [15 - i]) });
    let articles_in_week = surreal::coalesce(
        surreal::select().value().expression(surreal::count()).from("article")
            .where(surreal::ident("created_at") >= surreal::parent("bucket"))
            .where(surreal::ident("created_at") < surreal::parent("bucket") + one_week)
            .group_all().subquery()[0],
        0);
    let comments_in_week = surreal::coalesce(
        surreal::select().value().expression(surreal::count()).from("comment")
            .where(surreal::ident("created_at") >= surreal::parent("bucket"))
            .where(surreal::ident("created_at") < surreal::parent("bucket") + one_week)
            .group_all().subquery()[0],
        0);
    surreal::select()
        .from(
            surreal::select()
                .field("bucket")
                .expression(surreal::date_format(surreal::ident("bucket"), "%Y-%m-%d").alias("week"))
                .from(bucket_dates)
                .subquery())
        .expression(surreal::fx("type::record", [surreal::cast("weekly_activity", "string"), surreal::ident("week")]).alias("id"))
        .field("week")
        .expression(articles_in_week.alias("articles"))
        .expression(comments_in_week.alias("comments"))
        .order_by(surreal::ident("week"), "asc")
