# yaml-language-server: $schema=./table-schema-1.json
datasource: surrealdb
title: Tag
columns:
  id: { type: string, flags: [id] }
  name: { type: string, flags: [mandatory, title, searchable] }
  article_count: { type: int, label: Articles, expr: 'surreal::coalesce(surreal::select().value().expression(surreal::count()).from("article_tag").where(surreal::ident("tag") == surreal::parent("id")).group_all().subquery()[0], 0)' }
  usage:
    type: string
    label: Usage
    flags: [label]
    expr: |-
      surreal::case_when()
          .when(surreal::coalesce(surreal::select().value().expression(surreal::count()).from("article_tag").where(surreal::ident("tag") == surreal::parent("id")).group_all().subquery()[0], 0) == 0, "unused")
          .when(surreal::select().value().expression(surreal::count()).from("article_tag").where(surreal::ident("tag") == surreal::parent("id")).group_all().subquery()[0] >= 6, "popular")
          .else_("")
          .expr()
  created_at: { type: timestamp, label: Created, date_precision: day }
  updated_at: { type: timestamp, label: Updated, time_precision: minutes }
references:
  article_tags: { table: article_tag, kind: has_many, foreign_key: tag }
