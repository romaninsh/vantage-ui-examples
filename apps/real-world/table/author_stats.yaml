# yaml-language-server: $schema=./table-schema-1.json
# Most-favorited authors: one row per user with at least one article.
# bar_pct = favorites as a share of the leader's (0–100), for the list bar.
datasource: surrealdb
title: Top authors
columns:
  id: { type: string, flags: [id] }
  username: { type: string, flags: [title] }
  articles: { type: int }
  favorites: { type: int }
  followers: { type: int }
  bar_pct: { type: float }
surreal:
  # language=rhai
  rhai: |
    let favorites_of_user = surreal::coalesce(
        surreal::select().value().expression(surreal::count()).from("favorite")
            .where(surreal::ident("article")["author"] == surreal::parent("id"))
            .group_all().subquery()[0],
        0);
    let leader = surreal::max(surreal::select().value().expression(favorites_of_user).from("user").subquery());
    surreal::select()
        .from(
            surreal::select()
                .from("user")
                .field("id")
                .field("username")
                .expression(surreal::coalesce(surreal::select().value().expression(surreal::count()).from("article").where(surreal::ident("author") == surreal::parent("id")).group_all().subquery()[0], 0).alias("articles"))
                .expression(favorites_of_user.alias("favorites"))
                .expression(surreal::coalesce(surreal::select().value().expression(surreal::count()).from("follow").where(surreal::ident("author") == surreal::parent("id")).group_all().subquery()[0], 0).alias("followers"))
                .subquery())
        .field("id")
        .field("username")
        .field("articles")
        .field("favorites")
        .field("followers")
        .expression(surreal::round(surreal::cast(surreal::ident("favorites"), "float") * 100.0 / leader).alias("bar_pct"))
        .where(surreal::ident("articles") > 0)
        .order_by(surreal::ident("favorites"), "desc")
        .order_by(surreal::ident("articles"), "desc")
        .limit(8, 0)
