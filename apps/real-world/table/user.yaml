# yaml-language-server: $schema=./table-schema-1.json
datasource: surrealdb
title: User
columns:
  id: { type: string, flags: [id] }
  username: { type: string, flags: [mandatory, title, searchable] }
  # Pills beside the username.
  role:
    type: string
    label: Role
    flags: [label]
    enum: [author, reader]
    expr: |-
      surreal::case_when()
          .when(surreal::select().value().expression(surreal::count()).from("article").where(surreal::ident("author") == surreal::parent("id")).group_all().subquery()[0] > 0, "author")
          .else_("reader")
          .expr()
  # nullif(1, 1) is NONE: `email_verified_at != NONE`.
  email_status:
    type: string
    label: Email
    flags: [label]
    enum: [verified, unverified]
    expr: |-
      surreal::case_when()
          .when(surreal::ident("email_verified_at") != surreal::nullif(1, 1), "verified")
          .else_("unverified")
          .expr()
  email: { type: string, flags: [mandatory, searchable] }
  bio: { type: string }
  image: { type: string, label: Avatar URL }
  # bcrypt hash; plain text written here is hashed by the database.
  password: { type: string, flags: [hidden] }
  email_verified_at: { type: timestamp, label: Email verified, time_precision: minutes }
  article_count: { type: int, label: Articles, expr: 'surreal::coalesce(surreal::select().value().expression(surreal::count()).from("article").where(surreal::ident("author") == surreal::parent("id")).group_all().subquery()[0], 0)' }
  follower_count: { type: int, label: Followers, expr: 'surreal::coalesce(surreal::select().value().expression(surreal::count()).from("follow").where(surreal::ident("author") == surreal::parent("id")).group_all().subquery()[0], 0)' }
  following_count: { type: int, label: Following, expr: 'surreal::coalesce(surreal::select().value().expression(surreal::count()).from("follow").where(surreal::ident("follower") == surreal::parent("id")).group_all().subquery()[0], 0)' }
  favorite_count: { type: int, label: Favorites, expr: 'surreal::coalesce(surreal::select().value().expression(surreal::count()).from("favorite").where(surreal::ident("user") == surreal::parent("id")).group_all().subquery()[0], 0)' }
  comment_count: { type: int, label: Comments, expr: 'surreal::coalesce(surreal::select().value().expression(surreal::count()).from("comment").where(surreal::ident("author") == surreal::parent("id")).group_all().subquery()[0], 0)' }
  joined_ago: { type: string, label: Joined, expr: 'surreal::fx("fn::ago", [surreal::ident("created_at")])' }
  created_at: { type: timestamp, label: Joined on, date_precision: day }
  updated_at: { type: timestamp, label: Updated, time_precision: minutes }
references:
  articles: { table: article, kind: has_many, foreign_key: author }
  comments: { table: comment, kind: has_many, foreign_key: author }
  favorites: { table: favorite, kind: has_many, foreign_key: user }
  followers: { table: follow, kind: has_many, foreign_key: author }
  following: { table: follow, kind: has_many, foreign_key: follower }
