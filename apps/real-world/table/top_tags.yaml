# yaml-language-server: $schema=./table-schema-1.json
# Most-used tags: rows { tag: "css", articles: 7, share_pct: 12.5 } (bar length: share of the most-used tag).
datasource: surrealdb
title: Top tags
columns:
  id: { type: string, flags: [id] }
  tag: { type: string, flags: [title] }
  articles: { type: int }
  share_pct: { type: float }
surreal:
  # language=rhai
  rhai: |
    let per_tag = surreal::select()
        .expression(surreal::count().alias("c"))
        .field("tag")
        .from("article_tag")
        .group_by(surreal::ident("tag"))
        .subquery();
    surreal::select()
        .from(
            surreal::select()
                .expression(surreal::ident("tag")["name"].alias("tag"))
                .expression(surreal::count().alias("articles"))
                .from("article_tag")
                .group_by(surreal::ident("tag"))
                .subquery())
        .expression(surreal::fx("type::record", [surreal::cast("top_tags", "string"), surreal::ident("tag")]).alias("id"))
        .field("tag")
        .field("articles")
        .expression(surreal::round(surreal::cast(surreal::ident("articles"), "float") * 100.0 / surreal::max(per_tag["c"])).alias("share_pct"))
        .order_by(surreal::ident("articles"), "desc")
        .order_by(surreal::ident("tag"), "asc")
        .limit(8, 0)
