# yaml-language-server: $schema=./table-schema-1.json
# Users who never confirmed their email address.
datasource: surrealdb
title: Unverified user
columns:
  id: { type: string, flags: [id] }
  username: { type: string, flags: [title] }
  email: { type: string }
  created_at: { type: timestamp }
surreal:
  # language=rhai
  rhai: |
    // nullif(1, 1) is NONE: `email_verified_at = NONE`.
    surreal::select()
        .from("user")
        .field("id")
        .field("username")
        .field("email")
        .field("created_at")
        .where(surreal::ident("email_verified_at") == surreal::nullif(1, 1))
        .order_by(surreal::ident("created_at"), "desc")
