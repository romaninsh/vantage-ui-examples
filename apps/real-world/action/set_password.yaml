# yaml-language-server: $schema=./action-schema-1.json
kind: form
dialog:
  title: "Set password for ${row.username}"
  description: "The database stores a bcrypt hash; the user signs in with the new password from now on."
  confirm_label: Set password
  cancel_label: Keep current
form:
  fields:
    - { name: password, type: string, label: "New password (8+ characters)" }
