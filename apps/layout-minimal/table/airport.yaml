# yaml-language-server: $schema=./table-schema-1.json
# Table: airport — the small reference table behind the flights grid's
# `origin`/`destination` codes. Same 18 IATA codes, same order, as
# table/flight.yaml's `origin`/`destination` pick list.
datasource: airports
title: Airports
columns:
  - { name: id, type: string, flags: [id, hidden] }
  - { name: iata, label: IATA, type: string, flags: [title, searchable], faker: { pick: { values: [LHR, LGW, MAN, EDI, BHX, GLA, DUB, CDG, AMS, FRA, MAD, BCN, FCO, MUC, ZRH, JFK, ORD, DXB], weights: [10, 6, 6, 4, 4, 3, 5, 8, 8, 8, 5, 5, 4, 5, 4, 6, 4, 6] } } }
  - { name: city, type: string }
  - { name: country, type: string }
  - { name: kind, label: Type, type: string, flags: [searchable], faker: { pick: { values: [Hub, Regional, Cargo], weights: [5, 3, 1] } } }
  - { name: runways, type: int, faker: { range: { min: 1, max: 6 } } }
  - { name: timezone, type: string, faker: { pick: { values: [GMT, CET, EST, PST, GST, SGT] } } }
