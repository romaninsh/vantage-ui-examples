# yaml-language-server: $schema=./action-schema-1.json
kind: form
dialog:
  title: View as a role
  confirm_label: View as
  size: sm
form:
  fields:
    - { name: role, label: Role, type: string, choices: [manager, baker], default: manager }
    - name: bakery
      label: Bakery
      type: string
      widget: dropdown
      # language=rhai
      options: |
        table("bakery").sort("name", "asc")
      option_value: id
      option_label: name
