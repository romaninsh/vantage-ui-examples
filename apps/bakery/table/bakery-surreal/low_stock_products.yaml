# yaml-language-server: $schema=../table-schema-1.json

name: low_stock_products
datasource: bakery-surreal

columns:
  id: { type: string, flags: [id] }
  name: { type: string, flags: [title] }
  stock: { type: int }
  # Branch name, filled only on the unfiltered read (see client_balances).
  branch: { type: string }

surreal:
  # language=rhai
  rhai: |
    let b = args.get("bakery") ?? "";
    let branch = if b == "" { expr("bakery.name") } else { expr("''") };
    let q = select().from("product")
        .field("id").field("name")
        .expression(ident("inventory")["stock"].alias("stock"))
        .expression(branch.alias("branch"))
        .where(ident("inventory")["stock"] < 10)
        .where(ident("is_deleted") == false);
    if b != "" {
        q = q.where(expr("bakery.name = {}", [b]));
    }
    q.order_by(ident("inventory")["stock"], "asc")
