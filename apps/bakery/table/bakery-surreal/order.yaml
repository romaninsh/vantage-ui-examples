# yaml-language-server: $schema=./bakery-surreal-schema-1.json

name: order
datasource: bakery-surreal

columns:
  id: { type: string, flags: [id] }
  bakery: { type: string, references: bakery }
  is_deleted: { type: bool }
  created_at: { type: datetime }
  lines: { type: string }
  # Valid values: placed | confirmed | in_production | ready | delivered | picked_up | paid | cancelled
  status: { type: string }
  cancellation_reason: { type: string }
  cancellation_note: { type: string }
