# yaml-language-server: $schema=./table-schema-1.json

name: revenue_by_day
datasource: bakery-surreal

columns:
  id: { type: string, flags: [id] }
  day: { type: string, flags: [title] }
  revenue: { type: int }

surreal:
  # Daily revenue over the last 90 days, in three nested SELECTs:
  #   L1  per-order `day` bucket (time::format) + `total` (fold over lines)
  #   L2  GROUP BY day -> summed `revenue`  (day is now scalar)
  #   L3  synthesize a record-id `id` from the scalar day
  # A query-sourced table's id MUST be a real record id (the vista calls
  # Thing::from_cbor on it) — a plain string fails. `day` stays a string
  # for the chart x-axis: a CBOR datetime would render as an empty label.
  # language=rhai
  rhai: |
    select()
        .from(
            select()
                .field("day")
                .expression(sum(ident("total")).alias("revenue"))
                .from(
                    select()
                        .expression(expr("time::format(created_at, '%Y-%m-%d')").alias("day"))
                        .expression(ident("lines").fold(0, |acc, l| acc + l["quantity"] * l["price"]).alias("total"))
                        .from("order")
                        .where(expr("created_at > time::now() - 90d"))
                        .subquery())
                .group_by(ident("day"))
                .subquery())
        .expression(fx("type::record", [expr("'revenue_by_day'"), ident("day")]).alias("id"))
        .field("day")
        .field("revenue")
        .order_by(ident("day"), "asc")
