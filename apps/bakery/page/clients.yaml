# yaml-language-server: $schema=./page-schema-1.json
title: Clients
body:
  - kind: binder
    name: clients
    observe: bakery-surreal/client
    params:
      row_actions:
        - label: Send password reset
          icon: Mail
          # language=rhai
          action: |
            let pwd = generate_password(12);
            actions.send_password_reset(row.email, row.name, pwd);
            row.password_hash = hash_password(pwd);
            row.save();
