# yaml-language-server: $schema=./page-schema-1.json
title: Products
body:
  - kind: binder
    name: products
    observe: bakery-surreal/product
    params:
      # `bakery.name` reads through the reference to the shop's title, so
      # the grid shows "Breg Briggate, Leeds" rather than `bakery:leeds`.
      columns:
        name: { label: Product, pin: true }
        bakery.name: { label: Shop }
        price: { label: Price }
        calories: { label: kcal }
      toolbar:
        - label: "Add product"
          icon: Plus
          # language=rhai
          action: |
            let r = actions.add_product();
            let p = tables.product.create();
            p.set(r);
            p.save();
        - label: "Import products"
          icon: Upload
          # language=rhai
          action: |
            actions.import_products();
        - label: "Bake muffins"
          icon: Play
          # language=rhai
          action: |
            actions.bake_muffins();
        # Setup lives on a grid toolbar because only toolbar/row bodies
        # can dispatch actions today (a standalone `kind: button` runs
        # in the scope-only env). Move to the Welcome page once buttons
        # can dispatch.
        - label: "Set up services"
          icon: Rocket
          # language=rhai
          action: |
            actions.setup();
        - label: "Seed database"
          icon: Database
          # language=rhai
          action: |
            actions.seed_database();
