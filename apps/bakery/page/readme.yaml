# yaml-language-server: $schema=./page-schema-1.json
#
# The app's own README, rendered. `!include` splices the file in as the
# template's text, so this page and the repository never say different
# things.
title: Welcome
body:
  - kind: column
    children:
      # First-run door: start the services, seed the data — both steps
      # skippable (see action/setup.yaml). Harmless once everything
      # already runs.
      - kind: button
        params:
          label: "Set up services & data"
          icon: Play
          style: primary
          # language=rhai
          action: |
            actions.setup();
      - kind: markdown
        text: !include ../README.md
