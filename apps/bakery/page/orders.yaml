# yaml-language-server: $schema=./page-schema-1.json
title: Orders
body:
  - kind: binder
    name: orders
    observe: bakery-surreal/order
    params:
      # A record id is noise on a page. Naming a column list drops `id` and
      # the raw foreign keys, and a dotted name reads through the reference
      # to the target's own title — no column declared on the table.
      columns:
        client.name: { label: Client, pin: true }
        bakery.name: { label: Shop }
        created_at: { label: Placed }
        # An order tracks fulfilment only. Whether the money arrived is a
        # question about its invoice, and lives on the Invoices page.
        status:
          label: Status
          color:
            success: [delivered, picked_up]
            yellow: [in_production, ready]
            red: [cancelled]
            muted: [placed]
          labels:
            placed: Placed
            confirmed: Confirmed
            in_production: In production
            ready: Ready
            delivered: Delivered
            picked_up: Picked up
            cancelled: Cancelled
        invoice.number: { label: Invoice }
      # Lifecycle transitions. `when:` gates each entry on the row's
      # current status so the menu only shows the legal next steps.
      row_actions:
        - label: "Mark confirmed"
          icon: Check
          when: 'row.status == "placed"'
          # language=rhai
          action: |
            row.status = "confirmed";
            row.save();
        - label: "Start production"
          icon: Factory
          when: 'row.status == "confirmed"'
          # language=rhai
          action: |
            row.status = "in_production";
            row.save();
        - label: "Mark ready"
          icon: Package
          when: 'row.status == "in_production"'
          # language=rhai
          action: |
            row.status = "ready";
            row.save();
        - label: "Mark delivered"
          icon: Truck
          when: 'row.status == "ready"'
          # language=rhai
          action: |
            row.status = "delivered";
            row.save();
        - label: "Mark picked up"
          icon: ShoppingCart
          when: 'row.status == "ready"'
          # language=rhai
          action: |
            row.status = "picked_up";
            row.save();
        - label: "Cancel order"
          icon: X
          # An invoiced order is no longer the order desk's to cancel; it
          # would leave the invoice quoting a total nobody owes.
          when: 'row.status != "cancelled" && row.status != "delivered" && row.status != "picked_up"'
          # language=rhai
          action: |
            let r = actions.cancel_order();
            row.status              = "cancelled";
            row.cancellation_reason = r.reason;
            row.cancellation_note   = r.note;
            row.save();
