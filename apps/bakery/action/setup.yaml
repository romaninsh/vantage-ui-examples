# yaml-language-server: $schema=./action-schema-1.json
#
# First-run setup, three skippable steps: what you're getting, the
# composer panel to start the services, and the seed. Someone who
# already runs their own SurrealDB on 8000 clicks Next twice and seeds;
# someone with everything running never opens this at all.

kind: wizard
description: |
  Start the bakery's local services and load the demo dataset.
dialog:
  title: "Set up the bakery"
  size: xl
steps:
  - name: welcome
    title: "Welcome"
    body:
      - kind: markdown
        text: |
          # Breg needs a database

          This example runs against a local **SurrealDB**. The next two
          steps get you there without installing anything by hand:

          1. **Services** — start the database container. Vantage
             manages it from here on: it stops when you quit and
             resumes when you come back.
          2. **Seed** — load the demo dataset (shops, products, a year
             of orders, invoices and payments).

          Every step is skippable — if you already run SurrealDB on
          port 8000, click straight through and just seed.

  - name: services
    title: "Services"
    composer: true
    body:
      - kind: markdown
        text: |
          Press **Start** and wait for the green dot. The container
          engine (Docker Desktop, colima, OrbStack) must be running —
          the panel above will say so if it isn't.

  # A wizard-step button cannot dispatch an action yet (steps run in
  # the scope-only env — same limit as page buttons), so this step
  # points at the toolbar action instead of carrying its own button.
  # Give it one (`actions.seed_database()`) once buttons can dispatch.
  - name: seed
    title: "Seed data"
    body:
      - kind: markdown
        text: |
          Last step: load the demo dataset — press **Finish**, then use
          **Seed database** on the Products page toolbar. It runs in a
          container (nothing to install), takes a minute, and re-running
          refreshes the data rather than duplicating it.
