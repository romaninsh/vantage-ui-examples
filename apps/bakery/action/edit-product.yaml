# yaml-language-server: $schema=./action-schema-1.json

kind: form
description: Update an existing product's name, bakery, price, calories, or stock.
dialog:
  title: "Edit product"
form:
  table: bakery-surreal/product
  fields:
    - name
    - { name: bakery, widget: dropdown }
    - price
    - calories
    - { name: "inventory.stock", type: int, label: Stock, required: false }
