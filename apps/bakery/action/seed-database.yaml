# yaml-language-server: $schema=./action-schema-1.json
#
# Runs the one-shot `seed` service from composer.yaml: a container
# carrying python + the surreal CLI, so seeding needs nothing installed
# on the host. `--wipe` inside the service's command means re-running
# refreshes the dataset rather than duplicating it.

kind: terminal
description: |
  Load (or refresh) the demo dataset: 6 shops, ~4,000 orders, a year of
  invoices and payments. Needs the services running — start them from
  the Services indicator or the setup wizard first.
dialog:
  title: "Seed the database"
terminal:
  command: docker
  # --no-deps: the seeder reaches surrealdb over the compose network
  # (`surrealdb:8000`), so it must not try to (re)create the service —
  # that path republishes host ports and collides with anything else
  # sitting on 8000. Services must already be running (the panel says).
  args:
    ["compose", "-f", "composer.yaml", "--profile", "seed", "run", "--rm", "--no-deps", "seed"]
