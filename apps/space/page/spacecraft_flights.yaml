# yaml-language-server: $schema=./page-schema-1.json
# Page: spacecraft_flights — one row per crewed/cargo vehicle flight.
title: Spacecraft flights
body:
  - kind: binder
    name: spacecraft_flights
    observe: spacecraft_flights
    params:
      columns:
        spacecraft.name: { label: Vehicle, pin: true, width: 220 }
        launch.name: { label: Launch, width: 320 }
        destination: { label: Destination }
        mission_end: { label: Mission end, date_precision: day }
        duration: { label: Duration }
