# yaml-language-server: $schema=./page-schema-1.json

# Page: launches — one page for all/upcoming/previous. The range select
# publishes `range.value`; the binding's scenery script reads it, so choosing
# a range REMOUNTS the page over the right table (a structural dependency —
# the query changes, not just the rows). Upcoming sorts soonest-first.

title: Launches

body:
  - kind: column
    children:
      - kind: select
        name: range
        params: { options: [all, upcoming, previous], default: all }
      - kind: crud
        table:
          script: 'scenery(if range.value == "all" { "launches" } else { "launches_" + range.value }).sort("net", if range.value == "upcoming" { "asc" } else { "desc" })'
