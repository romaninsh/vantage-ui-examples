# yaml-language-server: $schema=./page-schema-1.json

# Page: events — one page for all/upcoming/previous, same reactive-binding
# pattern as launches: the range select structurally re-shapes the binding.

title: Events

body:
  - kind: column
    children:
      - kind: select
        name: range
        params: { options: [all, upcoming, previous], default: all }
      - kind: crud
        table:
          script: 'scenery(if "${range.value}" == "all" { "events" } else { "events_${range.value}" }).sort("date", if "${range.value}" == "upcoming" { "asc" } else { "desc" })'
