# yaml-language-server: $schema=./table-schema-1.json
# Table: visit — 3 to 5 visits per member over the last four months.
datasource: gym
title: Visits
faker:
  fan_out: { column: member, min: 3, max: 5 }
columns:
  - { name: id, type: string, flags: [id, hidden] }
  - { name: member, label: Member, type: string, references: member }
  - { name: at, label: Checked in, type: timestamp, faker: { date: { from: "-120d" } } }
  - { name: activity, label: Activity, type: string, flags: [title, searchable], faker: { pick: { values: [Weights, Spin class, Yoga, HIIT, Swim, Pilates, Boxing, Open gym], weights: [5, 3, 2, 3, 2, 2, 1, 4] } } }
  - { name: duration_min, label: Minutes, type: int, faker: { range: { min: 20, max: 120 } } }
  - { name: trainer_name, label: Trainer, type: string }
references:
  payments: { table: payment, kind: has_many, foreign_key: visit }
