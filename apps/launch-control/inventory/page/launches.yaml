# Page: launches — THE screen, as a framework binder composite. ONE element:
# master crud grid on top; selecting a row reveals a resizable bottom panel
# with the hand-authored Summary view (view/launch_summary.yaml), Details
# (record form), and one grid per has_many relation — auto-derived from the
# table's declared relations. Selection is internal (value-class): no page
# remounts while arrow-keying through rows.
title: Launches
body:
  - kind: binder
    name: launches
    table: launches
    params:
      id_column: id
      default_sort: { column: last_updated, direction: desc }
      # Re-pull the launches viewport every 2s (the simulator stamps
      # `last_updated` about that often) — a new launch floats to the top
      # and the summary's telemetry keeps tracking. Content-aware
      # generation: an unchanged re-pull repaints nothing.
      refresh_interval: 2
      # Custom read-only summary tab (view/launch_summary.yaml), shown
      # before the auto-derived Details / relation tabs.
      views:
        - launch_summary
      toolbar:
        - label: "New simulated launch"
          icon: Play
          action: |
            let r = actions.new_launch();
            actions.submit_launch(r.lsp_id, r.pad_id, r.rocket_configuration_id, r.name);
      columns:
        name: { width: 400 }
        status.name:
          color:
            green: ["Go for Launch", "Launch Successful"]
            yellow: ["Launch in Flight", "To Be Confirmed", "To Be Determined", "On Hold"]
            red: ["Launch Failure", "Launch was a Partial Failure"]
        webcast_live: { label: Live }
        last_updated: {}
        launch_service_provider.name: { label: Provider }
        rocket_configuration.name: { label: Rocket }
        pad.name: { label: Pad }
        net: {}
