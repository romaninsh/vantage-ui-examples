# Page: launches-fw — the framework binder composite, side by side with the
# legacy `launches` binder for comparison. ONE element: master crud grid on
# top; selecting a row reveals a resizable bottom panel with Details (record
# form) plus one grid per has_many relation — all auto-derived from the
# table's declared relations. Selection is internal (value-class): no page
# remounts while arrow-keying through rows.
title: Launches (framework)
body:
  - kind: binder
    name: launches
    table: launches
    params:
      id_column: id
      default_sort: { column: last_updated, direction: desc }
      columns:
        name: { width: 400 }
        status.name:
          color:
            green: ["Go for Launch", "Launch Successful"]
            yellow: ["Launch in Flight", "To Be Confirmed", "To Be Determined", "On Hold"]
            red: ["Launch Failure", "Launch was a Partial Failure"]
        webcast_live: { label: Live }
        last_updated: {}
        launch_service_provider.name: { label: Provider }
        rocket_configuration.name: { label: Rocket }
        pad.name: { label: Pad }
        net: {}
