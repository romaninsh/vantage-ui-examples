# yaml-language-server: $schema=./table-schema-1.json
# Table: login_audit — one row per Auth0 login, written server-side by the
# `auth0` access's AUTHENTICATE clause (subject/email/name/issuer + time).
# A read-only view for tracking who signed in and when.
datasource: leads
title: Login Audit

columns:
  - { name: id, type: string, flags: [id, hidden] }
  - { name: email, type: string, flags: [title, searchable] }
  - { name: name, type: string, optional: true, flags: [searchable] }
  - { name: at, type: string, optional: true }
  - { name: subject, type: string, optional: true, flags: [hidden] }
  - { name: issuer, type: string, optional: true, flags: [hidden] }
