# Standalone workspace on purpose. This crate compiles to
# `wasm32-unknown-unknown` and is built by `spacetime publish`, not by the
# examples workspace; keeping it out avoids feature unification with the native
# crates and lets it carry its own lockfile. (`launch-control/server` *is* a
# workspace member, because it is an ordinary native binary.)
[workspace]

[package]
name = "cardroom-module"
version = "0.1.0"
edition = "2024"
publish = false
description = "SpacetimeDB module for the cardroom example — a multiplayer poker server"

[lib]
# `cdylib` is what `spacetime publish` compiles to wasm32-unknown-unknown.
#
# `rlib` used to be here too, on the theory that it let the hand evaluator be
# unit tested natively. It never did: a native test harness has to link the
# SpacetimeDB bindings, which import `_console_log` from the wasm host, so
# `cargo test` failed at the linker whatever tests existed. The evaluator now
# lives in `cardroom-poker`, where the tests genuinely run.
crate-type = ["cdylib"]

[dependencies]
spacetimedb = "2.7"
log = "0.4"
# Cards and hand evaluation. A separate crate so its tests can run at all:
# linking a native test harness against *this* crate fails on the bindings'
# `_console_log` import, and the evaluator needs no database to be worth testing.
cardroom-poker = { path = "../poker" }
