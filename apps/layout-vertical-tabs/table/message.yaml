# yaml-language-server: $schema=./table-schema-1.json
# Table: message — every conversation fans out into 2-10 messages, spread
# evenly over the last two weeks.
datasource: chat
title: Messages
faker:
  fan_out: { column: conversation, min: 2, max: 10 }
columns:
  - { name: id, type: string, flags: [id, hidden] }
  - { name: conversation, type: string, references: conversation }
  - { name: author, type: string, faker: { pick: { values: [Customer, Agent] } } }
  - { name: body, type: string, flags: [searchable], faker: { sentence: { min_words: 4, max_words: 20 } } }
  - { name: sent, type: timestamp, faker: { date: { from: "-14d", spread: even } } }
