# yaml-language-server: $schema=./page-schema-1.json
# Page: usage — live resource usage from the metrics.k8s.io API
# (metrics-server). Charts stay empty until metrics-server has a sample
# window; that's expected on a freshly-started cluster. The Namespace select
# narrows the per-pod charts.
title: Usage
body:
  - kind: column
    children:
      - kind: select
        name: namespace
        table: namespaces
        params:
          column: name
          all_label: All namespaces
      - kind: row
        children:
          - kind: chart
            table: node_metrics
            params:
              x: name
              y: cpuMillicores
              label: CPU in use by node (mCPU)
              chart_type: bar
          - kind: chart
            table: node_metrics
            params:
              x: name
              y: memBytes
              label: Memory in use by node (bytes)
              chart_type: bar
      - kind: row
        children:
          - kind: chart
            table:
              script: |
                if namespace.value == "All namespaces" { scenery("pod_metrics") }
                else { scenery("pod_metrics").where("namespace", namespace.value) }
            params:
              x: name
              y: cpuMillicores
              label: CPU in use by pod (mCPU)
              chart_type: bar
          - kind: chart
            table:
              script: |
                if namespace.value == "All namespaces" { scenery("pod_metrics") }
                else { scenery("pod_metrics").where("namespace", namespace.value) }
            params:
              x: name
              y: memBytes
              label: Memory in use by pod (bytes)
              chart_type: bar
