# yaml-language-server: $schema=./page-schema-1.json
# Page: deployments — a binder. Custom Summary tab (rollout health + owned
# ReplicaSets/Pods) plus the auto-derived relation tabs. Polls every few
# seconds so replica counts track the live cluster.
title: Deployments
body:
  - kind: binder
    name: deployments
    table: deployments
    params:
      refresh_interval: 5
      views:
        - deployment_summary
