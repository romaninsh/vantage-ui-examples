# yaml-language-server: $schema=./page-schema-1.json
# Page: overview — the periscope view of the whole cluster: a dashboard of
# capacity charts. The Namespace select re-scopes only the namespaced charts
# (deployments / pods); the node charts are cluster-wide and ignore it.
#
# Charts plot one point per row (no aggregation): node capacity comes
# straight from the parsed quantity columns, so the bars are real cores /
# bytes.
title: Overview
body:
  - kind: column
    children:
      - kind: select
        name: namespace
        table: namespaces
        params:
          column: name
          all_label: All namespaces
      - kind: row
        children:
          - kind: chart
            table: nodes
            params:
              x: name
              y: cpuCapacityMillicores
              label: CPU capacity by node (mCPU)
              chart_type: bar
          - kind: chart
            table: nodes
            params:
              x: name
              y: memCapacityBytes
              label: Memory capacity by node (bytes)
              chart_type: bar
      - kind: row
        children:
          - kind: chart
            table:
              script: |
                if namespace.value == "All namespaces" { scenery("deployments") }
                else { scenery("deployments").where("namespace", namespace.value) }
            params:
              x: name
              y: replicas
              label: Desired replicas by deployment
              chart_type: bar
          - kind: chart
            table:
              script: |
                if namespace.value == "All namespaces" { scenery("pods") }
                else { scenery("pods").where("namespace", namespace.value) }
            params:
              x: name
              y: restarts
              label: Restarts by pod
              chart_type: bar
