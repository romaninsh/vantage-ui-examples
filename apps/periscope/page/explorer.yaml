# yaml-language-server: $schema=./page-schema-1.json
# Page: explorer — a vertical drill. Pick a namespace up top, its deployments
# stack below; pick a deployment, its pods stack below that. Each level is a
# reactive related() binding against the selection of the level above.
title: Explorer
body:
  - kind: grid
    name: namespaces
    table: namespaces
  - kind: grid
    name: deployments
    when: '${namespaces.selected_id} != ""'
    table:
      script: related("namespaces", "${namespaces.selected_id}", "deployments")
  - kind: grid
    name: pods
    when: '${deployments.selected_id} != ""'
    table:
      script: related("deployments", "${deployments.selected_id}", "pods")
