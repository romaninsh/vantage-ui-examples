# yaml-language-server: $schema=./page-schema-1.json
# Page: explorer — a vertical drill. Pick a namespace up top, its deployments
# stack below; pick a deployment, its pods stack below that. Each level is a
# reactive scenery(...).ref(...) binding against the selection of the level above.
title: Explorer
body:
  - kind: grid
    name: namespaces
    table: namespaces
  - kind: grid
    name: deployments
    when: '${namespaces.selected_id} != ""'
    table:
      script: scenery("namespaces").where("id", "${namespaces.selected_id}").ref("deployments")
  - kind: grid
    name: pods
    when: '${deployments.selected_id} != ""'
    table:
      script: scenery("deployments").where("id", "${deployments.selected_id}").ref("pods")
