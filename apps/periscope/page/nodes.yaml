# yaml-language-server: $schema=./page-schema-1.json
# Page: nodes — a binder. The node grid on top; selecting a node fills the
# bottom with a custom Summary tab (capacity + its pods) plus the
# auto-derived Pods relation tab.
title: Nodes
body:
  - kind: binder
    name: nodes
    table: nodes
    params:
      views:
        - node_summary
